min_version = "2024.11.1"

[tools]
node = "24"

[tasks.dev]
description = "Run the Mintlify local preview"
run = "npx -y mint@4.2.684 dev"

[tasks."public-safety"]
description = "Validate that the complete Mintlify tree is public-safe"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/assert-public-safety.ps1"

[tasks."public-safety:test"]
description = "Run focused fail-closed publication-boundary tests"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-public-safety.ps1"

[tasks."ci:bootstrap"]
description = "Confirm the mise-provided docs runtime"
run = "node --version"

[tasks."ci:fast"]
description = "Run the deterministic affected public-docs gate"
run = "mise run check"

[tasks."ci:lint"]
description = "Report deterministic docs lint findings without preview or external checks"
run = "mise run check"

[tasks."ci:security"]
description = "Report public publication-boundary security findings"
run = "mise run public-safety"

[tasks."ci:async"]
description = "Run external destinations, Mintlify validation, and local HTTP smoke outside the ordinary PR gate"
run = "mise run local:e2e"

[tasks.check]
description = "Validate public scope, docs.json, content, and local links"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-local-e2e.ps1 -SkipPreview -SkipExternalLinks"

[tasks."local:e2e"]
description = "Run the local docs gate"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-local-e2e.ps1"

[tasks."postlive:wait-exact-live"]
description = "Wait for the exact merged Mintlify deployment on docs.kombify.io"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/wait-for-exact-mintlify-deployment.ps1"

[tasks."remote:public-safety"]
description = "Verify the live public scope, forbidden routes, and generated projections"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/assert-remote-public-safety.ps1 -BaseUrl https://docs.kombify.io"
