name: Integrate Early Access

# Generated by kombify-workspace scripts/integration-lane-sync.mjs from
# .kombify/integration-lane.json (D-2026-11-01-08). Do not edit it.
# Pre-1.0 a pull request, a branch push and a merge run no workflow (D-2026-11-07-02). The Cloudflare cron
# Worker platform/merge-batch-cron dispatches this lane on main at 06:30 and 18:30 UTC; it skips a head it
# already integrated, dispatches this repository's Early Access workflows once for the accumulated range
# and exits without waiting. The concurrency group keeps one run and the newest pending one. A red
# dispatched workflow is recorded once as a known error by known-error.yml and blocks nothing: no push,
# merge, release or retry.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Integrate even when this main head was integrated before.
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: integrate-mintlify-docs
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'KombiverseLabs/mintlify-docs' && vars.KOMBIFY_INTEGRATE != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Skip an already integrated head
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          step="Dispatch the Early Access workflows for the accumulated range"
          last=""
          if [ "${FORCE:-false}" != true ]; then
            while read -r id sha; do
              [ -n "$id" ] || continue
              n="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id/jobs" --jq "[.jobs[].steps[] | select(.name == \"$step\" and .conclusion == \"success\")] | length")"
              if [ "$n" -gt 0 ]; then last="$sha"; break; fi
            done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/integrate.yml/runs?branch=main&status=success&per_page=10" --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | \"\(.id) \(.head_sha)\"")
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "${FORCE:-false}" != true ] && [ "$last" = "$HEAD_SHA" ]; then
            echo "$HEAD_SHA was integrated already; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Depot CI / Depot Metal is off for good (D-2026-11-01-06); read-only grep, nothing from the repository runs.
      - name: Guard - no Depot CI
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          bad=0
          if [ -d .depot/workflows ]; then
            while IFS= read -r f; do echo "::error file=$f::Depot CI is not used (D-2026-11-01-06): remove $f"; bad=1; done < <(find .depot/workflows -type f)
          fi
          for d in .github scripts; do
            [ -d "$d" ] || continue
            while IFS= read -r f; do
              case "$f" in */test-window-depot-recovery.mjs) continue;; esac
              echo "::error file=$f::Depot CI is not used (D-2026-11-01-06): remove $f"; bad=1
            done < <(grep -rIlE 'depot[[:space:]]+ci[[:space:]]+(run|dispatch|rerun|retry)' "$d" || true)
          done
          exit "$bad"

      # Pre-1.0 no pull request and no branch push starts a workflow (D-2026-11-01-08).
      # Exempt: none.
      - name: Guard - no pull request or non-main push triggers
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EXEMPT: ""
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const exempt = new Set((process.env.EXEMPT || '').split(/\s+/).filter(Boolean));
          let bad = 0;
          const fail = (name, message) => { console.log(`::error file=.github/workflows/${name}::${message}`); bad = 1; };
          for (const name of fs.readdirSync('.github/workflows')) {
            if (!/\.ya?ml$/.test(name) || exempt.has(name)) continue;
            const text = fs.readFileSync(`.github/workflows/${name}`, 'utf8').replace(/\r/g, '');
            const on = text.match(/^["']?on["']?:[^\n]*\n((?:(?:[ \t].*)?\n)*)/m);
            if (!on) continue;
            const body = on[1];
            if (/^\s+(pull_request|pull_request_target|merge_group)\s*:/m.test(body)) fail(name, 'pull request triggers are removed pre-1.0 (D-2026-11-01-08)');
            const push = body.match(/^(\s+)push\s*:[^\n]*\n((?:\1\s+.*\n|\s*\n)*)/m);
            if (push) {
              const inline = body.match(/^\s+push\s*:\s*\{(.*)\}/m);
              const flow = (inline ? inline[1] : push[2]).match(/branches\s*:\s*\[([^\]]*)\]/);
              const block = push[2].match(/branches\s*:\s*\n((?:\s+-\s+.*\n)+)/);
              const names = [...(flow ? flow[1] : block ? block[1] : '').matchAll(/[A-Za-z0-9_./*-]+/g)].map(m => m[0]).filter(n => n !== '-');
              if (!names.length || names.some(n => n.replace(/["']/g, '') !== 'main')) fail(name, 'only main may start a workflow by push pre-1.0 (D-2026-11-01-08)');
            }
          }
          process.exit(bad);
          JS

      # A run that GITHUB_TOKEN dispatches never fires workflow_run when it ends, so known-error.yml would stay silent:
      # the CI App token (org secret, actions: write on this repository only) dispatches instead; GITHUB_TOKEN is the fallback.
      - name: Mint the dispatch token
        id: app
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
          private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
          owner: KombiverseLabs
          repositories: mintlify-docs
          permission-actions: write

      - name: Dispatch the Early Access workflows for the accumulated range
        id: dispatch
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          LAST: ${{ steps.gate.outputs.last }}
          HEAD: ${{ github.sha }}
          LANE: '[{"workflow":"delivery.yml","paths":[]},{"workflow":"public-safety.yml","paths":["**/*.mdx","docs.json","public-safety-policy.json","schemas/public-safety-policy.schema.json","scripts/**","mise.toml",".github/workflows/public-safety.yml"]}]'
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const { LAST, HEAD, FORCE, GITHUB_REPOSITORY: repo, GITHUB_STEP_SUMMARY: summary } = process.env;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1e8 });
          const note = line => fs.appendFileSync(summary, `${line}\n`);
          let changed = null;
          if (LAST && FORCE !== 'true') {
            try { changed = gh('api', `repos/${repo}/compare/${LAST}...${HEAD}`, '--paginate', '--jq', '.files[].filename').split('\n').filter(Boolean); } catch { changed = null; }
          }
          const regex = glob => new RegExp(`^${glob
            .replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*\*\//g, '\u0001').replace(/\*\*/g, '\u0002').replace(/\*/g, '[^/]*')
            .replace(/\u0001/g, '(?:.*/)?').replace(/\u0002/g, '.*')}$`);
          const affected = paths => changed === null || paths.length === 0 || changed.some(file =>
            paths.filter(p => !p.startsWith('!')).some(p => regex(p).test(file)) &&
            !paths.filter(p => p.startsWith('!')).some(p => regex(p.slice(1)).test(file)));
          // Fire and forget: the lane never waits for what it dispatched; the known-error workflow records a red result.
          for (const { workflow, paths = [], inputs = {}, source_input } of JSON.parse(process.env.LANE)) {
            if (!affected(paths)) { note(`skip ${workflow} (no matching path)`); continue; }
            if (source_input) inputs[source_input] = HEAD;
            const flags = Object.entries(inputs).flatMap(([key, value]) => ['-f', `${key}=${value}`]);
            if (source_input) {
              // A dispatch resolves "main" at the time GitHub accepts it. Bind the
              // acknowledged original run to the accumulated head; an uncertain POST
              // is never replayed, and a failed integration keeps its range unclaimed.
              const apiFlags = Object.entries(inputs).flatMap(([key, value]) => ['-f', `inputs[${key}]=${value}`]);
              const ack = JSON.parse(gh('api', `repos/${repo}/actions/workflows/${workflow}/dispatches`,
                '--method', 'POST', '-f', 'ref=main', ...apiFlags, '-F', 'return_run_details=true'));
              if (!Number.isSafeInteger(ack.workflow_run_id) || ack.workflow_run_id < 1) throw new Error(`Dispatch acknowledgement missing for ${workflow}; inspect without replay`);
              const run = JSON.parse(gh('api', `repos/${repo}/actions/runs/${ack.workflow_run_id}`));
              if (run.id !== ack.workflow_run_id || run.head_sha !== HEAD || run.head_branch !== 'main' ||
                  run.event !== 'workflow_dispatch' || run.path !== `.github/workflows/${workflow}` ||
                  run.repository?.full_name !== repo || run.head_repository?.full_name !== repo) {
                throw new Error(`Dispatch source mismatch for ${workflow}; inspect original run ${ack.workflow_run_id}`);
              }
              note(`dispatched ${workflow} run=${run.id} source=${HEAD}`);
              continue;
            }
            try { gh('workflow', 'run', workflow, '--repo', repo, '--ref', 'main', ...flags); note(`dispatched ${workflow}${flags.length ? ` (${Object.entries(inputs).map(([k, v]) => `${k}=${v}`).join(', ')})` : ''}`); }
            catch (error) { const line = String(error.message).split('\n')[0]; console.log(`::warning::dispatch of ${workflow} failed: ${line}`); note(`dispatch of ${workflow} failed: ${line}`); }
          }
          JS
