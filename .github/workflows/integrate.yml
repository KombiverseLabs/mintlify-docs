name: Integrate Early Access

# Generated by kombify-workspace scripts/integration-lane-sync.mjs from
# .kombify/integration-lane.json (D-2026-11-01-08). Do not edit it.
# Pre-1.0 a pull request and a branch push run no workflow. This lane starts on a merge to main
# (settled, so a burst of merges is one run), every 30 minutes and by dispatch; it skips a main head it
# already integrated, dispatches this repository's Early Access workflows once for the accumulated range
# and waits for them. A run that skips cancels itself, so only an integrating run counts as the last one.
# A red workflow is recorded once as a known error (GitHub issue, fingerprinted; the CI backlog files the
# Beads task) and blocks nothing: no push, merge, release or retry.
on:
  push:
    branches: [main]
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Integrate even when this main head was integrated before.
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: integrate-mintlify-docs
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'KombiverseLabs/mintlify-docs' && vars.KOMBIFY_INTEGRATE != 'off'
    runs-on: ${{ vars.GHA_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Settle, then skip a superseded or already integrated head
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = push ]; then sleep 120; fi
          main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "$main" != "$HEAD_SHA" ]; then
            echo "Superseded by $main; the run of that push integrates the range." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true; sleep 60; exit 0
          fi
          last="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/integrate.yml/runs?branch=main&status=success&per_page=30" --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})][0].head_sha // empty")"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "${FORCE:-false}" != true ] && [ "$last" = "$main" ]; then
            echo "main $main was integrated already; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"; gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true; sleep 60; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "head=$main" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
          ref: ${{ steps.gate.outputs.head }}

      # Depot CI / Depot Metal is off for good (D-2026-11-01-06); read-only grep, nothing from the repository runs.
      - name: Guard - no Depot CI
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          bad=0
          if [ -d .depot/workflows ]; then
            while IFS= read -r f; do echo "::error file=$f::Depot CI is not used (D-2026-11-01-06): remove $f"; bad=1; done < <(find .depot/workflows -type f)
          fi
          for d in .github scripts; do
            [ -d "$d" ] || continue
            while IFS= read -r f; do
              case "$f" in */test-window-depot-recovery.mjs) continue;; esac
              echo "::error file=$f::Depot CI is not used (D-2026-11-01-06): remove $f"; bad=1
            done < <(grep -rIlE 'depot[[:space:]]+ci[[:space:]]+(run|dispatch|rerun|retry)' "$d" || true)
          done
          exit "$bad"

      # Pre-1.0 no pull request and no branch push starts a workflow (D-2026-11-01-08).
      # Exempt: none.
      - name: Guard - no pull request or non-main push triggers
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EXEMPT: ""
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const exempt = new Set((process.env.EXEMPT || '').split(/\s+/).filter(Boolean));
          let bad = 0;
          const fail = (name, message) => { console.log(`::error file=.github/workflows/${name}::${message}`); bad = 1; };
          for (const name of fs.readdirSync('.github/workflows')) {
            if (!/\.ya?ml$/.test(name) || exempt.has(name)) continue;
            const text = fs.readFileSync(`.github/workflows/${name}`, 'utf8').replace(/\r/g, '');
            const on = text.match(/^["']?on["']?:[^\n]*\n((?:(?:[ \t].*)?\n)*)/m);
            if (!on) continue;
            const body = on[1];
            if (/^\s+(pull_request|pull_request_target|merge_group)\s*:/m.test(body)) fail(name, 'pull request triggers are removed pre-1.0 (D-2026-11-01-08)');
            const push = body.match(/^(\s+)push\s*:[^\n]*\n((?:\1\s+.*\n|\s*\n)*)/m);
            if (push) {
              const inline = body.match(/^\s+push\s*:\s*\{(.*)\}/m);
              const flow = (inline ? inline[1] : push[2]).match(/branches\s*:\s*\[([^\]]*)\]/);
              const block = push[2].match(/branches\s*:\s*\n((?:\s+-\s+.*\n)+)/);
              const names = [...(flow ? flow[1] : block ? block[1] : '').matchAll(/[A-Za-z0-9_./*-]+/g)].map(m => m[0]).filter(n => n !== '-');
              if (!names.length || names.some(n => n.replace(/["']/g, '') !== 'main')) fail(name, 'only main may start a workflow by push pre-1.0 (D-2026-11-01-08)');
            }
          }
          process.exit(bad);
          JS

      - name: Dispatch the Early Access workflows for the accumulated range
        id: dispatch
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          LAST: ${{ steps.gate.outputs.last }}
          HEAD: ${{ steps.gate.outputs.head }}
          LANE: '[{"workflow":"delivery.yml","paths":[]},{"workflow":"public-safety.yml","paths":["**/*.mdx","docs.json","public-safety-policy.json","schemas/public-safety-policy.schema.json","scripts/**","mise.toml",".github/workflows/public-safety.yml"]}]'
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const { LAST, HEAD, FORCE, GITHUB_REPOSITORY: repo, RUNNER_TEMP: tmp, GITHUB_STEP_SUMMARY: summary } = process.env;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1e8 });
          const note = line => fs.appendFileSync(summary, `${line}\n`);
          let changed = null;
          if (LAST && FORCE !== 'true') {
            try { changed = gh('api', `repos/${repo}/compare/${LAST}...${HEAD}`, '--paginate', '--jq', '.files[].filename').split('\n').filter(Boolean); } catch { changed = null; }
          }
          const regex = glob => new RegExp(`^${glob
            .replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*\*\//g, '\u0001').replace(/\*\*/g, '\u0002').replace(/\*/g, '[^/]*')
            .replace(/\u0001/g, '(?:.*/)?').replace(/\u0002/g, '.*')}$`);
          const affected = paths => changed === null || paths.length === 0 || changed.some(file =>
            paths.filter(p => !p.startsWith('!')).some(p => regex(p).test(file)) &&
            !paths.filter(p => p.startsWith('!')).some(p => regex(p.slice(1)).test(file)));
          const dispatched = [];
          let failed = false;
          for (const { workflow, paths = [] } of JSON.parse(process.env.LANE)) {
            if (!affected(paths)) { note(`skip ${workflow} (no matching path)`); continue; }
            try { gh('workflow', 'run', workflow, '--repo', repo, '--ref', 'main'); dispatched.push(workflow); note(`dispatched ${workflow}`); }
            catch (error) { failed = true; console.log(`::error::dispatch of ${workflow} failed: ${String(error.message).split('\n')[0]}`); fs.appendFileSync(`${tmp}/red`, `${workflow} dispatch failed\n`); }
          }
          fs.writeFileSync(`${tmp}/dispatched`, `${dispatched.join('\n')}\n`);
          if (failed) fs.writeFileSync(`${tmp}/dispatch-failed`, '1');
          JS

      - name: Wait for the dispatched workflows; record a red one as a known error
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          STARTED: ${{ steps.dispatch.outputs.started }}
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { STARTED, HEAD_SHA, GITHUB_REPOSITORY: repo, RUNNER_TEMP: tmp, GITHUB_STEP_SUMMARY: summary, GITHUB_SERVER_URL: server, GITHUB_RUN_ID: runId } = process.env;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1e8, stdio: ['ignore', 'pipe', 'pipe'] });
          const note = line => fs.appendFileSync(summary, `${line}\n`);
          const sleep = ms => new Promise(done => setTimeout(done, ms));
          const read = file => { try { return fs.readFileSync(`${tmp}/${file}`, 'utf8').split('\n').filter(Boolean); } catch { return []; } };
          const GOOD = new Set(['success', 'skipped', 'neutral']);
          
          // A red step is a known error (D-2026-11-01-08): recorded once per fingerprint, never a block, never a retry.
          function record(workflow, conclusion, url, id) {
            let job = 'run', step = conclusion;
            try {
              const failed = JSON.parse(gh('api', `repos/${repo}/actions/runs/${id}/jobs`, '--jq', '[.jobs[] | select(.conclusion == "failure")][0] // {}') || '{}');
              job = failed.name || job;
              step = (failed.steps || []).find(item => item.conclusion === 'failure')?.name || step;
            } catch { /* the run page still names the failure */ }
            const fingerprint = crypto.createHash('sha1').update(`${workflow}|${job}|${step}`).digest('hex').slice(0, 12);
            const marker = `known-error-fingerprint: ${fingerprint}`;
            const body = `${marker}\n\n- First seen at ${HEAD_SHA}\n- Workflow: ${workflow}\n- Job: ${job}\n- Step: ${step}\n- Conclusion: ${conclusion}\n- Run: ${url || `${server}/${repo}/actions/runs/${runId}`}\n\nKnown error of the batched integration lane (D-2026-11-01-08). It blocks no push, merge or release; fix it in a new change. The CI backlog files the Beads task for this issue.`;
            try { gh('label', 'create', 'known-error', '--repo', repo, '--color', 'B60205', '--description', 'Recorded integration-lane failure; blocks nothing'); } catch { /* exists */ }
            const open = gh('issue', 'list', '--repo', repo, '--label', 'known-error', '--state', 'open', '--search', `${fingerprint} in:body`, '--json', 'number', '--jq', '.[0].number // empty').trim();
            if (open) {
              gh('issue', 'comment', open, '--repo', repo, '--body', `Seen again at ${HEAD_SHA}: ${url}`);
              note(`known error ${fingerprint} (${workflow} / ${step}) seen again: issue #${open}`);
            } else {
              const created = gh('issue', 'create', '--repo', repo, '--label', 'known-error', '--title', `Known error: ${workflow} / ${step} (${fingerprint})`, '--body', body).trim();
              note(`known error ${fingerprint} (${workflow} / ${step}) recorded: ${created}`);
            }
          }
          
          (async () => {
            const deadline = Date.now() + 40 * 60_000;
            await sleep(20_000);
            for (const workflow of read('dispatched')) {
              let row = null;
              while (Date.now() < deadline) {
                try {
                  row = JSON.parse(gh('api', `repos/${repo}/actions/workflows/${workflow}/runs?event=workflow_dispatch&branch=main&per_page=5`,
                    '--jq', `[.workflow_runs[] | select(.created_at >= "${STARTED}")][0] // null`) || 'null');
                } catch { row = null; }
                if (row?.status === 'completed') break;
                await sleep(30_000);
              }
              if (row?.status === 'completed') {
                note(`${workflow}: ${row.conclusion} ${row.html_url}`);
                if (!GOOD.has(row.conclusion)) try { record(workflow, row.conclusion, row.html_url, row.id); } catch (error) { note(`could not record ${workflow}: ${String(error.message).split('\n')[0]}`); }
              } else note(`${workflow}: still running after the lane's wait; its own result stands, nothing blocks`);
            }
            for (const line of read('red')) note(`dispatch problem: ${line}`);
            process.exit(0);
          })();
          JS
