name: Integrate Early Access

# Generated by kombify-workspace scripts/integration-lane-sync.mjs from
# .kombify/integration-lane.json (D-2026-11-01-08). Do not edit it.
# Pre-1.0 a pull request, a branch push and a merge run no workflow (D-2026-11-07-02). The Cloudflare cron
# Worker platform/merge-batch-cron dispatches this lane on main at 06:30 and 18:30 UTC; it skips a head it
# already integrated, dispatches this repository's Early Access workflows once for the accumulated range
# and exits without waiting. The concurrency group keeps one run and the newest pending one. A red
# dispatched workflow is recorded once as a known error by known-error.yml and blocks nothing: no push,
# merge, release or retry.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Integrate even when this main head was integrated before.
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: integrate-mintlify-docs
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'KombiverseLabs/mintlify-docs' && vars.KOMBIFY_INTEGRATE != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
      FORCE: ${{ inputs.force }}
      RECONCILIATIONS: '[]'
    steps:
      - name: Skip an already integrated head
        id: gate
        shell: bash
        env:
          LANE: '[{"workflow":"delivery.yml","paths":[]},{"workflow":"public-safety.yml","paths":["**/*.mdx","docs.json","public-safety-policy.json","schemas/public-safety-policy.schema.json","scripts/**","mise.toml",".github/workflows/public-safety.yml"]}]'
        run: |
          node - <<'JS'
          // The hash chain detects missing log records. Native run/job ownership supplies
          // provenance; this journal is deduplication evidence, never provider authority.
          const integrationJournal = (() => {
            const crypto = require('node:crypto');
            const prefix = 'KOMBIFY_INTEGRATION_JOURNAL ';
            const hash = value => crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');
            const key = ({ workflow, paths = [], inputs = {}, source_input }) => hash({ workflow, paths, inputs, ...(source_input ? { source_input } : {}) });
            const empty = () => ({ covered: {}, held: {}, unproven: {} });
            const decode = logs => {
              let previous = '', sequence = 0, invalid = false; const records = [];
              for (const line of logs.split(/\r?\n/)) {
                // Actions logs echo the inline script before executing it. Only an actual
                // stdout record after its native timestamp can be a journal frame.
                const content = line.replace(/^\d{4}-\d{2}-\d{2}T[0-9:.]+Z /, '');
                if (!content.startsWith(prefix)) continue;
                let frame; try { frame = JSON.parse(content.slice(prefix.length)); } catch { invalid = true; break; }
                const body = { sequence: frame.sequence, previous: frame.previous, data: frame.data };
                if (frame.sequence !== sequence || frame.previous !== previous || frame.digest !== hash(body)) { invalid = true; break; }
                records.push(frame.data); previous = frame.digest; sequence++;
              }
              return { records, complete: !invalid && records[0]?.type === 'start' && records.at(-1)?.type === 'end' };
            };
            const writer = () => { let sequence = 0, previous = ''; return data => {
              const body = { sequence: sequence++, previous, data }; previous = hash(body);
              process.stdout.write(prefix + JSON.stringify({ ...body, digest: previous }) + '\n');
            }; };
            return { key, empty, decode, writer };
          })();
          // These exact retired producers lacked stdout ACKs. A reviewed disposition
          // records its unknown effects; it never reconstructs a child by name or SHA.
          const integrationReconciliation = (() => {
            const crypto = require('node:crypto');
            const digest = value => crypto.createHash('sha256').update(value).digest('hex');
            const legacyDispatch = new Set([
              '34015fbe1ac270171ba8b151bb862f061f5e2971b55a4e201d1cb94f10ae0687',
              '526df921e54e9dc1624c10c2eabf30072187bc397aa6d9072c44667ad03a6c7d',
            ]);
            const fields = ['disposition', 'workflow', 'original_run_id', 'original_attempt', 'original_event', 'original_job_id', 'head', 'producer_sha256', 'lane_sha256', 'logs_sha256', 'debt_issue'];
            const validate = records => {
              if (!Array.isArray(records)) throw new Error('Integration reconciliations must be a finite array.');
              const slots = new Set();
              for (const record of records) {
                if (!record || Object.keys(record).length !== fields.length || fields.some(field => !Object.hasOwn(record, field)) ||
                    record.disposition !== 'terminal-unproven' || !/^[A-Za-z0-9_-]+\.ya?ml$/.test(record.workflow) ||
                    ![record.original_run_id, record.original_job_id].every(value => Number.isSafeInteger(value) && value > 0) || record.original_attempt !== 1 || !['push', 'workflow_dispatch'].includes(record.original_event) ||
                    !/^[a-f0-9]{40}$/.test(record.head) || ![record.producer_sha256, record.lane_sha256, record.logs_sha256].every(value => /^[a-f0-9]{64}$/.test(value)) ||
                    !/^platform-[a-z0-9]+(?:\.[a-z0-9]+)*$/.test(record.debt_issue)) throw new Error('Invalid finite integration reconciliation record.');
                const key = `${record.original_run_id}:${record.workflow}`;
                if (slots.has(key)) throw new Error('Duplicate integration reconciliation slot.');
                slots.add(key);
              }
              return records;
            };
            const prove = (record, { repo, held, run, job, producer, lane, logs }) => {
              if (held.reason !== 'incomplete-native-journal' || held.child_run_id || held.key || held.original_run_id !== record.original_run_id || held.head !== record.head ||
                  run.id !== record.original_run_id || run.run_attempt !== record.original_attempt || run.status !== 'completed' || run.head_sha !== record.head ||
                  run.repository?.full_name !== repo || run.head_repository?.full_name !== repo || run.head_branch !== 'main' || run.path !== '.github/workflows/integrate.yml' || run.event !== record.original_event ||
                  job.id !== record.original_job_id || job.run_id !== run.id || job.run_attempt !== record.original_attempt || job.name !== 'integrate' || job.status !== 'completed') {
                throw new Error('Original native integration identity or terminal state does not match reconciliation.');
              }
              if (digest(producer) !== record.producer_sha256 || digest(lane) !== record.lane_sha256 || digest(logs) !== record.logs_sha256) throw new Error('Original immutable integration evidence digest mismatch.');
              const step = producer.split('      - name: Dispatch the Early Access workflows for the accumulated range\n');
              if (step.length !== 2) throw new Error('Original pre-journal dispatch source is ambiguous.');
              const block = step[1].split("          node - <<'JS'\n");
              if (block.length !== 2 || !block[1].endsWith('          JS\n')) throw new Error('Original pre-journal dispatch source is unrecognized.');
              const script = block[1].slice(0, -'          JS\n'.length).split('\n').slice(0, -1).map(line => line.slice(10)).join('\n') + '\n';
              if (!legacyDispatch.has(digest(script))) throw new Error('Only the admitted pre-journal producer can settle terminal-unproven.');
              const steps = job.steps?.filter(value => value.name === 'Dispatch the Early Access workflows for the accumulated range') ?? [];
              if (steps.length !== 1 || steps[0].status !== 'completed' || !steps[0].started_at || steps[0].conclusion === 'skipped') throw new Error('Original native dispatch step was not terminal.');
              const entries = JSON.parse(lane).dispatch;
              const matches = entries?.filter(entry => entry.workflow === record.workflow) ?? [];
              if (matches.length !== 1) throw new Error('Original immutable integration slot is unavailable or ambiguous.');
              return { disposition: record.disposition, original_run_id: run.id, original_job_id: job.id, head: record.head,
                key: integrationJournal.key(matches[0]), debt_issue: record.debt_issue, reconciliation_digest: digest(JSON.stringify(record)) };
            };
            return { validate, prove };
          })();
          if (typeof module !== 'undefined') module.exports = integrationReconciliation;
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const { HEAD_SHA: head, GITHUB_REPOSITORY: repo, GITHUB_RUN_ID: ownRun, GITHUB_OUTPUT: output, GITHUB_STEP_SUMMARY: summary } = process.env;
          if (process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('Integration attempts are not rerun; a new lane invocation reconciles original native evidence without replay.');
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1e8 });
          const api = endpoint => JSON.parse(gh('api', endpoint));
          const pages = (endpoint, field) => {
            const result = JSON.parse(gh('api', endpoint, '--paginate', '--slurp'));
            if (!Array.isArray(result) || result.some(page => !Array.isArray(page[field]))) throw new Error('Native integration inventory unavailable; nothing dispatched.');
            return result.flatMap(page => page[field]);
          };
          const note = line => fs.appendFileSync(summary, line + '\n');
          const state = integrationJournal.empty(); let last = '';
          const runs = pages(`repos/${repo}/actions/workflows/integrate.yml/runs?branch=main&per_page=100`, 'workflow_runs');
          const candidates = runs.filter(run => String(run.id) !== ownRun && run.head_branch === 'main' && run.path === '.github/workflows/integrate.yml' && run.repository?.full_name === repo);
          let found = false;
          for (const run of candidates) {
            if (!Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) throw new Error('Native integration attempt unavailable; nothing dispatched.');
            // A forbidden rerun can have no dispatch while attempt 1 already wrote intents.
            // Inspect original attempts too, rather than losing their deduplication evidence.
            for (let attempt = run.run_attempt; attempt >= 1; attempt--) {
              const jobs = pages(`repos/${repo}/actions/runs/${run.id}/attempts/${attempt}/jobs?per_page=100`, 'jobs');
              const matches = jobs.filter(job => job.name === 'integrate');
              if (matches.length > 1) throw new Error('Native integration job is ambiguous; nothing dispatched.');
              if (!matches.length) continue;
              const job = matches[0];
              if (job.run_id !== run.id || job.run_attempt !== attempt) throw new Error('Native integration job identity mismatch; nothing dispatched.');
              const steps = job.steps?.filter(step => step.name === 'Dispatch the Early Access workflows for the accumulated range') ?? [];
              if (steps.length > 1) throw new Error('Native integration dispatch step is ambiguous; nothing dispatched.');
              const step = steps[0];
              if (!step?.started_at || step.status === 'queued' || step.conclusion === 'skipped') continue;
              let journal;
              try { journal = integrationJournal.decode(gh('api', `repos/${repo}/actions/jobs/${job.id}/logs`, '--allow-escape-sequences')); } catch {
                note(`Native integration log unavailable for job ${job.id}; original evidence stays held without replay.`);
                journal = { records: [], complete: false };
              }
              const first = journal.records[0], end = journal.records.at(-1);
              if (first && (first.type !== 'start' || first.run_id !== run.id || first.attempt !== attempt || first.repository !== repo || first.head !== run.head_sha)) {
                throw new Error('Native integration journal identity mismatch; nothing dispatched.');
              }
              if (journal.complete) {
                if (!end.state?.covered || !end.state?.held || !Number.isSafeInteger(end.failed)) throw new Error('Native integration journal state unavailable; nothing dispatched.');
                Object.assign(state.covered, end.state.covered); Object.assign(state.held, end.state.held); Object.assign(state.unproven, end.state.unproven);
                last = end.failed === 0 ? run.head_sha : first.last;
              } else {
                // A partial log can still preserve exact ACKs. Without its end seal it
                // proves no absence of other writes, so all remaining prior slots stay held.
                const prior = JSON.parse(Buffer.from(gh('api', `repos/${repo}/contents/.kombify/integration-lane.json?ref=${run.head_sha}`, '--jq', '.content').replace(/\s/g, ''), 'base64').toString('utf8'));
                if (!Array.isArray(prior.dispatch)) throw new Error('Prior immutable lane inventory unavailable; nothing dispatched.');
                Object.assign(state.covered, first?.state?.covered); Object.assign(state.held, first?.state?.held); Object.assign(state.unproven, first?.state?.unproven);
                last = first?.last ?? '';
                for (const entry of prior.dispatch) {
                  state.held[entry.workflow] = { reason: 'incomplete-native-journal', original_run_id: run.id, head: run.head_sha };
                  delete state.covered[entry.workflow];
                }
                for (const record of journal.records.slice(1)) {
                  if (!['intent', 'ack-received', 'ack'].includes(record.type) || typeof record.workflow !== 'string') continue;
                  const { type, workflow, ...value } = record;
                  state.held[workflow] = { ...value, reason: type === 'intent' ? 'unacknowledged-native-intent' : 'ack-native-readback-pending' };
                  delete state.covered[workflow];
                }
              }
              found = true; break;
            }
            if (found) break;
          }
          const reconciliations = integrationReconciliation.validate(JSON.parse(process.env.RECONCILIATIONS || '[]'));
          const originalEvidence = new Map();
          for (const record of reconciliations) {
            const held = state.held[record.workflow];
            if (!held || held.original_run_id !== record.original_run_id || held.head !== record.head) continue;
            let evidence = originalEvidence.get(record.original_run_id);
            if (!evidence) {
              const run = api(`repos/${repo}/actions/runs/${record.original_run_id}`);
              const jobs = pages(`repos/${repo}/actions/runs/${record.original_run_id}/attempts/${record.original_attempt}/jobs?per_page=100`, 'jobs');
              const matches = jobs.filter(job => job.name === 'integrate');
              if (matches.length !== 1) throw new Error('Original reconciliation job is unavailable or ambiguous.');
              const content = file => Buffer.from(gh('api', `repos/${repo}/contents/${file}?ref=${record.head}`, '--jq', '.content').replace(/\s/g, ''), 'base64').toString('utf8');
              evidence = { repo, run, job: matches[0], producer: content('.github/workflows/integrate.yml'), lane: content('.kombify/integration-lane.json'),
                logs: gh('api', `repos/${repo}/actions/jobs/${matches[0].id}/logs`, '--allow-escape-sequences') };
              originalEvidence.set(record.original_run_id, evidence);
            }
            state.unproven[record.workflow] = integrationReconciliation.prove(record, { ...evidence, held });
            delete state.held[record.workflow];
            note(`terminal-unproven ${record.workflow}: original lane ${record.original_run_id}; unknown effects remain in ${record.debt_issue}; only a changed source may proceed.`);
          }
          // Never search by SHA/name for a substitute child. Only the ID returned by the
          // original native dispatch can settle its ACK, including a failed readback.
          const reconcile = (workflow, value) => {
            let native;
            try { native = api(`repos/${repo}/actions/runs/${value.child_run_id}`); } catch { native = null; }
            if (!native || native.id !== value.child_run_id || native.repository?.full_name !== repo || native.head_repository?.full_name !== repo || native.head_branch !== 'main' || native.path !== `.github/workflows/${workflow}` || native.event !== 'workflow_dispatch') return 'ack-native-readback-unavailable';
            if (value.expect_source && native.head_sha !== value.head) return 'ack-native-source-mismatch';
            return native.status === 'completed' ? '' : 'ack-child-active';
          };
          for (const [workflow, covered] of Object.entries(state.covered)) {
            if (state.held[workflow]) { delete state.covered[workflow]; continue; }
            const reason = reconcile(workflow, covered);
            if (reason) { state.held[workflow] = { ...covered, reason }; delete state.covered[workflow]; }
          }
          for (const [workflow, held] of Object.entries(state.held)) {
            if (!Number.isSafeInteger(held.child_run_id) || held.child_run_id < 1) continue;
            const reason = reconcile(workflow, held);
            if (reason) state.held[workflow] = { ...held, reason };
            else {
              const { key, head, expect_source, child_run_id } = held;
              state.covered[workflow] = { key, head, expect_source, child_run_id }; delete state.held[workflow];
            }
          }
          fs.appendFileSync(output, `last=${last}\nstate=${Buffer.from(JSON.stringify(state)).toString('base64')}\n`);
          if (last === head && process.env.FORCE !== 'true' && !Object.keys(state.held).length) {
            note(`${head} was integrated already; nothing to do.`); fs.appendFileSync(output, 'run=false\n');
          } else {
            for (const [workflow, held] of Object.entries(state.held)) note(`held ${workflow}: ${held.reason}; original lane ${held.original_run_id ?? 'recorded ACK'}, no replay`);
            fs.appendFileSync(output, 'run=true\n');
          }
          JS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Depot CI / Depot Metal is off for good (D-2026-11-01-06); read-only grep, nothing from the repository runs.
      - name: Guard - no Depot CI
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          bad=0
          if [ -d .depot/workflows ]; then
            while IFS= read -r f; do echo "::error file=$f::Depot CI is not used (D-2026-11-01-06): remove $f"; bad=1; done < <(find .depot/workflows -type f)
          fi
          for d in .github scripts; do
            [ -d "$d" ] || continue
            while IFS= read -r f; do
              case "$f" in */test-window-depot-recovery.mjs) continue;; esac
              echo "::error file=$f::Depot CI is not used (D-2026-11-01-06): remove $f"; bad=1
            done < <(grep -rIlE 'depot[[:space:]]+ci[[:space:]]+(run|dispatch|rerun|retry)' "$d" || true)
          done
          exit "$bad"

      # Pre-1.0 no pull request and no branch push starts a workflow (D-2026-11-01-08).
      # Exempt: none.
      - name: Guard - no pull request or non-main push triggers
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EXEMPT: ""
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const exempt = new Set((process.env.EXEMPT || '').split(/\s+/).filter(Boolean));
          let bad = 0;
          const fail = (name, message) => { console.log(`::error file=.github/workflows/${name}::${message}`); bad = 1; };
          for (const name of fs.readdirSync('.github/workflows')) {
            if (!/\.ya?ml$/.test(name) || exempt.has(name)) continue;
            const text = fs.readFileSync(`.github/workflows/${name}`, 'utf8').replace(/\r/g, '');
            const on = text.match(/^["']?on["']?:[^\n]*\n((?:(?:[ \t].*)?\n)*)/m);
            if (!on) continue;
            const body = on[1];
            if (/^\s+(pull_request|pull_request_target|merge_group)\s*:/m.test(body)) fail(name, 'pull request triggers are removed pre-1.0 (D-2026-11-01-08)');
            const push = body.match(/^(\s+)push\s*:[^\n]*\n((?:\1\s+.*\n|\s*\n)*)/m);
            if (push) {
              const inline = body.match(/^\s+push\s*:\s*\{(.*)\}/m);
              const flow = (inline ? inline[1] : push[2]).match(/branches\s*:\s*\[([^\]]*)\]/);
              const block = push[2].match(/branches\s*:\s*\n((?:\s+-\s+.*\n)+)/);
              const names = [...(flow ? flow[1] : block ? block[1] : '').matchAll(/[A-Za-z0-9_./*-]+/g)].map(m => m[0]).filter(n => n !== '-');
              if (!names.length || names.some(n => n.replace(/["']/g, '') !== 'main')) fail(name, 'only main may start a workflow by push pre-1.0 (D-2026-11-01-08)');
            }
          }
          process.exit(bad);
          JS

      # A run that GITHUB_TOKEN dispatches never fires workflow_run when it ends, so known-error.yml would stay silent:
      # require the CI App token for every dispatch, including lanes without source_input; never silently lose error recording.
      - name: Mint the dispatch token
        id: app
        if: steps.gate.outputs.run == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
          private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
          owner: KombiverseLabs
          repositories: mintlify-docs
          permission-actions: write

      - name: Require the CI App dispatch token
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            message="CI App dispatch token missing. Configure vars.KOMBIFY_CI_APP_ID and secrets.KOMBIFY_CI_APP_PRIVATE_KEY, and install kombify-ci with Actions write access to this repository. GITHUB_TOKEN fallback is disabled."
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Dispatch the Early Access workflows for the accumulated range
        id: dispatch
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LAST: ${{ steps.gate.outputs.last }}
          LANE_STATE: ${{ steps.gate.outputs.state }}
          HEAD: ${{ github.sha }}
          LANE: '[{"workflow":"delivery.yml","paths":[]},{"workflow":"public-safety.yml","paths":["**/*.mdx","docs.json","public-safety-policy.json","schemas/public-safety-policy.schema.json","scripts/**","mise.toml",".github/workflows/public-safety.yml"]}]'
        run: |
          node - <<'JS'
          // The hash chain detects missing log records. Native run/job ownership supplies
          // provenance; this journal is deduplication evidence, never provider authority.
          const integrationJournal = (() => {
            const crypto = require('node:crypto');
            const prefix = 'KOMBIFY_INTEGRATION_JOURNAL ';
            const hash = value => crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');
            const key = ({ workflow, paths = [], inputs = {}, source_input }) => hash({ workflow, paths, inputs, ...(source_input ? { source_input } : {}) });
            const empty = () => ({ covered: {}, held: {}, unproven: {} });
            const decode = logs => {
              let previous = '', sequence = 0, invalid = false; const records = [];
              for (const line of logs.split(/\r?\n/)) {
                // Actions logs echo the inline script before executing it. Only an actual
                // stdout record after its native timestamp can be a journal frame.
                const content = line.replace(/^\d{4}-\d{2}-\d{2}T[0-9:.]+Z /, '');
                if (!content.startsWith(prefix)) continue;
                let frame; try { frame = JSON.parse(content.slice(prefix.length)); } catch { invalid = true; break; }
                const body = { sequence: frame.sequence, previous: frame.previous, data: frame.data };
                if (frame.sequence !== sequence || frame.previous !== previous || frame.digest !== hash(body)) { invalid = true; break; }
                records.push(frame.data); previous = frame.digest; sequence++;
              }
              return { records, complete: !invalid && records[0]?.type === 'start' && records.at(-1)?.type === 'end' };
            };
            const writer = () => { let sequence = 0, previous = ''; return data => {
              const body = { sequence: sequence++, previous, data }; previous = hash(body);
              process.stdout.write(prefix + JSON.stringify({ ...body, digest: previous }) + '\n');
            }; };
            return { key, empty, decode, writer };
          })();
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const { LAST, HEAD, GITHUB_REPOSITORY: repo, GITHUB_STEP_SUMMARY: summary } = process.env;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1e8 });
          const note = line => fs.appendFileSync(summary, line + '\n');
          const entries = JSON.parse(process.env.LANE);
          const state = process.env.LANE_STATE ? JSON.parse(Buffer.from(process.env.LANE_STATE, 'base64').toString('utf8')) : integrationJournal.empty();
          const write = integrationJournal.writer();
          write({ type: 'start', repository: repo, run_id: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), head: HEAD, last: LAST,
            state, entries: entries.map(entry => ({ workflow: entry.workflow, key: integrationJournal.key(entry) })) });
          const regex = glob => new RegExp(`^${glob.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*\*\//g, '\u0001').replace(/\*\*/g, '\u0002').replace(/\*/g, '[^/]*').replace(/\u0001/g, '(?:.*/)?').replace(/\u0002/g, '.*')}$`);
          const changedSince = last => {
            if (!last) return null;
            if (last === HEAD) return [];
            try { return gh('api', `repos/${repo}/compare/${last}...${HEAD}`, '--paginate', '--jq', '.files[].filename').split('\n').filter(Boolean); } catch { return null; }
          };
          const affected = (paths, changed) => changed === null || paths.length === 0 || changed.some(file => paths.filter(p => !p.startsWith('!')).some(p => regex(p).test(file)) && !paths.filter(p => p.startsWith('!')).some(p => regex(p.slice(1)).test(file)));
          let failed = 0;
          for (const entry of entries) {
            const { workflow, paths = [], inputs: authoredInputs = {}, source_input } = entry;
            const key = integrationJournal.key(entry), prior = state.covered[workflow], unproven = state.unproven?.[workflow];
