name: Integrate Early Access

# Generated by kombify-workspace scripts/integration-lane-sync.mjs from
# .kombify/integration-lane.json (D-2026-11-01-08). Do not edit it.
# Pre-1.0 a pull request, a branch push and a merge run no workflow (D-2026-11-07-02). The Cloudflare cron
# Worker platform/merge-batch-cron dispatches this lane on main at 06:30 and 18:30 UTC; it skips a head it
# already integrated, dispatches this repository's Early Access workflows once for the accumulated range
# and exits without waiting. The concurrency group keeps one run and the newest pending one. A red
# dispatched workflow is not covered: the next lane dispatches it once more at its head. It is recorded
# once as a known error by known-error.yml and blocks no push, merge or release.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Integrate even when this main head was integrated before.
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: integrate-mintlify-docs
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'KombiverseLabs/mintlify-docs' && vars.KOMBIFY_INTEGRATE != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Skip an already integrated head
        id: gate
        shell: bash
        env:
          LANE: '[{"workflow":"delivery.yml","paths":[]}]'
        run: |
          node - <<'JS'
          // The hash chain detects missing log records. Native run/job ownership supplies
          // provenance; this journal is deduplication evidence, never provider authority.
          const integrationJournal = (() => {
            const crypto = require('node:crypto');
            const prefix = 'KOMBIFY_INTEGRATION_JOURNAL ';
            const hash = value => crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');
            const key = ({ workflow, paths = [], inputs = {}, source_input }) => hash({ workflow, paths, inputs, ...(source_input ? { source_input } : {}) });
            const empty = () => ({ covered: {}, held: {}, failed: {} });
            const decode = logs => {
              let previous = '', sequence = 0, invalid = false; const records = [];
              for (const line of logs.split(/\r?\n/)) {
                // Actions logs echo the inline script before executing it. Only an actual
                // stdout record after its native timestamp can be a journal frame.
                const content = line.replace(/^\d{4}-\d{2}-\d{2}T[0-9:.]+Z /, '');
                if (!content.startsWith(prefix)) continue;
                let frame; try { frame = JSON.parse(content.slice(prefix.length)); } catch { invalid = true; break; }
                const body = { sequence: frame.sequence, previous: frame.previous, data: frame.data };
                if (frame.sequence !== sequence || frame.previous !== previous || frame.digest !== hash(body)) { invalid = true; break; }
                records.push(frame.data); previous = frame.digest; sequence++;
              }
              return { records, complete: !invalid && records[0]?.type === 'start' && records.at(-1)?.type === 'end' };
            };
            const writer = () => { let sequence = 0, previous = ''; return data => {
              const body = { sequence: sequence++, previous, data }; previous = hash(body);
              process.stdout.write(prefix + JSON.stringify({ ...body, digest: previous }) + '\n');
            }; };
            return { key, empty, decode, writer };
          })();
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const { HEAD_SHA: head, GITHUB_REPOSITORY: repo, GITHUB_OUTPUT: output, GITHUB_STEP_SUMMARY: summary } = process.env;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1e8 });
          const api = endpoint => JSON.parse(gh('api', endpoint));
          const pages = (endpoint, field) => {
            const result = JSON.parse(gh('api', endpoint, '--paginate', '--slurp'));
            if (!Array.isArray(result) || result.some(page => !Array.isArray(page[field]))) throw new Error('Native integration inventory unavailable; nothing dispatched.');
            return result.flatMap(page => page[field]);
          };
          const note = line => fs.appendFileSync(summary, line + '\n');
          const state = integrationJournal.empty(); let last = '', latest = '';
          const runs = pages(`repos/${repo}/actions/workflows/integrate.yml/runs?branch=main&per_page=100`, 'workflow_runs');
          // The own run is a candidate too: its current attempt has not started its dispatch step yet,
          // and an earlier attempt of a rerun supplies its ACKs.
          const candidates = runs.filter(run => run.head_branch === 'main' && run.path === '.github/workflows/integrate.yml' && run.repository?.full_name === repo);
          let found = false;
          for (const run of candidates) {
            if (!Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) throw new Error('Native integration attempt unavailable; nothing dispatched.');
            // An attempt without a started dispatch step or a readable journal falls back to the earlier
            // attempts of the same run, then to older runs.
            for (let attempt = run.run_attempt; attempt >= 1; attempt--) {
              const jobs = pages(`repos/${repo}/actions/runs/${run.id}/attempts/${attempt}/jobs?per_page=100`, 'jobs');
              const matches = jobs.filter(job => job.name === 'integrate');
              if (matches.length > 1) throw new Error('Native integration job is ambiguous; nothing dispatched.');
              if (!matches.length) continue;
              const job = matches[0];
              if (job.run_id !== run.id || job.run_attempt !== attempt) throw new Error('Native integration job identity mismatch; nothing dispatched.');
              const steps = job.steps?.filter(step => step.name === 'Dispatch the Early Access workflows for the accumulated range') ?? [];
              if (steps.length > 1) throw new Error('Native integration dispatch step is ambiguous; nothing dispatched.');
              const step = steps[0];
              if (!step?.started_at || step.status === 'queued' || step.conclusion === 'skipped') continue;
              let journal;
              try { journal = integrationJournal.decode(gh('api', `repos/${repo}/actions/jobs/${job.id}/logs`, '--allow-escape-sequences')); } catch {
                journal = { records: [], complete: false };
              }
              if (!journal.records.length) { note(`No readable integration journal in job ${job.id}; an earlier journal is used.`); continue; }
              const first = journal.records[0], end = journal.records.at(-1);
              if (first && (first.type !== 'start' || first.run_id !== run.id || first.attempt !== attempt || first.repository !== repo || first.head !== run.head_sha)) {
                throw new Error('Native integration journal identity mismatch; nothing dispatched.');
              }
              if (journal.complete) {
                if (!end.state?.covered || !end.state?.held || !Number.isSafeInteger(end.failed)) throw new Error('Native integration journal state unavailable; nothing dispatched.');
                Object.assign(state.covered, end.state.covered); Object.assign(state.held, end.state.held); Object.assign(state.failed, end.state.failed);
                last = end.failed === 0 ? run.head_sha : first.last;
              } else {
                // A truncated journal keeps the state it started from and its exact ACKs. An entry it recorded
                // without a settled ACK is not covered and is dispatched again when its paths changed since its
                // last acknowledged source: an Early Access deploy of an immutable source is idempotent and
                // schema publication is ledger-guarded.
                Object.assign(state.covered, first.state?.covered); Object.assign(state.held, first.state?.held); Object.assign(state.failed, first.state?.failed);
                last = first.last ?? '';
                for (const record of journal.records.slice(1)) {
                  if (!['intent', 'ack-received', 'ack'].includes(record.type) || typeof record.workflow !== 'string') continue;
                  const { type, workflow, ...value } = record;
                  state.held[workflow] = value;
                  delete state.covered[workflow];
                }
              }
              found = true; latest = run.head_sha; break;
            }
            if (found) break;
          }
          // Never search by SHA/name for a substitute child. Only the ID returned by the
          // original native dispatch can settle its ACK, including a failed readback.
          // The child runs on main and builds the source input, so main may have moved past the source.
          const onMain = (source, main) => {
            try { return source === main || ['identical', 'ahead'].includes(gh('api', `repos/${repo}/compare/${source}...${main}`, '--jq', '.status').trim()); } catch { return false; }
          };
          const reconcile = (workflow, value) => {
            let native;
            try { native = api(`repos/${repo}/actions/runs/${value.child_run_id}`); } catch { native = null; }
            if (!native || native.id !== value.child_run_id || native.repository?.full_name !== repo || native.head_repository?.full_name !== repo || native.head_branch !== 'main' || native.path !== `.github/workflows/${workflow}` || native.event !== 'workflow_dispatch') return 'ack-native-readback-unavailable';
            if (value.expect_source && !onMain(value.head, native.head_sha)) return 'ack-native-source-mismatch';
            if (native.status !== 'completed') return 'ack-child-active';
            // A child that did not succeed did not deliver its source: it is not covered (owner 2026-11-09).
            return ['success', 'skipped', 'neutral'].includes(native.conclusion) ? '' : `child-${native.conclusion}`;
          };
          // Only an acknowledged child that is still running stays held, so its source is not dispatched twice.
          // A child that failed is recorded as failed: the next lane dispatches it once more at its head, even
          // without a new change, unless that dispatch already was the retry. Every other unsettled entry (an
          // intent without ACK, an unreadable or mismatching child) is simply not covered and is dispatched again
          // when affected.
          for (const workflow of new Set([...Object.keys(state.held), ...Object.keys(state.covered)])) {
            const value = state.held[workflow] ?? state.covered[workflow];
            delete state.held[workflow]; delete state.covered[workflow];
            const acknowledged = Number.isSafeInteger(value.child_run_id) && value.child_run_id > 0;
            // An acknowledged child is newer than a recorded failure of the same entry and replaces it.
            if (acknowledged) delete state.failed[workflow];
            const reason = acknowledged ? reconcile(workflow, value) : 'unacknowledged-native-intent';
            if (reason === 'ack-child-active') state.held[workflow] = { ...value, reason };
            else if (reason.startsWith('child-')) {
              const { key, head, expect_source, child_run_id, retried = false } = value;
              state.failed[workflow] = { key, head, expect_source, child_run_id, conclusion: reason.slice(6), retried };
              note(`${workflow} is not covered: child run ${child_run_id} ended ${reason.slice(6)}; ${retried ? 'it was the retry, so it is dispatched again when affected' : 'this lane retries it once'}.`);
            } else if (reason) note(`${workflow} is not covered (${reason}); it is dispatched again when affected.`);
            else {
              const { key, head, expect_source, child_run_id } = value;
              state.covered[workflow] = { key, head, expect_source, child_run_id };
            }
          }
          fs.appendFileSync(output, `last=${last}\nstate=${Buffer.from(JSON.stringify(state)).toString('base64')}\n`);
          const retries = Object.entries(state.failed).filter(([workflow, value]) => !value.retried && !state.held[workflow]).map(([workflow]) => workflow);
          if (last === head && process.env.FORCE !== 'true' && !retries.length) {
            note(`${head} was integrated already; nothing to do.`); fs.appendFileSync(output, 'run=false\n');
          } else if (latest && latest !== head && onMain(head, latest)) {
            // A rerun of an older lane never dispatches a source older than the newest lane's.
            note(`${head} is older than ${latest}, which a newer lane already handled; nothing to do.`); fs.appendFileSync(output, 'run=false\n');
          } else {
            for (const workflow of retries) note(`${workflow}: retried once for its failed child run ${state.failed[workflow].child_run_id}`);
            for (const [workflow, held] of Object.entries(state.held)) note(`${workflow}: child run ${held.child_run_id} for ${held.head} is still active`);
            fs.appendFileSync(output, 'run=true\n');
          }
          JS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Depot CI / Depot Metal is off for good (D-2026-11-01-06); read-only grep, nothing from the repository runs.
      - name: Guard - no Depot CI
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          bad=0
          if [ -d .depot/workflows ]; then
            while IFS= read -r f; do echo "::error file=$f::Depot CI is not used (D-2026-11-01-06): remove $f"; bad=1; done < <(find .depot/workflows -type f)
          fi
          for d in .github scripts; do
            [ -d "$d" ] || continue
            while IFS= read -r f; do
              case "$f" in */test-window-depot-recovery.mjs) continue;; esac
              echo "::error file=$f::Depot CI is not used (D-2026-11-01-06): remove $f"; bad=1
            done < <(grep -rIlE 'depot[[:space:]]+ci[[:space:]]+(run|dispatch|rerun|retry)' "$d" || true)
          done
          exit "$bad"

      # Pre-1.0 no pull request and no branch push starts a workflow (D-2026-11-01-08).
      # Exempt: none.
      - name: Guard - no pull request or non-main push triggers
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EXEMPT: ""
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const exempt = new Set((process.env.EXEMPT || '').split(/\s+/).filter(Boolean));
          let bad = 0;
          const fail = (name, message) => { console.log(`::error file=.github/workflows/${name}::${message}`); bad = 1; };
          for (const name of fs.readdirSync('.github/workflows')) {
            if (!/\.ya?ml$/.test(name) || exempt.has(name)) continue;
            const text = fs.readFileSync(`.github/workflows/${name}`, 'utf8').replace(/\r/g, '');
            const on = text.match(/^["']?on["']?:[^\n]*\n((?:(?:[ \t].*)?\n)*)/m);
            if (!on) continue;
            const body = on[1];
            if (/^\s+(pull_request|pull_request_target|merge_group)\s*:/m.test(body)) fail(name, 'pull request triggers are removed pre-1.0 (D-2026-11-01-08)');
            const push = body.match(/^(\s+)push\s*:[^\n]*\n((?:\1\s+.*\n|\s*\n)*)/m);
            if (push) {
              const inline = body.match(/^\s+push\s*:\s*\{(.*)\}/m);
              const flow = (inline ? inline[1] : push[2]).match(/branches\s*:\s*\[([^\]]*)\]/);
              const block = push[2].match(/branches\s*:\s*\n((?:\s+-\s+.*\n)+)/);
              const names = [...(flow ? flow[1] : block ? block[1] : '').matchAll(/[A-Za-z0-9_./*-]+/g)].map(m => m[0]).filter(n => n !== '-');
              if (!names.length || names.some(n => n.replace(/["']/g, '') !== 'main')) fail(name, 'only main may start a workflow by push pre-1.0 (D-2026-11-01-08)');
            }
          }
          process.exit(bad);
          JS

      # A run that GITHUB_TOKEN dispatches never fires workflow_run when it ends, so known-error.yml would stay silent:
      # contents read serves the compare reads of the changed paths and the dispatched child's source.
      # require the CI App token for every dispatch, including lanes without source_input; never silently lose error recording.
      - name: Mint the dispatch token
        id: app
        if: steps.gate.outputs.run == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
          private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
          owner: KombiverseLabs
          repositories: mintlify-docs
          permission-actions: write
          permission-contents: read

      - name: Require the CI App dispatch token
        if: always() && steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            message="CI App dispatch token missing. Configure vars.KOMBIFY_CI_APP_ID and secrets.KOMBIFY_CI_APP_PRIVATE_KEY, and install kombify-ci with Actions write access to this repository. GITHUB_TOKEN fallback is disabled."
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Dispatch the Early Access workflows for the accumulated range
        id: dispatch
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LAST: ${{ steps.gate.outputs.last }}
          LANE_STATE: ${{ steps.gate.outputs.state }}
          HEAD: ${{ github.sha }}
          LANE: '[{"workflow":"delivery.yml","paths":[]}]'
        run: |
          node - <<'JS'
          // The hash chain detects missing log records. Native run/job ownership supplies
          // provenance; this journal is deduplication evidence, never provider authority.
          const integrationJournal = (() => {
            const crypto = require('node:crypto');
            const prefix = 'KOMBIFY_INTEGRATION_JOURNAL ';
            const hash = value => crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');
            const key = ({ workflow, paths = [], inputs = {}, source_input }) => hash({ workflow, paths, inputs, ...(source_input ? { source_input } : {}) });
            const empty = () => ({ covered: {}, held: {}, failed: {} });
            const decode = logs => {
              let previous = '', sequence = 0, invalid = false; const records = [];
              for (const line of logs.split(/\r?\n/)) {
                // Actions logs echo the inline script before executing it. Only an actual
                // stdout record after its native timestamp can be a journal frame.
                const content = line.replace(/^\d{4}-\d{2}-\d{2}T[0-9:.]+Z /, '');
                if (!content.startsWith(prefix)) continue;
                let frame; try { frame = JSON.parse(content.slice(prefix.length)); } catch { invalid = true; break; }
                const body = { sequence: frame.sequence, previous: frame.previous, data: frame.data };
                if (frame.sequence !== sequence || frame.previous !== previous || frame.digest !== hash(body)) { invalid = true; break; }
                records.push(frame.data); previous = frame.digest; sequence++;
              }
              return { records, complete: !invalid && records[0]?.type === 'start' && records.at(-1)?.type === 'end' };
            };
            const writer = () => { let sequence = 0, previous = ''; return data => {
              const body = { sequence: sequence++, previous, data }; previous = hash(body);
              process.stdout.write(prefix + JSON.stringify({ ...body, digest: previous }) + '\n');
            }; };
            return { key, empty, decode, writer };
          })();
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const { LAST, HEAD, GITHUB_REPOSITORY: repo, GITHUB_STEP_SUMMARY: summary } = process.env;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1e8 });
          const note = line => fs.appendFileSync(summary, line + '\n');
          const entries = JSON.parse(process.env.LANE);
          const state = { ...integrationJournal.empty(), ...(process.env.LANE_STATE ? JSON.parse(Buffer.from(process.env.LANE_STATE, 'base64').toString('utf8')) : {}) };
          const write = integrationJournal.writer();
          write({ type: 'start', repository: repo, run_id: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT), head: HEAD, last: LAST,
            state, entries: entries.map(entry => ({ workflow: entry.workflow, key: integrationJournal.key(entry) })) });
          const regex = glob => new RegExp(`^${glob.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*\*\//g, '\u0001').replace(/\*\*/g, '\u0002').replace(/\*/g, '[^/]*').replace(/\u0001/g, '(?:.*/)?').replace(/\u0002/g, '.*')}$`);
          const changedSince = last => {
            if (!last) return null;
            if (last === HEAD) return [];
            try { return gh('api', `repos/${repo}/compare/${last}...${HEAD}`, '--paginate', '--jq', '.files[].filename').split('\n').filter(Boolean); } catch {
              note(`changed files since ${last} unavailable; every entry counts as affected`); return null;
            }
          };
          // The child runs on main and builds the source input, so main may have moved past the source.
          const onMain = main => main === HEAD || ['identical', 'ahead'].includes(gh('api', `repos/${repo}/compare/${HEAD}...${main}`, '--jq', '.status').trim());
          const affected = (paths, changed) => changed === null || paths.length === 0 || changed.some(file => paths.filter(p => !p.startsWith('!')).some(p => regex(p).test(file)) && !paths.filter(p => p.startsWith('!')).some(p => regex(p.slice(1)).test(file)));
          let failed = 0;
          for (const entry of entries) {
            const { workflow, paths = [], inputs: authoredInputs = {}, source_input } = entry;
            const key = integrationJournal.key(entry), prior = state.covered[workflow], active = state.held[workflow], lost = state.failed[workflow];
            if (active?.head === HEAD) { note(`skip ${workflow} (child run ${active.child_run_id} for this source is still active)`); continue; }
            // A failed child is retried once at this head, without a new change (owner 2026-11-09).
            const retried = lost?.key === key && !lost.retried && !active;
            if (retried) note(`retry ${workflow} once (child run ${lost.child_run_id} ended ${lost.conclusion})`);
            else {
              if (prior?.key === key && prior.head === HEAD) { note(`skip ${workflow} (exact range already acknowledged as run ${prior.child_run_id})`); continue; }
              const changed = changedSince(prior?.key === key ? prior.head : LAST);
              if (!affected(paths, changed)) { note(`skip ${workflow} (no matching path since its last acknowledged source)`); continue; }
            }
            const inputs = { ...authoredInputs, ...(source_input ? { [source_input]: HEAD } : {}) };
            // The native log records the intent before POST. A missing ACK leaves the entry uncovered, so the
            // next invocation dispatches it again; another same-source child is never discovered as a substitute.
            const intent = { key, head: HEAD, original_run_id: Number(process.env.GITHUB_RUN_ID), expect_source: Boolean(source_input), retried, reason: 'unacknowledged-native-intent' };
            state.held[workflow] = intent; delete state.covered[workflow];
            write({ type: 'intent', workflow, ...intent });
            try {
              const flags = Object.entries(inputs).flatMap(([name, value]) => ['-f', `inputs[${name}]=${value}`]);
              const ack = JSON.parse(gh('api', `repos/${repo}/actions/workflows/${workflow}/dispatches`, '--method', 'POST', '-f', 'ref=main', ...flags, '-F', 'return_run_details=true'));
              if (!Number.isSafeInteger(ack.workflow_run_id) || ack.workflow_run_id < 1) throw new Error('Native acknowledgement missing');
              // Persist the exact native ACK before any follow-up API read can fail.
              state.held[workflow] = { ...intent, child_run_id: ack.workflow_run_id, reason: 'ack-native-readback-pending' };
              write({ type: 'ack-received', workflow, ...state.held[workflow] });
              const child = JSON.parse(gh('api', `repos/${repo}/actions/runs/${ack.workflow_run_id}`));
              if (child.id !== ack.workflow_run_id || child.head_branch !== 'main' || child.event !== 'workflow_dispatch' || child.path !== `.github/workflows/${workflow}` ||
                  child.repository?.full_name !== repo || child.head_repository?.full_name !== repo || source_input && !onMain(child.head_sha)) throw new Error('Native acknowledged child source mismatch');
              const covered = { key, head: HEAD, expect_source: Boolean(source_input), child_run_id: child.id, retried };
              state.covered[workflow] = covered; delete state.held[workflow]; delete state.failed[workflow];
              write({ type: 'ack', workflow, ...covered }); note(`dispatched ${workflow} run=${child.id} source=${HEAD}`);
            } catch {
              failed++; console.error(`::error::dispatch of ${workflow} is not confirmed; the next lane settles its ACK or dispatches it again`);
              note(`dispatch of ${workflow} is not confirmed; the next lane settles its ACK or dispatches it again`);
            }
          }
          write({ type: 'end', failed, state });
          if (failed) throw new Error(`Integration has ${failed} unconfirmed dispatch(es); independent entries were attempted once.`);
          JS
