# Generation and publication use separate fresh GitHub-hosted jobs. Only data crosses the boundary.
name: SpeechKit Release Docs
'on':
  repository_dispatch:
    types:
    - speechkit-docs-release
  schedule:
  - cron: 41 6 * * *
  workflow_dispatch:
    inputs:
      tag:
        description: Published SpeechKit tag; empty reconciles public latest
        required: false
        type: string
concurrency:
  group: speechkit-release-docs
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  generate:
    name: Generate data without a publication identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        token: ${{ github.token }}
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.22.1
    - name: Resolve the published release
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
        DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        INPUT_TAG: ${{ inputs.tag }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .tmp
        tag="${DISPATCH_TAG:-${INPUT_TAG:-}}"
        if [ -n "$tag" ]; then
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/kombifyio/SpeechKit/releases/tags/$tag" > .tmp/speechkit-release.json
        else
          gh api repos/kombifyio/SpeechKit/releases/latest > .tmp/speechkit-release.json
        fi
        echo "tag=$(jq -r .tag_name .tmp/speechkit-release.json)" >> "$GITHUB_OUTPUT"
    - name: Project the release into the docs
      shell: bash
      run: |
        set -euo pipefail
        # Fails closed when the release is a draft, a prerelease, or does not
        # carry every download the pages link.
        node scripts/sync-speechkit-release-docs.mjs --release-json .tmp/speechkit-release.json --write
        node scripts/sync-speechkit-release-docs.mjs --check
    - name: Export only the generated patch as untrusted data
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/generated"
        GIT_INDEX_FILE="$RUNNER_TEMP/generated-index" git read-tree HEAD
        GIT_INDEX_FILE="$RUNNER_TEMP/generated-index" git add -A -- data/speechkit speechkit
        GIT_INDEX_FILE="$RUNNER_TEMP/generated-index" git diff --cached --no-ext-diff --no-textconv --binary HEAD -- data/speechkit speechkit > "$RUNNER_TEMP/generated/candidate.patch"
        node - <<'JS'
        const fs = require('node:fs'), crypto = require('node:crypto');
        const patch = fs.readFileSync(process.env.RUNNER_TEMP + '/generated/candidate.patch');
        fs.writeFileSync(process.env.RUNNER_TEMP + '/generated/manifest.json', JSON.stringify({
         schema: 'kombify.mintlify-generated.v1', producer: 'speechkit', source_sha: process.env.GITHUB_SHA,
         run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT,
         patch_sha256: crypto.createHash('sha256').update(patch).digest('hex')
        }) + '\n');
        JS
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mintlify-generated-speechkit-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/generated/
        if-no-files-found: error
        retention-days: 1
    if: github.repository == 'KombiverseLabs/mintlify-docs' && github.ref == 'refs/heads/main'
  publish:
    name: Validate data and publish on a fresh GitHub runner
    needs: generate
    if: needs.generate.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    steps:
    - name: Require immutable authority
      env:
        AUTHORITY_REF: ${{ vars.KOMBIFY_DELIVERY_STANDARDS_REF }}
      shell: bash
      run: '[[ "$AUTHORITY_REF" =~ ^[a-f0-9]{40}$ ]]'
    - name: Mint immutable publisher reader
      id: authority-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
        private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
        owner: KombiverseLabs
        repositories: kombify-workspace
        permission-contents: read
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: KombiverseLabs/kombify-workspace
        ref: ${{ vars.KOMBIFY_DELIVERY_STANDARDS_REF }}
        path: authority
        token: ${{ steps.authority-reader.outputs.token }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: candidate
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: mintlify-generated-speechkit-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/generated-data
    - name: Mint publication identity only on the clean runner
      id: publisher
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
        private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
        owner: KombiverseLabs
        repositories: mintlify-docs
        permission-contents: write
        permission-pull-requests: write
    - name: Admit the generated data with the trusted publisher
      env:
        GH_TOKEN: ${{ steps.publisher.outputs.token }}
      shell: bash
      run: |
        node authority/scripts/mintlify-generated-publication.mjs --producer speechkit --repo "$GITHUB_WORKSPACE/candidate" --data "$RUNNER_TEMP/generated-data" --source "$GITHUB_SHA"
