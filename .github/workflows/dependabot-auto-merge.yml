# Public-repository adapter synchronized from KombiverseLabs/.github@4312c7250169b242e69ce76a4c7111a3c6c968c6.
name: Dependabot Safe Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate:
    name: Evaluate safe dependency update
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ${{ vars.GHA_HOSTED_RUNNER || 'depot-ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2.4.0
        with:
          github-token: ${{ github.token }}
      - name: Enable auto-merge only for non-sensitive patch updates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$UPDATE_TYPE" != "version-update:semver-patch" ]]; then
            echo "Review required: only patch updates are eligible for auto-merge."
            exit 0
          fi
          if grep -Eiq '(^|[,[:space:]])(node|pnpm|npm|bun|go|python|rust|mise|vite|vitest|rollup|rolldown|auth0|stripe|fga|terraform|wrangler|cloudflare)([,[:space:]]|$)' <<<"$DEPENDENCIES"; then
            echo "Review required: sensitive toolchain, runtime, identity, billing, or provider dependency."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
