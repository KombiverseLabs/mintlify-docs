name: StackKits Release Docs

on:
  repository_dispatch:
    types: [stackkits-docs-release]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Published StackKits tag; empty reconciles public latest"
        required: false
        type: string

concurrency:
  group: stackkits-release-docs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    if: github.repository == 'KombiverseLabs/mintlify-docs'
    runs-on: ${{ vars.GHA_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Resolve published immutable assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_EVIDENCE_TAG: ${{ github.event.client_payload.evidence_tag }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then tag="$(gh api repos/kombifyio/StackKits/releases/latest --jq .tag_name)"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release="$(gh api "repos/kombifyio/StackKits/releases/tags/$tag")"
          [ "$(jq -r .draft <<<"$release")" = false ]
          [ "$(jq -r .prerelease <<<"$release")" = false ]
          names="$(jq -r '.assets[].name' <<<"$release")"
          available=true
          for name in stackkits-use-case-catalog-v1.json stackkits-compatibility-v1.json; do
            grep -Fxq "$name" <<<"$names" || available=false
          done
          # Lifecycle evidence is attached to the release its runs cover, which
          # trails the synced tag until runs for that tag are projected.
          evidence_tag="${DISPATCH_EVIDENCE_TAG:-$tag}"
          [[ "$evidence_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$evidence_tag" != "$tag" ]; then
            evidence_release="$(gh api "repos/kombifyio/StackKits/releases/tags/$evidence_tag")"
            if [ "$(jq -r '.draft or .prerelease' <<<"$evidence_release")" != false ]; then
              echo "::error::Lifecycle evidence release $evidence_tag is not a published release."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "evidence_tag=$evidence_tag" >> "$GITHUB_OUTPUT"
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" != true ]; then
            echo "## DocsSyncPending" >> "$GITHUB_STEP_SUMMARY"
            echo "$tag does not yet contain both StackKits documentation manifests." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download, validate and render
        if: steps.release.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          EVIDENCE_TAG: ${{ steps.release.outputs.evidence_tag }}
          EXPECTED_CATALOG_DIGEST: ${{ github.event.client_payload.catalog_digest }}
          EXPECTED_COMPATIBILITY_DIGEST: ${{ github.event.client_payload.compatibility_digest }}
          EXPECTED_EVIDENCE_DIGEST: ${{ github.event.client_payload.evidence_digest }}
          EXPECTED_CLI_REFERENCE_DIGEST: ${{ github.event.client_payload.cli_reference_digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/stackkits-docs
          gh release download "$TAG" --repo kombifyio/StackKits --dir .tmp/stackkits-docs \
            --pattern stackkits-use-case-catalog-v1.json --pattern stackkits-compatibility-v1.json
          # The lifecycle evidence projection is optional and mutable. Without an
          # incoming asset the sync renders the newest stored projection.
          evidence=.tmp/stackkits-docs/stackkits-compatibility-evidence-v3.json
          if gh release download "$EVIDENCE_TAG" --repo kombifyio/StackKits --dir .tmp/stackkits-docs \
            --pattern stackkits-compatibility-evidence-v3.json 2>/dev/null; then
            if [ -n "${EXPECTED_EVIDENCE_DIGEST:-}" ]; then
              [ "sha256:$(sha256sum "$evidence" | cut -d' ' -f1)" = "$EXPECTED_EVIDENCE_DIGEST" ]
            fi
            if [ "$(jq -r .stackkitsVersion "$evidence")" != "$EVIDENCE_TAG" ]; then
              echo "::error::The lifecycle evidence attached to $EVIDENCE_TAG is bound to another release."
              exit 1
            fi
          elif [ -n "${EXPECTED_EVIDENCE_DIGEST:-}" ]; then
            echo "::error::The dispatch names lifecycle evidence that $EVIDENCE_TAG does not contain."
            exit 1
          fi
          catalog_digest="$(jq -r .contentDigest .tmp/stackkits-docs/stackkits-use-case-catalog-v1.json)"
          compatibility_digest="$(jq -r .contentDigest .tmp/stackkits-docs/stackkits-compatibility-v1.json)"
          if [ -n "${EXPECTED_CATALOG_DIGEST:-}" ]; then [ "$catalog_digest" = "$EXPECTED_CATALOG_DIGEST" ]; fi
          if [ -n "${EXPECTED_COMPATIBILITY_DIGEST:-}" ]; then [ "$compatibility_digest" = "$EXPECTED_COMPATIBILITY_DIGEST" ]; fi
          node scripts/sync-stackkits-release-docs.mjs --from-dir .tmp/stackkits-docs --tag "$TAG" --write
          # The CLI reference is immutable per tag and exists only for releases
          # whose command tree ships the emitter; older tags keep the committed pages.
          cli_reference=.tmp/stackkits-docs/stackkits-cli-reference-v1.json
          if gh release download "$TAG" --repo kombifyio/StackKits --dir .tmp/stackkits-docs \
            --pattern stackkits-cli-reference-v1.json 2>/dev/null; then
            if [ -n "${EXPECTED_CLI_REFERENCE_DIGEST:-}" ]; then
              [ "sha256:$(sha256sum "$cli_reference" | cut -d' ' -f1)" = "$EXPECTED_CLI_REFERENCE_DIGEST" ]
            fi
            public_source_sha="$(jq -r .release.publicSourceSha .tmp/stackkits-docs/stackkits-use-case-catalog-v1.json)"
            node scripts/render-stackkits-cli-reference.mjs --from "$cli_reference" --source-sha "$public_source_sha" --write
          elif [ -n "${EXPECTED_CLI_REFERENCE_DIGEST:-}" ]; then
            echo "::error::The dispatch names a CLI reference that $TAG does not contain."
            exit 1
          fi
      # The pull request is opened by the kombify-ci App so that its pull_request
      # events start the required Trusted Public Safety workflow; a pull request
      # opened with the workflow token starts no workflows and auto-merge would
      # wait for that check forever. The App holds Contents read only, so the
      # generated branch is pushed and the squash merge is queued with the
      # workflow token (contents: write on this repository).
      - name: Mint the CI App pull request token
        id: pr-token
        if: steps.release.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
          private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
          owner: KombiverseLabs
          repositories: mintlify-docs
          permission-contents: read
          permission-pull-requests: write
      - name: Open or update generated-only PR
        if: steps.release.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          PUSH_TOKEN: ${{ github.token }}
          BRANCH: bot/stackkits-release-docs
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ] || [ -z "${PUSH_TOKEN:-}" ]; then
            echo "::error::A credential is missing (CI App pull request token or workflow token)."
            exit 1
          fi
          generated=(data/stackkits stackkits/reference/use-case-catalog.mdx stackkits/reference/os-compatibility.mdx stackkits/reference/application-delivery-compatibility.mdx stackkits/reference/cli docs.json)
          # Untracked files count: a new command adds a CLI reference page.
          if [ -z "$(git status --porcelain --untracked-files=all -- "${generated[@]}")" ]; then
            echo "No public snapshot drift."
            exit 0
          fi
          # Fails closed on any changed path outside the generated set.
          node scripts/stackkits-generated-only-paths.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git --hostname github.com
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git checkout -B "$BRANCH"
          git add -- "${generated[@]}"
          git commit -m "docs(stackkits): sync $TAG release manifests"
          GH_TOKEN="$PUSH_TOKEN" git push --force-with-lease origin "$BRANCH"
          # `gh pr view <branch>` also matches merged PRs of the reused bot
          # branch, so only an open PR counts as already existing.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$BRANCH" --title "docs(stackkits): sync $TAG release manifests" --body "Automated projection from immutable public StackKits release assets."
          fi
          GH_TOKEN="$PUSH_TOKEN" gh pr merge "$BRANCH" --auto --squash
