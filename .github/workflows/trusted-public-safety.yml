# Require this workflow through an organization ruleset bound to a published
# immutable SHA in this PUBLIC repository. A required check name is insufficient.
# This is static publication-safety evidence, not complete security/review evidence.
name: Trusted Public Safety
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-public-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PRODUCER_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Validate event identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'KombiverseLabs/mintlify-docs' ]]
          [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$PRODUCER_SHA" =~ ^[a-f0-9]{40}$ ]]
      - name: Checkout ruleset-selected producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KombiverseLabs/mintlify-docs
          ref: ${{ github.workflow_sha }}
          path: producer
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Check generated AGENTS policy with the trusted producer
        shell: bash
        run: |
          set -euo pipefail
          # Both code and provenance belong to the ruleset-selected producer, never the candidate.
          if ! node producer/.github/actions/agents-policy/verify-projection.mjs || ! node producer/.github/actions/agents-policy/agents-policy-check.mjs --repo candidate --candidate "$SOURCE_SHA"; then
            echo 'AGENTS policy check failed. Verify public agents-policy/current publication and regenerate candidate blocks from merged Workspace policy.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Test boundary guard
        shell: bash
        run: |
          set -euo pipefail
          # No unit-test growth outside the declared boundaries (D-2026-10-20-04).
          # The producer's copy of the organization guard reads the candidate as data.
          git -C candidate fetch --no-tags --quiet --depth=2 origin "$GITHUB_SHA"
          node producer/scripts/test-boundary-guard.mjs --repo candidate --base "${GITHUB_SHA}^1" --head "$GITHUB_SHA"
      - name: Check added engineering prose with the trusted producer
        env:
          STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          node producer/.github/actions/engineering-prose/verify-projection.mjs
          base=$(git -C candidate rev-parse --verify "${GITHUB_SHA}^1^{commit}")
          if [ -n "$STACK_BASE_SHA" ]; then
            [[ "$STACK_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            git -C candidate fetch --no-tags --quiet --depth=1 origin "$STACK_BASE_SHA"
            base=$(git -C candidate rev-parse --verify "${STACK_BASE_SHA}^{commit}")
            [ "$base" = "$STACK_BASE_SHA" ]
          fi
          # Execute only the ruleset-selected producer; candidate scripts are data.
          node producer/.github/actions/engineering-prose/runner.mjs \
            --repo candidate --repo-id mintlify-docs --base "$base" --head "$SOURCE_SHA" --exact-base
      - name: Run trusted static publication validator
        shell: bash
        run: node producer/scripts/trusted-public-safety.mjs "$GITHUB_WORKSPACE/candidate" "$SOURCE_SHA" "$PRODUCER_SHA"
      - name: Reject superseded candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number=$(jq -er '.pull_request.number' "$GITHUB_EVENT_PATH")
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq 'select(.state == "open") | .head.sha')
          [[ "$current" == "$SOURCE_SHA" ]]
          printf 'Trusted static publication safety passed for source `%s`, producer `%s`.\n' "$SOURCE_SHA" "$PRODUCER_SHA" >> "$GITHUB_STEP_SUMMARY"
