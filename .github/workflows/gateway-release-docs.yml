# Generation and publication use separate fresh GitHub-hosted jobs. Only data crosses the boundary.
name: Gateway Release Docs
'on':
  repository_dispatch:
    types:
    - gateway-docs-release
  schedule:
  - cron: 37 6 * * 1
  workflow_dispatch:
    inputs:
      tag:
        description: Published Gateway tag; empty selects the newest non-draft product release
        required: false
        type: string
concurrency:
  group: gateway-release-docs
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'KombiverseLabs/mintlify-docs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      available: ${{ steps.release.outputs.available }}
    steps:
    - name: Mint exact Gateway source read identity
      id: source-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
        private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
        owner: KombiverseLabs
        repositories: kombify-Gateway
        permission-contents: read
    - name: Resolve and render the published contract
      id: release
      env:
        DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        INPUT_TAG: ${{ inputs.tag }}
        EXPECTED_OPENAPI_DIGEST: ${{ github.event.client_payload.openapi_digest }}
        GH_TOKEN: ${{ steps.source-token.outputs.token }}
      shell: bash
      run: |
        set -euo pipefail
        repo=KombiverseLabs/kombify-Gateway
        tag="${DISPATCH_TAG:-${INPUT_TAG:-}}"
        newest="$(gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[] | select(.draft == false and .published_at != null and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tag_name' | sort -V | tail -n 1)"
        [[ "$newest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        if [ -z "$tag" ]; then
          tag="$newest"
        fi
        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        gh api "repos/$repo/releases/tags/$tag" --jq '.draft == false and .published_at != null' | grep -qx true
        if [ "$tag" != "$newest" ]; then
          printf '%s\n' "Requested published tag $tag is not the newest published Gateway release $newest; no reference write or publication occurred. A delayed event never downgrades the reference." >> "$GITHUB_STEP_SUMMARY"
          echo 'available=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        source_sha="$(gh api "repos/$repo/commits/$tag" --jq .sha)"
        [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
        mkdir -p .tmp/gateway-api-reference
        gh api -H 'Accept: application/vnd.github.raw+json' "repos/$repo/contents/docs/openapi.yaml?ref=$source_sha" > .tmp/gateway-api-reference/openapi.yaml
        digest="sha256:$(sha256sum .tmp/gateway-api-reference/openapi.yaml | cut -d ' ' -f 1)"
        if [ -n "${EXPECTED_OPENAPI_DIGEST:-}" ]; then test "$digest" = "$EXPECTED_OPENAPI_DIGEST"; fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
        echo "available=true" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: steps.release.outputs.available == 'true'
      with:
        name: gateway-source-${{ github.run_id }}-${{ github.run_attempt }}
        path: .tmp/gateway-api-reference/openapi.yaml
        if-no-files-found: error
        retention-days: 1
  generate:
    name: Generate data without a publication identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.22.2
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: gateway-source-${{ github.run_id }}-${{ github.run_attempt }}
        path: .tmp/gateway-api-reference
    - name: Render the source data without publication credentials
      id: release
      env:
        TAG: ${{ needs.source.outputs.tag }}
        SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
      run: |
        set -euo pipefail
        node scripts/render-gateway-api-reference.mjs --openapi .tmp/gateway-api-reference/openapi.yaml --release "$TAG" --source-sha "$SOURCE_SHA" --write
        node scripts/render-gateway-api-reference.mjs --openapi .tmp/gateway-api-reference/openapi.yaml --release "$TAG" --source-sha "$SOURCE_SHA" --check
        echo "changed=true" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Independently validate public content
      id: public-check
      if: steps.release.outputs.changed == 'true'
      shell: pwsh
      run: ./scripts/assert-public-safety.ps1
    - name: Build the actual Mintlify OpenAPI consumer
      id: consumer
      if: steps.release.outputs.changed == 'true'
      run: npx -y mint@4.2.684 validate
    - name: Check the source-bound projection before publisher checkout
      if: steps.release.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.source.outputs.tag }}
        SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin main --no-tags
        previous=()
        git ls-tree --name-only origin/main -- identity/reference/api/openapi.yaml > .tmp/gateway-api-reference/previous-path.txt
        if [ -s .tmp/gateway-api-reference/previous-path.txt ]; then
          git show origin/main:identity/reference/api/openapi.yaml > .tmp/gateway-api-reference/previous.yaml
          previous=(--previous .tmp/gateway-api-reference/previous.yaml)
        fi
        node scripts/render-gateway-api-reference.mjs --openapi .tmp/gateway-api-reference/openapi.yaml --release "$TAG" --source-sha "$SOURCE_SHA" --check "${previous[@]}"
    - name: Export only the generated patch as untrusted data
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/generated"
        GIT_INDEX_FILE="$RUNNER_TEMP/generated-index" git read-tree HEAD
        GIT_INDEX_FILE="$RUNNER_TEMP/generated-index" git add -A -- docs.json identity/reference/api/openapi.yaml
        GIT_INDEX_FILE="$RUNNER_TEMP/generated-index" git diff --cached --no-ext-diff --no-textconv --binary HEAD -- docs.json identity/reference/api/openapi.yaml > "$RUNNER_TEMP/generated/candidate.patch"
        node - <<'JS'
        const fs = require('node:fs'), crypto = require('node:crypto');
        const patch = fs.readFileSync(process.env.RUNNER_TEMP + '/generated/candidate.patch');
        fs.writeFileSync(process.env.RUNNER_TEMP + '/generated/manifest.json', JSON.stringify({
         schema: 'kombify.mintlify-generated.v1', producer: 'gateway', source_sha: process.env.GITHUB_SHA,
         run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT,
         patch_sha256: crypto.createHash('sha256').update(patch).digest('hex')
        }) + '\n');
        JS
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mintlify-generated-gateway-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/generated/
        if-no-files-found: error
        retention-days: 1
    needs: source
    if: needs.source.outputs.available == 'true'
  publish:
    name: Validate data and publish on a fresh GitHub runner
    needs: generate
    if: needs.generate.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    steps:
    - name: Require immutable authority
      env:
        AUTHORITY_REF: ${{ vars.KOMBIFY_DELIVERY_STANDARDS_REF }}
      shell: bash
      run: '[[ "$AUTHORITY_REF" =~ ^[a-f0-9]{40}$ ]]'
    - name: Mint immutable publisher reader
      id: authority-reader
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
        private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
        owner: KombiverseLabs
        repositories: kombify-workspace
        permission-contents: read
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: KombiverseLabs/kombify-workspace
        ref: ${{ vars.KOMBIFY_DELIVERY_STANDARDS_REF }}
        path: authority
        token: ${{ steps.authority-reader.outputs.token }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        path: candidate
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.22.1
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: mintlify-generated-gateway-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/generated-data
    - name: Mint publication identity only on the clean runner
      id: publisher
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
        private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
        owner: KombiverseLabs
        repositories: mintlify-docs
        permission-contents: write
        permission-pull-requests: write
    - name: Admit the generated data with the trusted publisher
      env:
        GH_TOKEN: ${{ steps.publisher.outputs.token }}
      shell: bash
      run: |
        node authority/scripts/mintlify-generated-publication.mjs --producer gateway --repo "$GITHUB_WORKSPACE/candidate" --data "$RUNNER_TEMP/generated-data" --source "$GITHUB_SHA"
