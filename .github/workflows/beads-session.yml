name: Beads session token
run-name: Beads session token ${{ inputs.request_id }}

# Gives an agent session without its own GitHub credential (Claude cloud
# sessions, where the GitHub proxy holds the identity) a short-lived Cloudflare
# Beads credential for this repository's tracker. The session runs
# `node scripts/beads-cloudflare-access.mjs`: it creates an RSA key pair in
# memory and dispatches this workflow with the public key. Dispatching needs
# write access to this repository, the same bar the store applies to a GitHub
# user exchange. The job proves itself to the store with GitHub OIDC (this file
# on main is listed in the store's repository policy), receives a 12-24 h
# credential for the configured tracker, encrypts it to the session key and
# publishes only the ciphertext as a job annotation. No secret is stored.
#
# Generated by kombify-workspace scripts/repo-context-sync.mjs; edit the
# workspace copy and re-project. Standard: BEADS-REMOTE-WRITE-STANDARD.md.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Random request ID chosen by the session (hex, 16-64 chars)
        required: true
        type: string
      public_key:
        description: Session RSA-4096 public key, base64 SPKI DER
        required: true
        type: string
      tracker:
        description: Tracker named in .kombify/beads-cloudflare.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beads-session-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  issue:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.GHA_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Issue encrypted Beads session credential
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PUBLIC_KEY_B64: ${{ inputs.public_key }}
          TRACKER: ${{ inputs.tracker }}
          REPOSITORY: ${{ github.repository }}
          STORE: https://beads-cloudflare.soulcreek.workers.dev
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          if ! printf '%s' "$REQUEST_ID" | grep -Eq '^[0-9a-f]{16,64}$'; then
            echo "::error::request_id must be 16-64 lowercase hex characters"; exit 1
          fi
          if ! printf '%s' "$TRACKER" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "::error::tracker is not a valid tracker id"; exit 1
          fi
          if ! printf '%s' "$PUBLIC_KEY_B64" | base64 -d > "$work/pub.der" 2>/dev/null \
            || ! openssl pkey -pubin -inform DER -in "$work/pub.der" -out "$work/pub.pem" 2>/dev/null; then
            echo "::error::public_key is not a base64 SPKI public key"; exit 1
          fi
          bits="$(openssl pkey -pubin -in "$work/pub.pem" -text -noout | sed -n 's/^Public-Key: (\([0-9]*\) bit)$/\1/p')"
          if [ "${bits:-0}" -lt 4096 ] || ! openssl pkey -pubin -in "$work/pub.pem" -text -noout | grep -q '^Modulus'; then
            echo "::error::public_key must be RSA with at least 4096 bits"; exit 1
          fi

          oidc="$(curl -fsS -G -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$STORE" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')"
          echo "::add-mask::$oidc"
          jq -n --arg repository "$REPOSITORY" --arg tracker "$TRACKER" '{repository: $repository, tracker: $tracker}' > "$work/request.json"
          status="$(curl -sS -o "$work/issued.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            --data @"$work/request.json" "$STORE/auth/github")"
          if [ "$status" != "200" ]; then
            echo "::error::Beads store refused the OIDC exchange (HTTP $status): $(jq -c '{title, detail} // empty' "$work/issued.json" 2>/dev/null)"; exit 1
          fi
          token="$(jq -r '.token' "$work/issued.json")"
          echo "::add-mask::$token"
          expires_at="$(jq -r '.expires_at' "$work/issued.json")"

          # Hybrid encryption to the session key, as cloud-session-doppler.yml:
          # AES-256-CBC + HMAC-SHA256 under fresh keys wrapped with RSA-OAEP-SHA256.
          jq -n --arg token "$token" --arg expires_at "$expires_at" --arg request_id "$REQUEST_ID" \
            --arg repository "$REPOSITORY" --arg tracker "$TRACKER" \
            '{v: 1, request_id: $request_id, token: $token, expires_at: $expires_at, repository: $repository, tracker: $tracker}' \
            > "$work/payload.json"
          openssl rand 64 > "$work/keys.bin"
          enc_key="$(head -c 32 "$work/keys.bin" | od -An -tx1 | tr -d ' \n')"
          mac_key="$(tail -c 32 "$work/keys.bin" | od -An -tx1 | tr -d ' \n')"
          openssl rand 16 > "$work/iv.bin"
          iv="$(od -An -tx1 "$work/iv.bin" | tr -d ' \n')"
          openssl enc -aes-256-cbc -K "$enc_key" -iv "$iv" -in "$work/payload.json" -out "$work/payload.enc"
          cat "$work/iv.bin" "$work/payload.enc" > "$work/maced.bin"
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$mac_key" -binary -out "$work/mac.bin" "$work/maced.bin"
          openssl pkeyutl -encrypt -pubin -inkey "$work/pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -in "$work/keys.bin" -out "$work/keys.enc"
          echo "::notice title=beads-cloud-session ${REQUEST_ID}::$(base64 -w0 "$work/keys.enc").$(base64 -w0 "$work/iv.bin").$(base64 -w0 "$work/payload.enc").$(base64 -w0 "$work/mac.bin")"
          echo "Issued a Beads credential for ${TRACKER}, expires ${expires_at}." >> "$GITHUB_STEP_SUMMARY"
