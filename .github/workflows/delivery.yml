# Public-repository adapter for Delivery Platform v2.
# GitHub does not allow a public repository to call reusable workflows from the
# internal KombiverseLabs/.github repository. The compiler and fleet snapshot
# remain immutable and centrally owned by kombify-workspace.
name: Delivery v2

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Execute the delivery plan instead of compiling it only.
        required: false
        type: boolean
        default: true
      approve-stable:
        description: Approve activation for a stable 1.0+ release.
        required: false
        type: boolean
        default: false
      candidate-receipt-b64:
        description: Exact Candidate receipt for stable publication.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: docs-native-publication
  cancel-in-progress: false

jobs:
  delivery:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Compile exact plan and execute selected profile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RECEIPT_B64: ${{ inputs.candidate-receipt-b64 }}
      EXECUTE_DELIVERY: ${{ inputs.execute }}
      FAIL_CLOSED_FAST: "true"
      SOURCE_REPOSITORY: mintlify-docs
      SOURCE_SHA: ${{ github.sha }}
      STABLE_APPROVED: ${{ inputs.approve-stable }}
      STANDARDS_REF: ${{ vars.KOMBIFY_DELIVERY_STANDARDS_REF }}
    steps:
      - name: Mint scoped company App token
        id: authority-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
          private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
          owner: KombiverseLabs
          repositories: kombify-workspace
          permission-contents: read

      - name: Check out exact caller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the Delivery authority
        shell: bash
        run: |
          [[ "$STANDARDS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::KOMBIFY_DELIVERY_STANDARDS_REF is not set on this repository; run mise run delivery:authority -- --advance"; exit 1; }

      - name: Check out immutable delivery compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KombiverseLabs/kombify-workspace
          ref: ${{ env.STANDARDS_REF }}
          path: standards
          token: ${{ steps.authority-reader.outputs.token }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.1"

      - name: Compile and validate immutable Delivery Plan
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node standards/scripts/resolve-delivery-version.mjs --repo-root "$PWD" --source-sha "$SOURCE_SHA")"
          SOURCE_MAP_JSON="$(node -e 'process.stdout.write(JSON.stringify({[process.env.SOURCE_REPOSITORY]: process.env.SOURCE_SHA}))')"
          mkdir -p delivery receipts
          node standards/scripts/delivery-platform.mjs compile \
            --snapshot \
            --product docs \
            --version "$VERSION" \
            --contract .kombify/delivery.json \
            --source-json "$SOURCE_MAP_JSON" \
            --output delivery/delivery-plan.json
          node standards/scripts/delivery-platform.mjs validate-plan \
            --plan delivery/delivery-plan.json

      - name: Export exact plan metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const plan = JSON.parse(fs.readFileSync("delivery/delivery-plan.json", "utf8"));
          const deliveryVersion = plan.version;
          if (!/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(deliveryVersion)) {
            throw new Error("delivery version must be suffix-free MAJOR.MINOR.PATCH SemVer");
          }
          const values = {
            DELIVERY_ARTIFACT: "public-docs",
            DELIVERY_PLAN: `${process.env.GITHUB_WORKSPACE}/delivery/delivery-plan.json`,
            DELIVERY_PLAN_DIGEST: plan.plan_digest,
            DELIVERY_PROFILE: plan.profile,
            DELIVERY_RELEASE_ID: plan.release_id,
            DELIVERY_TAG: `v${deliveryVersion}`,
            DELIVERY_VERSION: deliveryVersion,
          };
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `${Object.entries(values).map(([key, value]) => `${key}=${value}`).join("\n")}\n`,
          );
          NODE

      - name: Upload immutable Delivery Plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delivery-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/delivery-plan.json
          if-no-files-found: error
          retention-days: 30

      # The candidate is data. No mise config, script, component or .kombify
      # runtime from it receives the publication identity.
      - name: Mint the native deployment reader
        id: publisher
        if: env.EXECUTE_DELIVERY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KOMBIFY_CI_APP_ID }}
          private-key: ${{ secrets.KOMBIFY_CI_APP_PRIVATE_KEY }}
          owner: KombiverseLabs
          repositories: mintlify-docs
          permission-contents: read
          permission-deployments: read

      - name: Execute delivery operations and compose receipts
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        if: env.EXECUTE_DELIVERY == 'true'
        shell: bash
        run: |
          set -euo pipefail

          run_operation() {
            local operation="$1"
            local blocking="${2:-true}"
            local started_at
            local finished_at
            local status
            local exit_code

            started_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            set +e
            local receipt_args=()
            if [[ "$operation" == "publish" ]]; then receipt_args=(--receipt "$GITHUB_WORKSPACE/receipts/publication-safety.json"); fi
            node standards/scripts/mintlify-publication.mjs "$operation" --repo "$GITHUB_WORKSPACE" --source "$SOURCE_SHA" "${receipt_args[@]}"
            exit_code=$?
            set -e
            finished_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
            if [[ "$exit_code" -eq 0 ]]; then
              status=passed
            else
              status=failed
            fi
            node standards/scripts/delivery-platform.mjs receipt \
              --plan delivery/delivery-plan.json \
              --artifact "$DELIVERY_ARTIFACT" \
              --operation "$operation" \
              --status "$status" \
              --started-at "$started_at" \
              --finished-at "$finished_at" \
              --output "receipts/${operation}.json"
            # Public-safety refusal is a publication boundary, including pre-1.0.
            # Record the failure and stop before claiming publication verification.
            if [[ "$blocking" == "true" && "$exit_code" -ne 0 ]]; then
              return "$exit_code"
            fi
          }

          # The publish operation runs the complete trusted static validator in
          # every profile; a stable run may not skip it with fast-profile flags.
          if [[ "$DELIVERY_PROFILE" == "fast-pre-1.0" || "$STABLE_APPROVED" == "true" ]]; then
            run_operation publish
            run_operation promote
            run_operation smoke
          fi

      - name: Upload exact operation receipts
        if: always() && env.EXECUTE_DELIVERY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delivery-receipts-${{ github.run_id }}-${{ github.run_attempt }}-public-docs
          path: receipts/*.json
          if-no-files-found: error
          retention-days: 30
