name: Audience Boundary Gate

on:
  pull_request:
    paths:
      - "docs.json"
      - "**/*.mdx"
      - "scripts/run-local-e2e.ps1"
      - "scripts/assert-remote-audience.ps1"
      - "mise.toml"
      - ".github/workflows/audience-boundary.yml"
  push:
    branches:
      - main
    paths:
      - "docs.json"
      - "**/*.mdx"
      - "scripts/run-local-e2e.ps1"
      - "scripts/assert-remote-audience.ps1"
      - "mise.toml"
      - ".github/workflows/audience-boundary.yml"

permissions:
  contents: read

jobs:
  static:
    name: Validate public and restricted navigation
    runs-on: ${{ vars.GHA_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run static docs and audience gate
        shell: pwsh
        run: ./scripts/run-local-e2e.ps1 -SkipPreview

  remote-preview:
    name: Block anonymous preview leaks
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ vars.GHA_HOSTED_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Wait for exact-head Mintlify deployment
        id: preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $deadline = (Get-Date).AddMinutes(4)
          $environmentUrl = $null
          do {
            $deployments = gh api "repos/$env:REPOSITORY/deployments?sha=$env:HEAD_SHA&per_page=20" | ConvertFrom-Json
            $deployment = @($deployments | Sort-Object { [datetime]$_.created_at } -Descending | Select-Object -First 1)
            if ($deployment.Count -gt 0) {
              $statuses = gh api "repos/$env:REPOSITORY/deployments/$($deployment[0].id)/statuses?per_page=20" | ConvertFrom-Json
              $latestStatus = @($statuses | Sort-Object { [datetime]$_.created_at } -Descending | Select-Object -First 1)
              if ($latestStatus.Count -gt 0) {
                $status = $latestStatus[0]
                if ($status.state -eq "success" -and -not [string]::IsNullOrWhiteSpace([string]$status.environment_url)) {
                  $environmentUrl = [string]$status.environment_url
                }
                elseif ($status.state -in @("failure", "error", "inactive")) {
                  throw "Mintlify deployment $($deployment[0].id) reached terminal provider state '$($status.state)' for exact head $env:HEAD_SHA"
                }
              }
            }
            if ($null -ne $environmentUrl) { break }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          if ([string]::IsNullOrWhiteSpace($environmentUrl)) {
            throw "No successful Mintlify deployment status with environment_url found for exact head $env:HEAD_SHA within four minutes"
          }
          "url=$environmentUrl" >> $env:GITHUB_OUTPUT
          Write-Host "preview_url: $environmentUrl"

      - name: Assert remote anonymous audience boundary
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: ./scripts/assert-remote-audience.ps1 -BaseUrl $env:PREVIEW_URL
