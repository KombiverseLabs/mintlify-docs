name: Record known error

# Generated by kombify-workspace scripts/integration-lane-sync.mjs from
# .kombify/integration-lane.json (D-2026-11-01-08). Do not edit it.
# Observes all native child workflows for nonblocking Delivery findings, including green runs.
# Records a red run of a tracked integration or release workflow as one
# known-error issue per cause (workflow, failed job, failed step). The issue mentions the owner when it
# opens, lists the commits since the last green run, gets a comment for every further red run and closes
# itself when the workflow is green again (D-2026-11-11-01). The job is skipped (no minutes) for a
# cancelled or skipped run, for a run of another event than workflow_dispatch, push or schedule and for
# a run whose head repository is not this repository. A Delivery report issue is built from workflow, job
# and step names and an allowlisted cause and group only, and closes when its cause is green again.
# The workspace CI backlog (scripts/ci-failure-backlog.mjs) files the Beads task for the same red run.
on:
  workflow_run:
    workflows: ["Delivery v2", "Beads session token", "CodeQL", "Gateway Release Docs", "Integrate Early Access", "Mise Toolchain Update", "Parity Gate", "SpeechKit Release Docs", "StackKits Release Docs", "Techstack Release Docs"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

jobs:
  record:
    if: github.repository == 'KombiverseLabs/mintlify-docs' && github.event.workflow_run.head_repository.full_name == github.repository && contains(fromJSON('["workflow_dispatch","push","schedule"]'), github.event.workflow_run.event) && contains(fromJSON('["failure","timed_out","startup_failure","success"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW: ${{ github.event.workflow.name }}
      WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
      TRACKED_WORKFLOWS: "[\"Delivery v2\"]"
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_TITLE: ${{ github.event.workflow_run.display_title }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      ALERT: "Soulcreek"
    steps:
      - name: Record the known error
        shell: bash
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { WORKFLOW, WORKFLOW_ID, RUN_TITLE, CONCLUSION, RUN_ID, RUN_URL, HEAD_SHA, ALERT, GITHUB_REPOSITORY: repo, GITHUB_STEP_SUMMARY: summary } = process.env;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1e8, stdio: ['ignore', 'pipe', 'pipe'] });
          const note = line => fs.appendFileSync(summary, `${line}\n`);
          
          // A red delivery run is a known error (D-2026-11-01-08): one open issue per cause, which tells the owner
          // (D-2026-11-11-01) and closes itself when the workflow is green again. The cause is the workflow, the
          // failed job and the failed step. The run title is left out of it: it carries the commit or the reason of
          // one run, so a fingerprint built on it opened a new issue for the same cause in every slot.
          // A failed product-owned operation fails the reporter step "Apply maturity-aware operation result" of its
          // job, which only says that the operation failed. The cause is the failed step of the native child run the
          // operation dispatched, so then the cause is the product (workflow), the group, the child workflow and the
          // child's failed step; the reporter's own name never keys an issue while the child is readable.
          const REPORTER_STEP = 'Apply maturity-aware operation result';
          const marker = `known-error-workflow: ${WORKFLOW}`;
          const known = () => JSON.parse(gh('issue', 'list', '--repo', repo, '--label', 'known-error', '--state', 'open', '--limit', '200', '--json', 'number,title,body') || '[]');
          // Issues of this workflow from before D-2026-11-11-01: one per run, without the workflow marker, so they
          // never close by themselves. The current record replaces them.
          const legacy = issues => issues.filter(item => !/^known-error-workflow: /m.test(item.body || '') && (item.title || '').startsWith(`Known error: ${WORKFLOW} `));
          const supersede = (issues, by) => {
            for (const issue of legacy(issues)) {
              try {
                gh('issue', 'close', String(issue.number), '--repo', repo, '--reason', 'not planned', '--comment', `Closed as a duplicate record of ${WORKFLOW}: before D-2026-11-11-01 every red run opened its own issue. ${by}`);
                note(`legacy known error of ${WORKFLOW} closed: issue #${issue.number}`);
              } catch { /* the next run closes it */ }
            }
          };
          
          let jobs = null;
          try {
            jobs = JSON.parse(gh('api', '--paginate', '--slurp', `repos/${repo}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100`,
              '--jq', '[.[].jobs[] | {id, name, status, conclusion, html_url, check_run_url, steps: [(.steps // [])[] | {name, conclusion}]}]'));
          } catch { note('Delivery jobs unreadable; known errors stay open.'); }
          const sideStep = 'Side publication failed (does not gate)';
          const groupJobs = (jobs ?? []).filter(job => /(?:^| \/ )Deliver · ([^ /]+) \/ /.test(job.name || ''));
          const sideGroups = new Set(groupJobs.filter(job => job.steps.some(step => step.name === sideStep && step.conclusion === 'success'))
            .map(job => /Deliver · ([^ /]+) \/ /.exec(job.name)[1]));
          const shipped = groupJobs.some(job => /Publish · /.test(job.name) && job.conclusion === 'success' &&
            !sideGroups.has(/Deliver · ([^ /]+) \/ /.exec(job.name)[1]) &&
            !job.steps.some(step => step.name === 'Run product-owned operation' && step.conclusion === 'skipped'));
          
          const tracked = process.env.RUN_EVENT === 'workflow_dispatch' && JSON.parse(process.env.TRACKED_WORKFLOWS || '[]').includes(WORKFLOW);
          const productionPending = (jobs ?? []).some(job => job.steps.some(step => step.name === 'Report producing operation still pending' && step.conclusion === 'success'));
          if (tracked && CONCLUSION === 'success' && jobs && !productionPending && (!sideGroups.size || shipped)) {
            const issues = known();
            for (const issue of issues.filter(item => (item.body || '').split(/\r?\n/).includes(marker))) {
              gh('issue', 'close', String(issue.number), '--repo', repo, '--comment', `Green again at ${HEAD_SHA}: ${RUN_URL}`);
              note(`known error of ${WORKFLOW} closed: issue #${issue.number}`);
            }
            supersede(issues, `The workflow is green again at ${HEAD_SHA}: ${RUN_URL}`);
          } else if (tracked && CONCLUSION !== 'success') {
            let job = 'run', step = CONCLUSION, jobId = '';
            try {
              // The jobs read above is paginated; the unpaginated read sees only the first 30 jobs of a run that has more.
              const failed = (jobs ?? []).find(item => item.conclusion === 'failure') ||
                JSON.parse(gh('api', `repos/${repo}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100`, '--jq', '[.jobs[] | select(.conclusion == "failure")][0] // {}') || '{}');
              job = failed.name || job;
              jobId = failed.id ? String(failed.id) : '';
              step = (failed.steps || []).find(item => item.conclusion === 'failure')?.name || step;
            } catch { /* the run page still names the failure */ }
          
            // The native child the failed operation dispatched: its failed step is the cause. The operation prints
            // `native_child_failed: child=<run url> job=<job> step=<step> error=<first annotation>` into the job log
            // (scripts/lib/delivery-failure-diagnostic.mjs). An operation of a pinned older workflow prints no such
            // line, a child that could not be observed names no step; the reporter step then keys the issue as before.
            let cause = null;
            if (step === REPORTER_STEP && jobId) {
              try {
                let log = '';
                // gh refuses a log that carries terminal escape sequences unless told to print it; older gh has no such flag.
                for (const flags of [['--allow-escape-sequences'], []]) {
                  try { log = gh('api', ...flags, `repos/${repo}/actions/jobs/${jobId}/logs`); break; } catch { /* next form */ }
                }
                const found = /native_child_failed: child=https:\/\/github\.com\/([A-Za-z0-9-]+\/[A-Za-z0-9_.-]+)\/actions\/runs\/([1-9]\d*) job=(.+?) step=(.+?) error=/.exec(log.replace(/\x1b\[[0-9;]*[A-Za-z]/g, ''));
                if (found && found[4] !== 'unavailable') {
                  // The workflow file names the child; the run's own name carries its version and commit.
                  let childWorkflow = '';
                  try { childWorkflow = gh('api', `repos/${found[1]}/actions/runs/${found[2]}`, '--jq', '.path // empty').trim().replace(/@.*$/, '').replace(/^.*\//, ''); } catch { /* another repository's run may be unreadable */ }
                  const group = /(?:^| \/ )Deliver · ([^ /]+) \/ /.exec(job)?.[1] || job;
                  cause = { group, childRepository: found[1], childRun: `https://github.com/${found[1]}/actions/runs/${found[2]}`, childJob: found[3], childStep: found[4], childWorkflow: childWorkflow || found[1] };
                }
              } catch { /* the reporter step still names the failure */ }
            }
            const label = cause ? `${cause.group} / ${cause.childWorkflow} / ${cause.childStep}` : step;
            const fingerprint = crypto.createHash('sha1').update(cause ? `${WORKFLOW}|${cause.group}|${cause.childWorkflow}|${cause.childStep}` : `${WORKFLOW}|${job}|${step}`).digest('hex').slice(0, 12);
          
            // What the red run carried for the first time: the commits since the newest green run of this workflow.
            let since = '', suspects = [], authors = [];
            try {
              since = gh('api', `repos/${repo}/actions/workflows/${WORKFLOW_ID}/runs?branch=main&status=success&per_page=1`, '--jq', '.workflow_runs[0].head_sha // empty').trim();
              if (since && since !== HEAD_SHA) {
                const range = JSON.parse(gh('api', `repos/${repo}/compare/${since}...${HEAD_SHA}`, '--jq', '[.commits[] | {sha: .sha[0:9], title: (.commit.message | split("\n")[0]), login: (.author.login // "")}]') || '[]');
                const changes = range.filter(item => !/^chore(\([^)]*\))?: release\b/.test(item.title));
                suspects = changes.slice(-30).map(item => `- ${item.sha} ${item.title.slice(0, 120)}${item.login ? ` (${item.login})` : ''}`);
                authors = [...new Set(changes.map(item => item.login).filter(login => login && !login.endsWith('[bot]')))];
              }
            } catch { /* the issue still names the run */ }
          
            const mention = (ALERT || '').split(/\s+/).filter(Boolean).map(login => `@${login}`).join(' ');
            const body = [
              `known-error-fingerprint: ${fingerprint}`,
              marker,
              '',
              `${mention ? `${mention} ` : ''}**${WORKFLOW}** is red on \`main\`. What this run should have delivered is not delivered until the workflow is green again.`,
              '',
              `- Failed job: ${job}`,
              ...(cause ? [
                `- Group: ${cause.group}`,
                `- Child workflow: ${cause.childWorkflow} (${cause.childRun})`,
                `- Failed child job: ${cause.childJob}`,
                `- Failed child step: ${cause.childStep}`,
                `- Reporting step: ${step}`,
              ] : [`- Failed step: ${step}`]),
              `- Run: ${RUN_URL}${RUN_TITLE ? ` (${RUN_TITLE.slice(0, 160)})` : ''}`,
              `- First seen at ${HEAD_SHA}`,
              since ? `- Last green run at ${since}` : '- No green run of this workflow was found',
              '',
              suspects.length ? `Commits since the last green run:\n${suspects.join('\n')}` : 'No new commit since the last green run: the cause is outside the range (environment, credential or provider).',
              '',
              'This issue receives a comment for every further red run with the same cause and closes itself when the workflow is green again.',
            ].join('\n');
          
            try { gh('label', 'create', 'known-error', '--repo', repo, '--color', 'B60205', '--description', 'Red delivery run on main; one issue per cause'); } catch { /* exists */ }
            const issues = known();
            const open = issues.find(item => (item.body || '').includes(`known-error-fingerprint: ${fingerprint}`) && (item.body || '').split(/\r?\n/).includes(marker))?.number;
            if (open) {
              gh('issue', 'comment', String(open), '--repo', repo, '--body', `Seen again at ${HEAD_SHA}: ${RUN_URL}`);
              note(`known error ${fingerprint} (${WORKFLOW} / ${label}) seen again: issue #${open}`);
              supersede(issues, `The cause is recorded in #${open}.`);
            } else {
              const created = gh('issue', 'create', '--repo', repo, '--label', 'known-error', '--title', `Known error: ${WORKFLOW} / ${label} (${fingerprint})`.slice(0, 250), '--body', body).trim();
              // The people whose commits the red run carried own the fix; an unassignable login must not lose the issue.
              for (const login of authors.slice(0, 3)) {
                try { gh('issue', 'edit', created, '--repo', repo, '--add-assignee', login); } catch { /* not assignable here */ }
              }
              note(`known error ${fingerprint} (${WORKFLOW} / ${label}) recorded: ${created}`);
              supersede(issues, `The cause is recorded in ${created}.`);
            }
          }
          
          // Side publications (CI-CD-PLATFORM-STANDARD.md §4.6 "Side publications", workspace scripts/lib/side-publication.mjs):
          // a group declared `"release_role": "side"` whose publication failed leaves the Delivery run green and marks its
          // job with the step below. Each such group has exactly one open known-error issue of its own (marker
          // `known-error-side: <workflow> / <group>`, never the workflow marker, so a green product run does not close
          // it): opened on its first failure, commented on every further one, closed by the first run in which the group's
          // lane ran green. Red or green, every run of the workflow is read for them.
          (() => {
            const SIDE_STEP = 'Side publication failed (does not gate)';
            const SIDE_TITLE = 'Side publication failed';
            const RED = ['failure', 'timed_out', 'startup_failure', 'action_required', 'cancelled'];
            if (!jobs) return;
            const lanes = new Map();
            for (const job of jobs) {
              const group = /(?:^| \/ )Deliver · ([^ /]+) \/ /.exec(job.name || '')?.[1];
              if (group) lanes.set(group, [...(lanes.get(group) || []), job]);
            }
            if (!lanes.size) return;
            const sideJob = job => job.status === 'completed' && job.conclusion === 'success' && job.steps.some(step => step.name === SIDE_STEP && step.conclusion === 'success');
            const ran = job => job.conclusion === 'success' && !job.steps.some(step => step.name === 'Run product-owned operation' && step.conclusion === 'skipped');
            let issues = null;
            for (const [group, lane] of lanes) {
              const marker = `known-error-side: ${WORKFLOW} / ${group}`;
              const failed = lane.filter(sideJob);
              const publish = lane.filter(job => job.name.includes(`Publish · ${group}`));
              const green = !failed.length && !lane.some(job => RED.includes(job.conclusion) || job.status !== 'completed') && publish.length && publish.every(ran);
              if (!failed.length && !green) continue;
              try {
                issues ??= known();
                const open = issues.filter(item => (item.body || '').split(/\r?\n/).includes(marker));
                if (green) {
                  for (const issue of open) {
                    gh('issue', 'close', String(issue.number), '--repo', repo, '--comment', `${group} published again at ${HEAD_SHA}: ${RUN_URL}`);
                    note(`side publication ${group} of ${WORKFLOW} green again: issue #${issue.number} closed`);
                  }
                  continue;
                }
                let child = '';
                try {
                  const annotation = JSON.parse(gh('api', `repos/${repo}/check-runs/${failed[0].id}/annotations?per_page=50`) || '[]').find(item => item.title === SIDE_TITLE);
                  child = annotation?.message || '';
                } catch { /* the job summary still names the child */ }
                const where = `- Job: ${failed[0].html_url || RUN_URL}${child ? `\n- Child: ${child.slice(0, 600)}` : ''}`;
                if (open.length) {
                  gh('issue', 'comment', String(open[0].number), '--repo', repo, '--body', `Failed again at ${HEAD_SHA}: ${RUN_URL}\n${where}`);
                  note(`side publication ${group} of ${WORKFLOW} failed again: issue #${open[0].number}`);
                  continue;
                }
                const mention = (ALERT || '').split(/\s+/).filter(Boolean).map(login => `@${login}`).join(' ');
                const body = [
                  marker,
                  '',
                  `${mention ? `${mention} ` : ''}The side publication **${group}** of **${WORKFLOW}** failed on \`main\`. It does not gate the product's release: the Delivery run stays green and other groups retain their own outcomes. The next Delivery of the product runs this group again.`,
                  '',
                  where,
                  `- Run: ${RUN_URL}${RUN_TITLE ? ` (${RUN_TITLE.slice(0, 160)})` : ''}`,
                  `- First seen at ${HEAD_SHA}`,
                  '',
                  'This issue receives a comment for every further failure of this group and closes itself when a later run publishes the group.',
                ].join('\n');
                try { gh('label', 'create', 'known-error', '--repo', repo, '--color', 'B60205', '--description', 'Red delivery run on main; one issue per cause'); } catch { /* exists */ }
                const created = gh('issue', 'create', '--repo', repo, '--label', 'known-error', '--title', `Side publication failed: ${WORKFLOW} / ${group}`.slice(0, 250), '--body', body).trim();
                issues = null;
                note(`side publication ${group} of ${WORKFLOW} failed: ${created}`);
              } catch (error) {
                note(`side publication ${group} of ${WORKFLOW}: not recorded (${String(error.message).split('\n')[0].slice(0, 120)})`);
              }
            }
          })();
          
          // D-2026-11-16-05: a green release can still carry findings. Reports have their
          // own marker, so the workflow-green closer above never closes an unresolved cause.
          // The text of a report issue comes only from workflow, job and step names and from an allowlisted cause and
          // group: an annotation message or summary is never copied (it can carry text a provider or a caller chose).
          // A report issue closes when the same job ran green again and its cause is no longer reported.
          (async () => {
            const PREFIX = 'Report release finding:';
            const MARK = 'known-error-delivery-report: ';
            const RED = ['failure', 'timed_out', 'cancelled'];
            const plain = (text, max = 160) => String(text ?? '').replace(/[^A-Za-z0-9 ._:\/·()+-]/g, '?').replace(/\/{2,}/g, '/').slice(0, max);
            const causeOk = cause => typeof cause === 'string' && /^(?:(?:delivery|database)\.[a-z0-9][a-z0-9.-]{0,60}|child:[^\r\n]{1,200})$/.test(cause);
            const groupOk = group => group === '' || /^[A-Za-z0-9][A-Za-z0-9._-]{0,60}$/.test(group);
            const field = (body, name) => new RegExp(`^${name}: (.*)$`, 'm').exec(body || '')?.[1] ?? '';
            const mention = (ALERT || '').split(/\s+/).filter(Boolean).map(login => `@${login}`).join(' ');
            let cached = null;
            const openIssues = () => (cached ??= known());
            for (const job of jobs ?? []) {
              try {
                const checkId = /\/check-runs\/([1-9]\d*)$/.exec(job.check_run_url || '')?.[1];
                const findings = new Map();
                const reportSteps = job.steps.filter(step => step.name.startsWith(PREFIX));
                for (const step of reportSteps.filter(item => RED.includes(item.conclusion))) {
                  const cause = step.name.slice(PREFIX.length).trim();
                  const fingerprint = crypto.createHash('sha1').update(`${WORKFLOW}|${job.name}||${cause}`).digest('hex').slice(0, 12);
                  findings.set(fingerprint, { cause: plain(cause), group: '', summary: `${plain(step.name)}: ${step.conclusion}; see the retained step log.` });
                }
                let annotationsRead = false;
                try {
                  if (checkId) {
                    const annotations = JSON.parse(gh('api', '--paginate', '--slurp', `repos/${repo}/check-runs/${checkId}/annotations?per_page=100`)).flat();
                    annotationsRead = true;
                    for (const annotation of annotations.filter(item => item.title === 'Delivery report')) {
                      let finding;
                      try { finding = JSON.parse(annotation.message); }
                      catch { note(`Delivery report of ${plain(job.name)}: malformed annotation; inspect ${RUN_URL}.`); continue; }
                      const group = typeof finding?.group === 'string' ? finding.group : '';
                      if (!causeOk(finding?.cause) || !groupOk(group)) { note(`Delivery report of ${plain(job.name)}: cause or group is not allowlisted; inspect ${RUN_URL}.`); continue; }
                      const fingerprint = crypto.createHash('sha1').update(`${WORKFLOW}|${job.name}|${group}|${finding.cause}`).digest('hex').slice(0, 12);
                      findings.set(fingerprint, { cause: plain(finding.cause), group, summary: 'Reported by the Delivery report annotation of the job; see the retained step log.' });
                    }
                  }
                } catch { note(`Delivery annotations of ${plain(job.name)}: unavailable; named report steps remain observable.`); }
          
                if (findings.size) {
                  try { gh('label', 'create', 'known-error', '--repo', repo, '--color', 'B60205', '--description', 'Delivery findings; one issue per cause'); }
                  catch { /* the existing label is reused */ }
                  for (const [fingerprint, finding] of findings) {
                    const reportMarker = `${MARK}${fingerprint}`;
                    const open = openIssues().find(issue => (issue.body || '').split(/\r?\n/).includes(reportMarker));
                    const detail = `${finding.summary}\n\nRun: ${RUN_URL}\nSource: ${HEAD_SHA}`;
                    if (open) {
                      gh('issue', 'comment', String(open.number), '--repo', repo, '--body', detail);
                      note(`Delivery report ${finding.cause}: issue #${open.number} updated.`);
                    } else {
                      const body = [reportMarker, '', `${mention} Delivery continued; this finding does not decide release production.`,
                        `Workflow: ${WORKFLOW}`, `Job: ${plain(job.name)}`, `Group: ${finding.group || 'n/a'}`, `Cause: ${finding.cause}`, '', detail].join('\n');
                      const created = gh('issue', 'create', '--repo', repo, '--label', 'known-error', '--title', `Delivery report: ${WORKFLOW} / ${finding.cause}`.slice(0, 250), '--body', body).trim();
                      note(`Delivery report ${finding.cause}: ${created}`);
                      cached = null;
                    }
                  }
                }
          
                // Green again: the same job of this workflow completed successfully and no longer reports the cause. A cause
                // named by a report step needs that step to have run green; an annotation cause needs the annotations read.
                if (job.status !== 'completed' || job.conclusion !== 'success') continue;
                for (const issue of openIssues()) {
                  const lines = (issue.body || '').split(/\r?\n/);
                  const markerLine = lines.find(line => line.startsWith(MARK));
                  if (!markerLine || findings.has(markerLine.slice(MARK.length).trim())) continue;
                  if (field(issue.body, 'Workflow') !== WORKFLOW || field(issue.body, 'Job') !== plain(job.name)) continue;
                  const cause = field(issue.body, 'Cause');
                  const step = reportSteps.find(item => plain(item.name.slice(PREFIX.length).trim()) === cause);
                  if (step ? step.conclusion !== 'success' : !annotationsRead) continue;
                  gh('issue', 'close', String(issue.number), '--repo', repo, '--comment', `Green again at ${HEAD_SHA}: ${RUN_URL}`);
                  note(`Delivery report ${cause}: green again, issue #${issue.number} closed.`);
                  cached = null;
                }
              } catch (error) {
                note(`Delivery reports of ${plain(job.name)}: filing unavailable (${plain(String(error.message).split('\n')[0], 120)}); finding remains in the job annotation.`);
              }
            }
          })();
          JS
