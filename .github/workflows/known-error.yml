name: Record known error

# Generated by kombify-workspace scripts/integration-lane-sync.mjs from
# .kombify/integration-lane.json (D-2026-11-01-08). Do not edit it.
# Records a red workflow that the integration lane dispatched as one known-error issue per fingerprint.
# The job is skipped (no minutes) for every other result. It blocks nothing; the workspace CI backlog
# (scripts/ci-failure-backlog.mjs) files the Beads task for the same red run.
on:
  workflow_run:
    workflows: ["Delivery v2", "Public Safety Gate"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  record:
    if: github.repository == 'KombiverseLabs/mintlify-docs' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Record the known error
        shell: bash
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { WORKFLOW, CONCLUSION, RUN_ID, RUN_URL, HEAD_SHA, GITHUB_REPOSITORY: repo, GITHUB_STEP_SUMMARY: summary } = process.env;
          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8', maxBuffer: 1e8, stdio: ['ignore', 'pipe', 'pipe'] });
          const note = line => fs.appendFileSync(summary, `${line}\n`);
          
          // A red dispatched workflow is a known error (D-2026-11-01-08): recorded once per fingerprint, never a block, never a retry.
          let job = 'run', step = CONCLUSION;
          try {
            const failed = JSON.parse(gh('api', `repos/${repo}/actions/runs/${RUN_ID}/jobs`, '--jq', '[.jobs[] | select(.conclusion == "failure")][0] // {}') || '{}');
            job = failed.name || job;
            step = (failed.steps || []).find(item => item.conclusion === 'failure')?.name || step;
          } catch { /* the run page still names the failure */ }
          const fingerprint = crypto.createHash('sha1').update(`${WORKFLOW}|${job}|${step}`).digest('hex').slice(0, 12);
          const body = `known-error-fingerprint: ${fingerprint}\n\n- First seen at ${HEAD_SHA}\n- Workflow: ${WORKFLOW}\n- Job: ${job}\n- Step: ${step}\n- Conclusion: ${CONCLUSION}\n- Run: ${RUN_URL}\n\nKnown error of the batched integration lane (D-2026-11-01-08). It blocks no push, merge or release; fix it in a new change. The workspace CI backlog (scripts/ci-failure-backlog.mjs, every two hours) files the Beads task for this red run (label ci-failure:<hash>) and closes it once the workflow is green again.`;
          try { gh('label', 'create', 'known-error', '--repo', repo, '--color', 'B60205', '--description', 'Recorded integration-lane failure; blocks nothing'); } catch { /* exists */ }
          const open = gh('issue', 'list', '--repo', repo, '--label', 'known-error', '--state', 'open', '--search', `${fingerprint} in:body`, '--json', 'number', '--jq', '.[0].number // empty').trim();
          if (open) {
            gh('issue', 'comment', open, '--repo', repo, '--body', `Seen again at ${HEAD_SHA}: ${RUN_URL}`);
            note(`known error ${fingerprint} (${WORKFLOW} / ${step}) seen again: issue #${open}`);
          } else {
            const created = gh('issue', 'create', '--repo', repo, '--label', 'known-error', '--title', `Known error: ${WORKFLOW} / ${step} (${fingerprint})`, '--body', body).trim();
            note(`known error ${fingerprint} (${WORKFLOW} / ${step}) recorded: ${created}`);
          }
          JS
