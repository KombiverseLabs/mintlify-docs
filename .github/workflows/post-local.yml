# Generated by kombify-workspace development-fleet projection.
# Public-repository adapter synchronized from KombiverseLabs/.github@c270f227276ba156ef46f087c5cccdf389377df2.
name: Post-Local
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group: null
permissions:
  contents: read
jobs:
  candidate:
    name: Validate candidate
    if: ${{ always() }}
    runs-on: ${{ startsWith(vars.GHA_HOSTED_RUNNER, 'depot-') && 'depot-ubuntu-24.04' || 'ubuntu-24.04' }}
    timeout-minutes: 2
    outputs:
      source: ${{ steps.candidate.outputs.source }}
      base: ${{ steps.candidate.outputs.base }}
      runner: ${{ steps.candidate.outputs.runner }}
      private-store: ${{ steps.candidate.outputs.private-store }}
      gate: ${{ steps.candidate.outputs.gate }}
      disposition: ${{ steps.candidate.outputs.disposition }}
    steps:
      - name: Bind candidate to event
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REQUESTED_SOURCE: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          REQUESTED_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          REQUESTED_RUNNER: depot-ubuntu-24.04
          ORG_RUNNER: ${{ vars.GHA_HOSTED_RUNNER }}
        with:
          script: |
            const event = context.eventName;
            const candidate = event === 'pull_request' ? {
              source: context.payload.pull_request?.head?.sha,
              base: context.payload.pull_request?.base?.sha,
            } : event === 'merge_group' ? {
              source: context.payload.merge_group?.head_sha,
              base: context.payload.merge_group?.base_sha,
            } : null;
            // Any supplied candidate must match the event. Without a source input
            // (including direct Required Workflows), bind to the event. Private
            // store eligibility is separately restricted to the reviewed repositories.
            const reusableCall = Boolean(process.env.REQUESTED_SOURCE);
            const requestedSource = process.env.REQUESTED_SOURCE || candidate?.source;
            const requestedBase = process.env.REQUESTED_BASE || candidate?.base;
            const sha = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
            if (!candidate || !sha(candidate.source) || !sha(candidate.base) ||
                requestedSource !== candidate.source || requestedBase !== candidate.base) {
              throw new Error('PR or merge-group event and exact candidate revisions must agree');
            }
            const runner = process.env.REQUESTED_RUNNER || 'depot-ubuntu-24.04';
            if (!['depot-ubuntu-24.04', 'ubuntu-24.04'].includes(runner)) {
              throw new Error('Post-local execution requires an approved ephemeral Linux runner');
            }
            // During a runner failover the org variable no longer names a Depot
            // label; the other approved ephemeral runner keeps the evidence flowing.
            const orgRunner = (process.env.ORG_RUNNER || '').trim();
            const failover = orgRunner !== '' && !orgRunner.startsWith('depot-');
            // Native stacked pull requests (CI-CD-PLATFORM-STANDARD §4.4): a mid-stack
            // layer carries no evidence of its own; the top layer, which contains the
            // whole change, or the merge queue verifies the stack. The top layer is
            // compared with the stack's fork point so affected checks see every layer.
            const pullRequest = event === 'pull_request' ? context.payload.pull_request : null;
            if (pullRequest && typeof pullRequest.draft !== 'boolean') {
              throw new Error('Pull request draft eligibility is unavailable');
            }
            const stack = pullRequest?.stack;
            let base = candidate.base;
            let gate = true;
            let disposition = pullRequest?.draft ? 'draft' : 'required';
            if (stack) {
              if (!Number.isInteger(stack.position) || !Number.isInteger(stack.size) ||
                  stack.position < 1 || stack.position > stack.size || !sha(stack.base?.sha)) {
                throw new Error('Stacked pull request metadata is incomplete');
              }
              if (disposition === 'required' && stack.position < stack.size) {
                gate = false;
                disposition = 'mid-stack';
              } else if (disposition === 'required') {
                const [owner, repo] = String(context.payload.repository?.full_name ?? '').split('/');
                const { data } = await github.request('GET /repos/{owner}/{repo}/compare/{basehead}', {
                  owner, repo, basehead: `${stack.base.sha}...${candidate.source}`,
                });
                if (!sha(data?.merge_base_commit?.sha)) throw new Error('Stack fork point is unavailable');
                base = data.merge_base_commit.sha;
              }
            }
            if (disposition === 'draft') gate = false;
            core.setOutput('source', candidate.source);
            core.setOutput('base', base);
            core.setOutput('gate', String(gate));
            core.setOutput('disposition', disposition);
            core.setOutput('runner', failover && runner === 'depot-ubuntu-24.04' ? 'ubuntu-24.04' : runner);
            // Only reviewed private, same-repository candidates receive dependency
            // contents. AI supports direct Required Workflows; Gateway retains its
            // existing reusable-call-only pilot. Forks cannot use either store.
            const repository = context.payload.repository;
            const sameRepository = event === 'merge_group' ||
              context.payload.pull_request?.head?.repo?.full_name === repository?.full_name;
            core.setOutput('private-store', String(
              repository?.private === true && sameRepository &&
              (repository.full_name === 'KombiverseLabs/kombify-AI-Platform' ||
               (reusableCall && repository.full_name === 'KombiverseLabs/kombify-Gateway'))));
  fast:
    name: Focused fast gate
    needs: candidate
    if: ${{ !cancelled() && needs.candidate.result == 'success' && needs.candidate.outputs.gate == 'true' }}
    runs-on: ${{ needs.candidate.outputs.runner }}
    timeout-minutes: 10
    env:
      CI: "true"
      MISE_YES: "1"
      KOMBIFY_BASE_SHA: ${{ needs.candidate.outputs.base }}
    steps:
      - name: Install verified mise on the fresh runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_VERSION: 2026.9.14
          MISE_SHA256: 2b289d1b3074e0b1d3f95bad0bd78bbc517c1a5bcb020cbc1643d260f5d1a351
        shell: bash
        run: |
          set -euo pipefail
          mise_bin="$RUNNER_TEMP/post-local-mise/bin/mise"
          mkdir -p "$(dirname "$mise_bin")"
          download="$(mktemp)"
          trap 'rm -f "$download"' EXIT
          asset_name="mise-v${MISE_VERSION}-linux-x64"
          release_api="https://api.github.com/repos/jdx/mise/releases/tags/v${MISE_VERSION}"
          asset_api="$(curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$release_api" | jq -er --arg name "$asset_name" \
            '[.assets[] | select(.name == $name) | .url] | if length == 1 then .[0] else empty end')"
          if [[ ! "$asset_api" =~ ^https://api\.github\.com/repos/jdx/mise/releases/assets/[0-9]+$ ]]; then
            echo "::error::Resolved mise asset is not an exact GitHub release asset"
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$asset_api" --output "$download"
          echo "$MISE_SHA256  $download" | sha256sum --check
          install -m 0755 "$download" "$mise_bin"
          dirname "$mise_bin" >> "$GITHUB_PATH"
          "$mise_bin" --version
      - name: Check out exact caller source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run repository evidence without private credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f mise.toml ]]; then
            mise trust "$PWD/mise.toml"
          elif [[ -f .mise.toml ]]; then
            mise trust "$PWD/.mise.toml"
          else
            echo "::error::post-local requires a repository mise configuration"
            exit 1
          fi
          mise install
          task_names="$(mise tasks ls --local --name-only)"
          if grep -Fxq 'ci:bootstrap' <<<"$task_names"; then
            mise run ci:bootstrap
          fi
          if grep -Fxq 'ci:lint' <<<"$task_names"; then
            mise run ci:lint
          elif grep -Fxq 'lint' <<<"$task_names"; then
            mise run lint
          else
            echo "::error::repository lint evidence is missing"
            exit 1
          fi
          if grep -Fxq 'ci:security' <<<"$task_names"; then
            mise run ci:security
          else
            echo "::error::repository security evidence is missing"
            exit 1
          fi
  dependency-review:
    name: Dependency review
    needs: candidate
    if: needs.candidate.outputs.gate == 'true'
    runs-on: ${{ needs.candidate.outputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ needs.candidate.outputs.base }}
          head-ref: ${{ needs.candidate.outputs.source }}
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: false
          warn-only: false
          retry-on-snapshot-warnings: false
      - name: Reject incomplete dependency snapshots
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BASE_SHA: ${{ needs.candidate.outputs.base }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source }}
        with:
          script: |
            // The dependency-review action logs snapshot warnings without failing.
            // Inspect every response page in this separate, checkout-free job.
            for await (const response of github.paginate.iterator(
              'GET /repos/{owner}/{repo}/dependency-graph/compare/{basehead}', {
                ...context.repo,
                basehead: `${process.env.BASE_SHA}...${process.env.SOURCE_SHA}`,
                per_page: 100,
              })) {
              const warning = response.headers['x-github-dependency-graph-snapshot-warnings'];
              if (warning !== undefined && warning !== '') {
                throw new Error('Dependency snapshots are incomplete; security evidence remains unverified');
              }
              // Snapshots may finish between the native action and this read.
              // Evaluate the same complete pages so a newly materialized finding
              // cannot inherit the earlier action's empty comparison verdict.
              if (!Array.isArray(response.data)) throw new Error('Invalid dependency comparison');
              for (const change of response.data) {
                if (!['added', 'removed'].includes(change.change_type) ||
                    (change.vulnerabilities !== undefined && !Array.isArray(change.vulnerabilities))) {
                  throw new Error('Invalid dependency change evidence');
                }
                if (change.change_type !== 'added') continue;
                for (const finding of change.vulnerabilities ?? []) {
                  if (!['low', 'moderate'].includes(finding.severity)) {
                    throw new Error('Introduced high/critical or unclassified dependency finding');
                  }
                }
              }
            }
  passed:
    name: post-local-passed
    needs:
      - candidate
      - fast
      - dependency-review
    if: ${{ always() }}
    runs-on: ${{ startsWith(vars.GHA_HOSTED_RUNNER, 'depot-') && 'depot-ubuntu-24.04' || 'ubuntu-24.04' }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report actual post-local results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          REPOSITORY_RESULT: ${{ needs.fast.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          CANDIDATE_GATE: ${{ needs.candidate.outputs.gate }}
          CANDIDATE_DISPOSITION: ${{ needs.candidate.outputs.disposition }}
        with:
          script: |
            const results = {
              candidate: process.env.CANDIDATE_RESULT,
              repository: process.env.REPOSITORY_RESULT,
              dependency: process.env.DEPENDENCY_RESULT,
            };
            core.info(JSON.stringify(results));
            const disposition = process.env.CANDIDATE_DISPOSITION;
            if (results.candidate !== 'success') {
              throw new Error('Candidate validation failed, was cancelled, or is missing');
            }
            if (disposition === 'draft') {
              if (process.env.CANDIDATE_GATE !== 'false' ||
                  results.repository !== 'skipped' || results.dependency !== 'skipped') {
                throw new Error('A draft candidate must not run or report post-local evidence');
              }
              throw new Error('Draft candidates are not eligible post-local evidence');
            }
            // A validated, ready mid-stack layer deliberately carries no evidence. The
            // ready top layer or merge queue verifies the whole stack.
            if (disposition === 'mid-stack') {
              if (process.env.CANDIDATE_GATE !== 'false') {
                throw new Error('A mid-stack layer cannot require its own evidence gate');
              }
              if (results.repository !== 'skipped' || results.dependency !== 'skipped') {
                throw new Error('A mid-stack layer must not run or report its own post-local evidence');
              }
              core.notice('Mid-stack layer: the top of the stack or the merge queue carries the post-local evidence.');
              return;
            }
            if (disposition !== 'required' || process.env.CANDIDATE_GATE !== 'true') {
              throw new Error('Candidate evidence disposition is invalid or missing');
            }
            if (Object.values(results).some(result => result !== 'success')) {
              throw new Error('Post-local evidence failed, was cancelled, or is missing');
            }
            core.notice('Post-local evidence succeeded. This is not a mandatory risk review or full security attestation.');
concurrency:
  group: post-local-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, (true) && 'active' || 'inactive') || github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_sha) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
