# Generated by kombify-workspace development-fleet projection.
# Public-repository adapter synchronized from KombiverseLabs/.github@68bf809c0072aadf418e9e97cd70ae2fb1b967cf.
name: Post-Local
on:
  pull_request:
    branches:
      - main
  merge_group: null
permissions:
  contents: read
jobs:
  candidate:
    name: Validate candidate
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 2
    outputs:
      source: ${{ steps.candidate.outputs.source }}
      base: ${{ steps.candidate.outputs.base }}
      runner: ${{ steps.candidate.outputs.runner }}
    steps:
      - name: Bind candidate to event
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REQUESTED_SOURCE: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          REQUESTED_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          REQUESTED_RUNNER: depot-ubuntu-24.04
        with:
          script: |
            const event = context.eventName;
            const candidate = event === 'pull_request' ? {
              source: context.payload.pull_request?.head?.sha,
              base: context.payload.pull_request?.base?.sha,
            } : event === 'merge_group' ? {
              source: context.payload.merge_group?.head_sha,
              base: context.payload.merge_group?.base_sha,
            } : null;
            const sha = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
            if (!candidate || !sha(candidate.source) || !sha(candidate.base) ||
                process.env.REQUESTED_SOURCE !== candidate.source ||
                (process.env.REQUESTED_BASE && process.env.REQUESTED_BASE !== candidate.base)) {
              throw new Error('PR or merge-group event and exact candidate revisions must agree');
            }
            const runner = process.env.REQUESTED_RUNNER;
            if (!['depot-ubuntu-24.04', 'ubuntu-24.04'].includes(runner)) {
              throw new Error('Post-local execution requires an approved ephemeral Linux runner');
            }
            core.setOutput('source', candidate.source);
            core.setOutput('base', candidate.base);
            core.setOutput('runner', runner);
  fast:
    name: Focused fast gate
    needs: candidate
    runs-on: ${{ needs.candidate.outputs.runner }}
    timeout-minutes: 5
    env:
      CI: "true"
      MISE_YES: "1"
      KOMBIFY_BASE_SHA: ${{ needs.candidate.outputs.base }}
    steps:
      - name: Install verified mise on the fresh runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_ASSET_API: https://api.github.com/repos/jdx/mise/releases/assets/471759882
          MISE_SHA256: 5f7ab76afdf0780d12edeaa67e908094e9ccf7924cfe203e415c1cfb87bbf778
        shell: bash
        run: |
          set -euo pipefail
          mise_bin="$RUNNER_TEMP/post-local-mise/bin/mise"
          mkdir -p "$(dirname "$mise_bin")"
          download="$(mktemp)"
          trap 'rm -f "$download"' EXIT
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$MISE_ASSET_API" --output "$download"
          echo "$MISE_SHA256  $download" | sha256sum --check
          install -m 0755 "$download" "$mise_bin"
          dirname "$mise_bin" >> "$GITHUB_PATH"
          "$mise_bin" --version
      - name: Check out exact caller source without retained credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.candidate.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run repository evidence without private credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f mise.toml ]]; then
            mise trust "$PWD/mise.toml"
          elif [[ -f .mise.toml ]]; then
            mise trust "$PWD/.mise.toml"
          else
            echo "::error::post-local requires a repository mise configuration"
            exit 1
          fi
          mise install
          task_names="$(mise tasks ls --local --name-only)"
          if grep -Fxq 'ci:bootstrap' <<<"$task_names"; then
            mise run ci:bootstrap
          fi
          if grep -Fxq 'ci:lint' <<<"$task_names"; then
            mise run ci:lint
          elif grep -Fxq 'lint' <<<"$task_names"; then
            mise run lint
          else
            echo "::error::repository lint evidence is missing"
            exit 1
          fi
          if grep -Fxq 'ci:security' <<<"$task_names"; then
            mise run ci:security
          else
            echo "::error::repository security evidence is missing"
            exit 1
          fi
  dependency-review:
    name: Dependency review
    needs: candidate
    runs-on: ${{ needs.candidate.outputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          base-ref: ${{ needs.candidate.outputs.base }}
          head-ref: ${{ needs.candidate.outputs.source }}
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: false
          warn-only: false
          retry-on-snapshot-warnings: false
      - name: Reject incomplete dependency snapshots
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BASE_SHA: ${{ needs.candidate.outputs.base }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source }}
        with:
          script: |
            // The dependency-review action logs snapshot warnings without failing.
            // Inspect every response page in this separate, checkout-free job.
            for await (const response of github.paginate.iterator(
              'GET /repos/{owner}/{repo}/dependency-graph/compare/{basehead}', {
                ...context.repo,
                basehead: `${process.env.BASE_SHA}...${process.env.SOURCE_SHA}`,
                per_page: 100,
              })) {
              const warning = response.headers['x-github-dependency-graph-snapshot-warnings'];
              if (warning !== undefined && warning !== '') {
                throw new Error('Dependency snapshots are incomplete; security evidence remains unverified');
              }
              // Snapshots may finish between the native action and this read.
              // Evaluate the same complete pages so a newly materialized finding
              // cannot inherit the earlier action's empty comparison verdict.
              if (!Array.isArray(response.data)) throw new Error('Invalid dependency comparison');
              for (const change of response.data) {
                if (!['added', 'removed'].includes(change.change_type) ||
                    (change.vulnerabilities !== undefined && !Array.isArray(change.vulnerabilities))) {
                  throw new Error('Invalid dependency change evidence');
                }
                if (change.change_type !== 'added') continue;
                for (const finding of change.vulnerabilities ?? []) {
                  if (!['low', 'moderate'].includes(finding.severity)) {
                    throw new Error('Introduced high/critical or unclassified dependency finding');
                  }
                }
              }
            }
  passed:
    name: post-local-passed
    needs:
      - candidate
      - fast
      - dependency-review
    if: ${{ always() }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report actual post-local results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          REPOSITORY_RESULT: ${{ needs.fast.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        with:
          script: |
            const results = {
              candidate: process.env.CANDIDATE_RESULT,
              repository: process.env.REPOSITORY_RESULT,
              dependency: process.env.DEPENDENCY_RESULT,
            };
            core.info(JSON.stringify(results));
            if (Object.values(results).some(result => result !== 'success')) {
              throw new Error('Post-local evidence failed, was cancelled, or is missing');
            }
            core.notice('Post-local evidence succeeded. This is not a mandatory risk review or full security attestation.');
concurrency:
  group: post-local-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true
