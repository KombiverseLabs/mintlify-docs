name: Generated StackKits Docs

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *"
  repository_dispatch:
    types: [stackkit-tool-content-published]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generated-stackkit-docs
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.4"

jobs:
  refresh:
    name: Refresh generated StackKits docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout docs
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check StackKits checkout token
        id: prereq
        env:
          STACKKITS_TOKEN: ${{ secrets.REPO_SYNC_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${STACKKITS_TOKEN}" ]; then
            echo "::notice::REPO_SYNC_PAT is not configured; generated docs refresh is waiting for CP-3/CP-4 wiring."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout StackKits emitter
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: KombiverseLabs/kombify-StackKits
          path: _stackkits
          token: ${{ secrets.REPO_SYNC_PAT }}

      - name: Setup Go
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: _stackkits/go.sum

      - name: Check docs emitter exists
        id: emitter
        if: steps.prereq.outputs.ready == 'true'
        working-directory: _stackkits
        run: |
          set -euo pipefail
          if go run ./cmd/stackkit docs emit-mintlify --help >/tmp/emit-mintlify-help.txt 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::stackkit docs emit-mintlify is not available yet; CP-4 remains blocked on kombify-StackKits-asc.2."
          cat /tmp/emit-mintlify-help.txt
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Fetch Admin registry snapshot
        if: steps.emitter.outputs.ready == 'true'
        working-directory: _stackkits
        env:
          STACKKIT_ADMIN_ENDPOINT: ${{ secrets.STACKKIT_ADMIN_ENDPOINT }}
          STACKKIT_ADMIN_TOKEN: ${{ secrets.STACKKIT_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${STACKKIT_ADMIN_ENDPOINT}" ] || [ -z "${STACKKIT_ADMIN_TOKEN}" ]; then
            echo "::error::STACKKIT_ADMIN_ENDPOINT / STACKKIT_ADMIN_TOKEN repo secrets are not configured"
            exit 1
          fi
          go run ./cmd/stackkit registry snapshot \
            --endpoint "${STACKKIT_ADMIN_ENDPOINT}" \
            --token "${STACKKIT_ADMIN_TOKEN}" \
            --output "${RUNNER_TEMP}/registry_snapshot.json"

      - name: Emit Mintlify docs
        if: steps.emitter.outputs.ready == 'true'
        working-directory: _stackkits
        run: |
          set -euo pipefail
          go run ./cmd/stackkit docs emit-mintlify \
            --input "${RUNNER_TEMP}/registry_snapshot.json" \
            --output-dir "${GITHUB_WORKSPACE}"

      - name: Validate generated ownership gate
        if: steps.emitter.outputs.ready == 'true'
        shell: pwsh
        run: |
          ./scripts/run-local-e2e.ps1 -SkipMintCli

      - name: Open generated docs PR
        if: steps.emitter.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/generated-stackkit-docs-${GITHUB_RUN_ID}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "${branch}"

          paths=(docs.json guides/stackkits/services)
          if [ -d stackkits/reference/tools ]; then
            paths+=(stackkits/reference/tools)
          fi
          git add -- "${paths[@]}"

          if git diff --cached --quiet; then
            echo "No generated docs changes."
            exit 0
          fi

          git commit -m "docs: refresh generated StackKits tool docs"
          git push --force-with-lease origin "${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "docs: refresh generated StackKits tool docs" \
            --body "Generated by the CP-4 StackKits docs refresh workflow. Review scope is limited to generated:true MDX pages and docs.json navigation updates."
