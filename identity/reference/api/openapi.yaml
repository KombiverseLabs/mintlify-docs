openapi: 3.1.0
info:
  title: kombify Gateway API
  description: |
    Public API reference for the kombify platform, served through the kombify public edge at `api.kombify.io`.
    All public traffic is served by the Cloudflare edge worker at `api.kombify.io`; the legacy Kong ingress was decommissioned 2026-04-17.

    ## Service Domains

    | Prefix | Service | Description |
    |--------|---------|-------------|
    | `/v1/orchestrator` | Techstack | Core orchestration, projects, users, billing |
    | `/v1/simulation` | kombiSim | Infrastructure simulation engine |
    | `/v1/stackkits` | StackKits | IaC/CUE logic service (coming soon) |
    | `/v1/subdomains` | kombify-Me | Subdomain registry & tunnel gateway |
    | `/v1/ai` | kombify-AI-Platform | AI server APIs, provider/model routing, sessions, responses, structured output |
    | `/v1/embed` | kombify-AI-Platform | Embed API and Floating Panel iframe surface |
    | `/v1/cloud` | kombify-Cloud | Companion and cloud account APIs |
    | `/v1/admin` | kombify-Administration | Protected operator and administration APIs |
    | `/v1/connectors` | Gateway Connector Vault | Connector catalog and opaque grant metadata |
    | `/v1/harnesses` | Gateway harness policy | Harness settings projection and connector bindings |
    | `/v1/ril` | Gateway RIL preflight -> TechStack | RIL server/action policy preflight and forwarding |
    | `/v1/agents` | kombify-Agents | Canonical agent runtime API |
    | `/a2a` | kombify-Agents | Agent-to-Agent federation (JSON-RPC) |

    ## Authentication

    Most endpoints require one of:
    - **JWT** (Auth0 OIDC/OAuth): `Authorization: Bearer <token>` — for end users
    - **API Key / service credential**: `X-Api-Key: <key>` — for selected integrations

    Public endpoints (health, auth-mode, capabilities) require no authentication.
    Protected-route denials expose `error_code`, `reason_code`, `required_features`,
    `missing_features`, `retryable`, and structured `user_guidance`. This contract
    applies to `/v1/agents`, `/v1/ai/models`, `/v1/cloud`, and `/v1/admin` before
    the Gateway forwards a request to its origin.

    ## Rate Limits

    | Domain | Requests/min | Requests/hour | Requests/day |
    |--------|-------------|---------------|--------------|
    | Orchestrator | 300 | 5,000 | 50,000 |
    | Orchestrator AI | 60 | 500 | 5,000 |
    | Simulation | 100 | 1,000 | 10,000 |
    | StackKits | 200 | 3,000 | 30,000 |
    | Subdomains | 60 | 500 | 5,000 |
    | AI Platform | 60 | 500 | 5,000 |
    | Agents | 60 | 500 | 5,000 |

    ## Response Headers

    All responses include:
    - `X-Request-ID` — Correlation ID for tracing
    - `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset` — Rate limit info
    - Standard security headers (HSTS, CSP, X-Frame-Options: DENY)
  version: 2.0.0
  contact:
    name: kombify Team
    url: https://kombify.io
    email: support@kombify.io
  license:
    name: Proprietary
    url: https://kombify.io/terms

servers:
  - url: https://api.kombify.io
    description: Production Gateway

tags:
  - name: gateway
    description: Gateway-level health and status
  - name: orchestrator
    description: Core orchestration — projects, users, billing, workers
  - name: simulation
    description: Infrastructure simulation engine (kombiSim)
  - name: simulation-auth
    description: Simulation authentication (public, no gateway auth)
  - name: stackkits
    description: IaC/CUE logic service (not yet deployed)
  - name: subdomains
    description: Subdomain registry & tunnel gateway (kombify-Me)
  - name: ai
    description: AI Platform service — AI server APIs, models, sessions, responses, structured output
  - name: embed
    description: AI Platform embed API and Floating Panel surface
  - name: agents
    description: kombify-Agents runtime API
  - name: agents-a2a
    description: Agent-to-Agent federation protocol
  - name: connectors
    description: Gateway Connector Vault catalog and opaque grant metadata
  - name: harnesses
    description: Gateway harness connector settings and projection surfaces
  - name: ril
    description: Gateway RIL policy preflight before TechStack/StackKits execution

paths:
  # ==========================================================================
  # Gateway Health
  # ==========================================================================
  /gateway/health:
    get:
      summary: Gateway health check
      description: Returns gateway health directly (no upstream dependency). Always responds 200 if the edge worker is running.
      operationId: gatewayHealth
      tags: [gateway]
      security: []
      responses:
        "200":
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: kombify-gateway

  # ==========================================================================
  # Techstack Health / Readiness
  # ==========================================================================
  /health:
    get:
      summary: Techstack health check
      description: Proxied to the Techstack backend. Returns backend health status.
      operationId: techstackHealth
      tags: [orchestrator]
      security: []
      responses:
        "200":
          description: Backend is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      summary: Techstack readiness probe
      description: Checks if the Techstack backend can accept traffic.
      operationId: techstackReady
      tags: [orchestrator]
      security: []
      responses:
        "200":
          description: Backend is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Backend is not ready

  # ==========================================================================
  # Orchestrator (Techstack)
  # ==========================================================================
  /v1/orchestrator:
    get:
      summary: Orchestrator API root
      description: |
        All `/v1/orchestrator/**` requests are proxied to the Techstack backend.
        Path is stripped — `/v1/orchestrator/foo` becomes `/foo` on the backend.
      operationId: orchestratorRoot
      tags: [orchestrator]
      responses:
        "200":
          description: Successful response from Techstack
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Orchestrator API (write)
      operationId: orchestratorWrite
      tags: [orchestrator]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Successful response
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/orchestrator/ai:
    post:
      summary: Orchestrator AI endpoints
      description: AI-specific endpoints with stricter rate limits (60/min vs 300/min). Path stripped.
      operationId: orchestratorAI
      tags: [orchestrator]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: AI response from Techstack
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ==========================================================================
  # Capabilities (public)
  # ==========================================================================
  /v1/capabilities:
    get:
      summary: Platform capabilities discovery
      description: Returns available platform capabilities and features. Requires a signed-in bearer (closed to anonymous callers 2026-10-02).
      operationId: getCapabilities
      tags: [orchestrator]
      responses:
        "200":
          description: Capabilities list
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==========================================================================
  # Simulation (kombiSim)
  # ==========================================================================
  /v1/simulation:
    get:
      summary: Simulation API root
      description: |
        All `/v1/simulation/**` requests are proxied to kombiSim.
        Path is stripped — `/v1/simulation/foo` becomes `/foo` on the backend.
        Long timeouts (5 min) for simulation workloads.
      operationId: simulationRoot
      tags: [simulation]
      responses:
        "200":
          description: Simulation response
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/simulation/health:
    get:
      summary: Simulation health check
      description: Public health endpoint for kombiSim. No authentication required.
      operationId: simulationHealth
      tags: [simulation]
      security: []
      responses:
        "200":
          description: kombiSim is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/simulation/auth-mode:
    get:
      summary: Simulation auth mode
      description: Returns the current authentication mode of the simulation service. Public.
      operationId: simulationAuthMode
      tags: [simulation-auth]
      security: []
      responses:
        "200":
          description: Auth mode configuration

  /v1/simulation/auth/methods:
    get:
      summary: Available auth methods
      description: Lists available authentication methods for the simulation service. Public.
      operationId: simulationAuthMethods
      tags: [simulation-auth]
      security: []
      responses:
        "200":
          description: Auth methods list

  /v1/simulation/auth/oauth/url:
    get:
      summary: OAuth authorization URL
      description: Returns the OAuth authorization URL for simulation login. Public.
      operationId: simulationOAuthUrl
      tags: [simulation-auth]
      security: []
      responses:
        "200":
          description: OAuth URL

  /v1/simulation/auth/callback:
    post:
      summary: OAuth callback
      description: Handles OAuth callback after authentication. Public.
      operationId: simulationAuthCallback
      tags: [simulation-auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Auth callback processed

  /v1/simulation/auth/portal-verify:
    post:
      summary: Portal verification
      description: Verifies portal authentication tokens. Public.
      operationId: simulationPortalVerify
      tags: [simulation-auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Verification result

  # ==========================================================================
  # StackKits (not deployed)
  # ==========================================================================
  /v1/stackkits:
    get:
      summary: StackKits API (not yet deployed)
      description: Returns 503 — StackKits IaC/CUE service is not yet deployed.
      operationId: stackkitsRoot
      tags: [stackkits]
      security: []
      responses:
        "503":
          description: Service not yet deployed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: service_unavailable
                  message:
                    type: string
                    example: "StackKits service is not yet deployed. Check back later."

  # ==========================================================================
  # Subdomains (kombify-Me)
  # ==========================================================================
  /v1/subdomains:
    get:
      summary: List subdomains
      description: Proxied to kombify-Me subdomain registry. Manages `.kombify.me` subdomains.
      operationId: listSubdomains
      tags: [subdomains]
      responses:
        "200":
          description: Subdomain list
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Register subdomain
      operationId: createSubdomain
      tags: [subdomains]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Subdomain created
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/subdomains/health:
    get:
      summary: Subdomain registry health
      description: Health check for the kombify-Me service. Public.
      operationId: subdomainHealth
      tags: [subdomains]
      security: []
      responses:
        "200":
          description: Service is healthy

  # ==========================================================================
  # AI Platform — Server API Projection
  # ==========================================================================
  /v1/ai/health:
    get:
      summary: AI service health
      description: Health check for the AI service. Public, no auth.
      operationId: aiHealth
      tags: [ai]
      security: []
      responses:
        "200":
          description: AI service is healthy

  /v1/ai/health/ready:
    get:
      summary: AI service readiness
      description: Readiness check for the AI Platform origin. Public, no auth.
      operationId: aiReady
      tags: [ai]
      security: []
      responses:
        "200":
          description: AI service is ready

  /v1/ai/sessions:
    get:
      summary: List AI sessions
      operationId: listSessions
      tags: [ai]
      responses:
        "200":
          description: Session list
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create AI session
      operationId: createSession
      tags: [ai]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Session created
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/ai/projects:
    get:
      summary: List caller-owned AI projects
      operationId: listAIProjects
      tags: [ai]
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/AIProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create or resolve a caller-owned AI project
      operationId: createAIProject
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
      responses:
        "200":
          description: Existing project with the same caller-scoped name
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProject"
        "201":
          description: Project created
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProject"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/ai/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read a caller-owned AI project
      operationId: getAIProject
      tags: [ai]
      responses:
        "200":
          description: Project with an ETag matching its opaque revision
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Project not found in the caller scope
    patch:
      summary: Update a caller-owned AI project
      description: Replaces project name and/or description only when If-Match equals the current project revision.
      operationId: updateAIProject
      tags: [ai]
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
      responses:
        "200":
          description: Updated project with its replacement ETag
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Project not found in the caller scope
        "409":
          description: Another caller-owned project already uses the requested name
        "412":
          description: If-Match no longer identifies the current project revision
        "428":
          description: If-Match is required

  /v1/ai/models:
    get:
      summary: List available models
      operationId: listModels
      tags: [ai]
      responses:
        "200":
          description: Model list
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/ai/responses:
    post:
      summary: Create AI response
      description: Request a non-agent AI response from the AI Platform origin. Streaming may be returned as Server-Sent Events by the service contract.
      operationId: createAIResponse
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: AI response
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/ai/structured:
    post:
      summary: Generate structured AI output
      description: Request schema-shaped output from the AI Platform Genkit service seam.
      operationId: createStructuredAIOutput
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Structured AI output
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/embed:
    post:
      summary: Create embeddings
      description: Create text embeddings through the AI Platform origin.
      operationId: createEmbeddings
      tags: [embed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Embedding response
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/embed/floating-panel:
    get:
      summary: Floating Panel embed surface
      description: Iframe-hosted Floating Panel UI served by the AI Platform embed runtime.
      operationId: getFloatingPanelEmbed
      tags: [embed]
      responses:
        "200":
          description: Floating Panel HTML
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  # Agents — Canonical Runtime API
  # ==========================================================================
  /v1/agents:
    post:
      summary: Agents runtime endpoint
      description: Canonical kombify-Agents runtime endpoint. Detailed service-specific contracts live in the kombify-Agents repository.
      operationId: agentsRun
      tags: [agents]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Agents response
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/agents/harnesses:
    get:
      summary: Surface-filtered harness catalog
      description: >-
        Projects the Agents-owned HarnessSurfaceManifestV1 after fail-closed
        Gateway filtering by authenticated principal, surface, role, and
        entitlement. Internal policy and trusted prompt/tool-policy fields are
        never returned.
      operationId: getHarnessSurfaceManifest
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/HarnessSurface"
      responses:
        "200":
          description: Principal- and surface-filtered harness manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSurfaceManifestV1"
        "400":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/agents/harnesses/{harnessId}/capabilities:
    get:
      summary: Surface- and context-filtered harness capabilities
      description: >-
        Returns allowlisted capability metadata only. Trusted prompts and tool
        policy remain inside Agents, and unverifiable capability policy fails
        closed.
      operationId: getHarnessCapabilities
      tags: [agents]
      parameters:
        - name: harnessId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,127}$"
        - $ref: "#/components/parameters/HarnessSurface"
        - $ref: "#/components/parameters/HarnessContextKind"
      responses:
        "200":
          description: Authorized public capability metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessCapabilityManifestV1"
        "400":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/agents/workbench-orchestrator/harnesses:
    get:
      deprecated: true
      summary: Legacy alias for surface-filtered harness catalog
      description: Measured compatibility alias for `GET /v1/agents/harnesses`; it is not a second catalog.
      operationId: getLegacyHarnessSurfaceManifest
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/HarnessSurface"
      responses:
        "200":
          description: Principal- and surface-filtered harness manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSurfaceManifestV1"
        "400":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  # ==========================================================================
  # Agents — A2A Federation
  # ==========================================================================
  /a2a:
    get:
      summary: A2A agent card discovery
      description: Returns the agent card for Agent-to-Agent federation protocol.
      operationId: a2aDiscover
      tags: [agents-a2a]
      responses:
        "200":
          description: Agent card
    post:
      summary: A2A JSON-RPC
      description: Agent-to-Agent JSON-RPC message exchange.
      operationId: a2aRpc
      tags: [agents-a2a]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: RPC response

  # ==========================================================================
  # Public Beta Connector / Harness / RIL Policy Surfaces
  # ==========================================================================
  /v1/connectors/catalog:
    get:
      summary: Connector catalog
      description: Lists Gateway-approved connector surfaces. Responses never contain OAuth tokens, MCP credentials, or provider secrets.
      operationId: listConnectorCatalog
      tags: [connectors]
      responses:
        "200":
          description: Approved connector catalog
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connectors/grants:
    post:
      summary: Create connector grant metadata
      description: Stores tenant-scoped grant metadata and an opaque vault reference. Raw token fields are rejected.
      operationId: createConnectorGrant
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectorId]
              properties:
                connectorId:
                  type: string
                vaultRef:
                  type: string
                  description: Opaque Auth0 Token Vault or server-side MCP reference.
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Redacted grant metadata
        "400":
          description: Invalid body or raw credentials rejected
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connectors/oauth/paperwork/complete:
    post:
      summary: Complete Paperwork connector OAuth consent
      description: Creates an active Paperwork connector grant only from a signature-verified Paperwork-audience user token. The issued token scopes are the grant ceiling; bearer credentials are never stored.
      operationId: completePaperworkConnectorOAuth
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName:
                  type: string
      responses:
        "201":
          description: Redacted, OAuth-verified grant metadata
        "400":
          description: Caller-supplied authorization state or raw credentials rejected
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The verified token is missing required owner, client, audience, or consent scope claims

  /v1/connectors/grants/{grantId}:
    delete:
      summary: Revoke connector grant metadata
      operationId: deleteConnectorGrant
      tags: [connectors]
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted revoked grant metadata
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Grant not found for tenant

  /v1/harnesses/kombify-ai/settings:
    get:
      summary: kombify-ai harness connector projection
      operationId: getKombifyAiHarnessSettings
      tags: [harnesses]
      responses:
        "200":
          description: Redacted activated grants and connector projection
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Update kombify-ai harness connector settings
      operationId: updateKombifyAiHarnessSettings
      tags: [harnesses]
      responses:
        "200":
          description: Redacted settings projection
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/harnesses/ril-ops/connections:
    get:
      summary: ril-ops delegated connector connections
      operationId: listRilOpsConnections
      tags: [harnesses]
      responses:
        "200":
          description: Redacted delegated connector bindings
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/harnesses/{mode}/connector-bindings:
    post:
      summary: Create harness connector binding
      description: Binds an active grant to a harness. `support` is denied; `ril-ops` requires server/signal/action-card/self-healing context.
      operationId: createHarnessConnectorBinding
      tags: [harnesses]
      parameters:
        - name: mode
          in: path
          required: true
          schema:
            type: string
            enum: [kombify-ai, ril-ops, support]
      responses:
        "201":
          description: Redacted connector binding
        "403":
          description: Harness or connector not allowed
        "409":
          description: Grant missing or not active

  /v1/ril/servers/summary:
    get:
      summary: Tenant-scoped RIL server presence
      description: >-
        Returns the authenticated user's Techstack server count for ril-ops
        availability gating. Requires a user or delegated user (OBO), a
        matching organization, and a RIL read entitlement. An optional
        `tenant` query value must exactly match the authenticated organization.
        The compatibility alias `/v1/techstack/servers/summary` has the same
        policy and response contract.
      operationId: getRilServerSummary
      tags: [ril]
      parameters:
        - name: tenant
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tenant-scoped server presence summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RilServerSummaryEnvelope"
        "400":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "405":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/ril/{path}:
    get:
      summary: RIL policy-preflighted read route
      operationId: rilReadRoute
      tags: [ril]
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proxied TechStack response after Gateway policy
        "403":
          description: Entitlement, tenant, signal, or raw tool denied
    post:
      summary: RIL policy-preflighted mutation route
      operationId: rilMutationRoute
      tags: [ril]
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proxied TechStack response after Gateway policy
        "409":
          description: Connector grant, binding, or approval required

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0-issued JWT token for kombify APIs
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key from your kombify dashboard

  parameters:
    HarnessSurface:
      name: surface
      in: query
      required: true
      schema:
        type: string
        enum: [workbench, workbench-panel, workbench-studio, cloud, administration, paperwork, cmo, techstack, mobile]
    HarnessContextKind:
      name: contextKind
      in: query
      required: true
      schema:
        type: string
        enum: [none, project, server, paperwork]

  schemas:
    AIProject:
      type: object
      additionalProperties: false
      required: [id, name, revision, chatCount, fileCount, totalBytes, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        revision:
          type: string
          description: Opaque revision mirrored by the response ETag.
        chatCount:
          type: integer
          minimum: 0
        fileCount:
          type: integer
          minimum: 0
        totalBytes:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HarnessAvailabilityUserGuidance:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        nextSteps:
          type: array
          items:
            type: string

    HarnessSurfaceManifestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, revision, harnesses]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        revision:
          type: string
        harnesses:
          type: array
          items:
            $ref: "#/components/schemas/HarnessSurfaceManifestEntryV1"

    HarnessSurfaceManifestEntryV1:
      type: object
      additionalProperties: false
      required: [id, label, order, group, expertScope, surfaceAccess, availability, voice, context, dispatch]
      properties:
        id:
          type: string
        label:
          type: string
        order:
          type: integer
          minimum: 0
        group:
          type: string
        expertScope:
          type: string
          enum: [shared-experts, own-experts]
        surfaceAccess:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [surface, mode]
            properties:
              surface:
                type: string
              mode:
                type: string
                enum: [switchable, fixed-only, studio-only]
        availability:
          type: object
          additionalProperties: false
          required: [state, allowed, requiredFeatures, missingFeatures, retryable, supportContext]
          properties:
            state:
              type: string
              enum: [available, disabled, blocked, pending, degraded, unavailable]
            allowed:
              type: boolean
            errorCode:
              type: string
            reasonCode:
              type: string
            requiredFeatures:
              type: array
              maxItems: 64
              items:
                type: string
            missingFeatures:
              type: array
              maxItems: 64
              items:
                type: string
            retryable:
              type: boolean
            userGuidance:
              $ref: "#/components/schemas/HarnessAvailabilityUserGuidance"
            supportContext:
              type: object
              maxProperties: 32
              additionalProperties:
                oneOf:
                  - type: string
                  - type: boolean
                  - type: number
        voice:
          type: object
          additionalProperties: false
          required: [dictation, assistActivation, voiceAgentEntry]
          properties:
            dictation:
              type: boolean
            assistActivation:
              type: string
              enum: [hands-free-only, unavailable]
            voiceAgentEntry:
              type: string
              enum: [split-control, launcher-badge, unavailable]
        context:
          type: object
          additionalProperties: false
          required: [kind, manualDimensions]
          properties:
            kind:
              type: string
              enum: [none, project, server, paperwork]
            manualDimensions:
              type: array
              items:
                type: string
        dispatch:
          type: object
          additionalProperties: false
          required: [protocol, method, agentId, runHref, harnessMode]
          properties:
            protocol:
              type: string
              enum: [ag-ui]
            method:
              type: string
              enum: [POST]
            agentId:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]{0,127}$"
            runHref:
              type: string
              pattern: "^/ag-ui/[a-z0-9][a-z0-9-]{0,127}/runs$"
            harnessMode:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]{0,127}$"
        capabilitiesHref:
          type: string

    RilServerSummaryEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [count, has_servers, observed_at]
          properties:
            count:
              type: integer
              minimum: 0
            has_servers:
              type: boolean
            observed_at:
              type: string
              format: date-time
        meta:
          type: object
          additionalProperties: true

    HarnessCapabilityManifestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, revision, harnessId, surface, contextKind, capabilities]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        revision:
          type: string
        harnessId:
          type: string
        surface:
          type: string
        contextKind:
          type: string
          enum: [none, project, server, paperwork]
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label, compatibleContextKinds, approvalHint]
            properties:
              id:
                type: string
              label:
                type: string
              description:
                type: string
              inputSchema:
                type: object
                additionalProperties: true
              compatibleContextKinds:
                type: array
                items:
                  type: string
              approvalHint:
                type: string
                enum: [none, required, conditional]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        service:
          type: string
        timestamp:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
        timestamp:
          type: string
          format: date-time

    AIChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: User message
          minLength: 1
          maxLength: 4000
        conversationId:
          type: string
          format: uuid
        model:
          type: string
          description: AI model to use

    AIChatResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        conversationId:
          type: string
          format: uuid
        usage:
          type: object
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string

    ProtectedRouteDenial:
      type: object
      description: Stable fail-closed denial returned by protected Gateway routes.
      required:
        - error
        - reason
        - error_code
        - reason_code
        - service
        - required_features
        - missing_features
        - retryable
        - user_guidance
      properties:
        error:
          type: string
          description: Backward-compatible coarse error category.
        reason:
          type: string
          description: Backward-compatible policy or dependency reason.
        error_code:
          type: string
          description: Stable machine-readable error category.
        reason_code:
          type: string
          description: Stable machine-readable reason for this denial.
        capability:
          type: string
          description: Product or API capability that was requested.
        service:
          type: string
          description: Gateway route service identifier.
        required_features:
          type: array
          items:
            type: string
        missing_features:
          type: array
          items:
            type: string
        retryable:
          type: boolean
        user_guidance:
          type: object
          required: [title, body, next_steps]
          properties:
            title:
              type: string
            body:
              type: string
            next_steps:
              type: array
              items:
                type: string

  responses:
    Unauthorized:
      description: Authentication required (JWT or API Key)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedRouteDenial"
    ProtectedRouteDenied:
      description: The authenticated caller is not allowed to use the requested capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedRouteDenial"
    GatewayUnavailable:
      description: Gateway authentication, policy, route configuration, or upstream service is unavailable; the request failed closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedRouteDenial"
    RateLimited:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedRouteDenial"

security:
  - bearerAuth: []
  - apiKey: []
