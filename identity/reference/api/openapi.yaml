    post:
      summary: Create AI session
      operationId: createSession
      tags: [ai]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Session created
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/ai/projects:
    get:
      summary: List caller-owned AI projects
      operationId: listAIProjects
      tags: [ai]
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/AIProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create or resolve a caller-owned AI project
      operationId: createAIProject
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
      responses:
        "200":
          description: Existing project with the same caller-scoped name
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProject"
        "201":
          description: Project created
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProject"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/ai/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read a caller-owned AI project
      operationId: getAIProject
      tags: [ai]
      responses:
        "200":
          description: Project with an ETag matching its opaque revision
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Project not found in the caller scope
    patch:
      summary: Update a caller-owned AI project
      description: Replaces project name and/or description only when If-Match equals the current project revision.
      operationId: updateAIProject
      tags: [ai]
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
      responses:
        "200":
          description: Updated project with its replacement ETag
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Project not found in the caller scope
        "409":
          description: Another caller-owned project already uses the requested name
        "412":
          description: If-Match no longer identifies the current project revision
        "428":
          description: If-Match is required

  /v1/ai/models:
    get:
      summary: List available models
      operationId: listModels
      tags: [ai]
      responses:
        "200":
          description: Model list
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/ai/responses:
    post:
