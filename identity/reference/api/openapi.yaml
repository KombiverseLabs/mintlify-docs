paths:
  /_kombify/api/v1/subdomains/reach/{base}/egress-addresses:
    servers:
      - url: https://kombify.me
        description: Direct Me edge connection; do not call through the Gateway proxy
    get:
      operationId: getMeReachEgressAddresses
      tags: [subdomains]
      summary: Observe the installation's public IPv4 egress address
      description: |
        Reuses reach authentication and active-base ownership/Guard admission.
        Answers only the direct Cloudflare HTTPS connection's CF-Connecting-IP;
        caller forwarding claims such as X-Forwarded-For are ignored. No address
        storage, additional address logging or third-party discovery fallback.
        Worker/proxy subrequests and ingress without edge TLS metadata are refused.
        Do not expose this route through a service binding that forwards caller
        headers or metadata. Registration keys have no per-minute limiter here;
        Guard proofs share 60 attempts/IP/minute and 12/binding-key/minute budgets.
        StackKits polls every 30 seconds per running application over IPv4 and
        stops the optional outbound grant if its last answer is older than 90 seconds.
      security:
        - meRegistrationKey: []
        - meGuardProof: []
      parameters:
        - name: base
          in: path
          required: true
          description: The installation's existing base name
          schema:
            type: string
            pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
      responses:
        '200':
          description: One public IPv4 observed at the edge
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items: { type: string, format: ipv4 }
        '401':
          description: Missing or invalid installation credential, as on other reach routes
        '403':
          description: Inactive/unverified caller or unsupported Cloud provisioning credential
        '404':
          description: Unknown base or a base belonging to another installation (base_not_found)
        '409':
          description: |
            No address: egress_ipv4_required for IPv6, egress_connection_untrusted
            for proxy/binding ingress or absent edge TLS metadata,
            egress_address_unavailable for missing/malformed/non-public IPv4,
            or the family's base_inactive/reach_snapshot_conflict admission refusal.
          content:
            application/json:
              schema:
                type: object
                required: [error, error_code, retryable]
                properties:
                  error: { type: string }
                  error_code:
                    type: string
                    enum: [egress_ipv4_required, egress_connection_untrusted, egress_address_unavailable, base_inactive, reach_snapshot_conflict]
                  retryable: { type: boolean, const: false }
        '429':
          description: Existing Guard attempt budget exhausted; the kit treats this as unavailable
          headers:
            Retry-After:
              schema: { type: string, const: '60' }
        '503':
          description: Reach unconfigured or Guard admission unavailable
  /v1/entitlements/flags:
    get:
      operationId: getOwnDisplayFlags
      summary: Read the signed-in person's effective display flags
      description: |
        Display hints only; backend enforcement remains authoritative. Requires the person's
        own first-party Auth0 bearer through the shared validator and own-token admission,
        narrowed to the configured API audience and existing shared first-party approval-surface
        and Connect native registries, plus configured device/CLI clients. Issuer comes from
        the shared entitlement validator (MCP_AUTH0_ISSUER, otherwise AUTH0_ISSUER).
        Customer MCP audiences (including mixed API/MCP), unmapped clients, demo, service,
        machine, API-key, delegated, actor-marked (including staff impersonation), agent and
        external-client identities are refused. Only tool and repeated keys are accepted; subject and context
        come exclusively from the verified bearer, never identity headers.

        tool selects a backend projection of this caller's own flags, granting no tool access.
        Uses the current entitlement projection and the existing Flagship/KV evaluation with
        cached subject preview preference, tester-group and account overrides. Uses the same
        backend projection function as signed hops: Homelab runtime values reflect exact raw
        entitlements, Cloud's synthetic preview key is Gateway-sourced. Admitted signed-catalog
        MCP surfaces add policy keys with the same evaluation and merge used in MCP preflight.
        The client names its keys: 1–50 repeated keys parameters, each matching
        ^[a-z0-9][a-z0-9._:-]{0,127}$. Missing, empty, malformed or over-limit keys,
        comma-separated lists, invalid/duplicate tool or any other parameter return 400.
        Only requested final provider-sourced boolean values are returned after projection;
        provider false remains false. Missing, unevaluated, KV-default or Gateway-granted
        keys are absent. Budgets, entitlements, identity context and signatures are excluded.
        Unrequested definitions, including operational-looking ones, are never returned.
        tool selects the backend projection only, not definition ownership. Requested keys
        use the evaluator's existing normalization and aliases; response property names
        preserve the requested spellings. The read evaluates the requested keys only and
        reads no budget, so a display read waits for those key evaluations instead of
        every registered flag key and budget.
        DEFAULT is omitted. ERROR is omitted and incomplete. FLAG_NOT_FOUND is omitted
        without making the result incomplete; other errors are omitted and incomplete.
        Other reasons (including STATIC, TARGETING_MATCH or absent reason) with no error
        code remain provider-sourced. Missing provider details make the result incomplete.

        complete describes flags only: failed/timed-out boolean provider reads, an existing
        preview source or required policy projection make it false. Budget/sponsor failures
        do not. Completeness describes the flags this answer carries (the requested keys
        and an admitted MCP policy's keys), not every registered flag key.
        A missing preview binding means no preview source. KV fallback values are
        excluded, so a fallback-KV failure alone cannot invalidate successful provider flags;
        catalog-KV failures still invalidate a required policy projection.
        Complete responses expire in 120 seconds; incomplete responses expire in 15 seconds.
        Fetch at sign-in with the displayed tool and the keys that client renders. Store only
        complete maps in the session, bound to the requested key set, and
        refresh by expires_at; on complete:false keep the previous complete map and retry at
        expires_at. Without a previous map use built-in defaults. Clear on sign-out/account
        change. Offline and self-hosted clients keep built-in defaults. The 120-second lifetime
        bounds staff-change display lag (plus the preview cache's existing 30 seconds); 15 seconds
        avoids treating a transient outage as a two-minute decision. HTTP storage is disabled.

        Uses the interactive limiter: one pre-auth flood token and one verified tenant/subject
        token per admitted GET. Unlike /current, Vary explicitly names Authorization and Origin
        as defense in depth for the personal payload; no-store and static * CORS make it redundant.
      parameters:
        - in: query
          name: tool
          required: true
          description: Existing first-party backend projection to display; no subject selection or access grant
          schema:
            type: string
            enum: [homelab, cloud, paperwork, ai, agents, speechkit, simulation, stackkits, sites, workpaths]
        - in: query
          name: keys
          required: true
          description: Client-rendered keys; 1–50 repeated parameters. Duplicates count toward the limit; responses preserve requested spellings.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: string
              pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
      security: [{ bearerAuth: [] }]
      tags: [gateway]
      responses:
        "200":
          description: The caller's display hints, valid until expires_at
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
            Vary:
              schema: { type: string, const: 'Authorization, Origin' }
            Server-Timing:
              description: >-
                Per-phase durations of the read in milliseconds, for example
                "rate_limit;dur=1, credential;dur=4, flags;dur=210". Durations only;
                no request data.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema, tool, flags, complete, expires_at]
                properties:
                  schema: { type: string, const: kombify.flags.current.v1 }
                  tool:
                    type: string
                    enum: [homelab, cloud, paperwork, ai, agents, speechkit, simulation, stackkits, sites, workpaths]
                  complete: { type: boolean }
                  flags:
                    type: object
                    additionalProperties: { type: boolean }
                  expires_at: { type: string, format: date-time }
              example:
                schema: kombify.flags.current.v1
                tool: homelab
                flags: { example.preview: true }
                complete: true
                expires_at: '2026-11-11T18:02:00.000Z'
        "400": { description: Missing, unknown or duplicate tool, or any other query parameter (invalid_request) }
        "401": { description: Missing or invalid bearer (unauthorized) }
        "403": { description: Not the person's own first-party human token (own_token_required) }
        "429":
          description: Interactive flood or verified-subject budget consumed or unavailable; structured gateway_throttle denial
          headers:
            Retry-After: { schema: { type: integer, const: 60 } }
            X-RateLimit-Bucket: { schema: { type: string, const: interactive } }
        "405": { description: Only GET and OPTIONS are supported }
        "503": { description: Validator unavailable (flags_current_unavailable), or current entitlement projection unavailable (entitlement_projection_unavailable, retryable true) }
    options:
      operationId: ownDisplayFlagsPreflight
      summary: Preflight the own display-flags read
      security: []
      tags: [gateway]
      responses:
        "204": { description: Allows GET with the Authorization header; no flag data }

  /v1/entitlements/flags/public/cloud:
    get:
      operationId: publicCloudDisplayFlags
      summary: Read everyone-released Cloud display flags without signing in
      description: No query parameters. Returns only allowlisted keys with a current unrestricted release and an affirmative provider match. Grants no backend authority.
      security: []
      tags: [gateway]
      responses:
        "200":
          description: Public display hints; cacheable for no more than 30 seconds, never beyond expires_at
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema, flags, expires_at]
                properties:
                  schema: { type: string, const: kombify.flags.public.cloud.v1 }
                  flags:
                    type: object
                    additionalProperties: false
                    properties:
                      cloud.pricing.launch: { type: boolean, const: true }
                  expires_at: { type: string, format: date-time }
        "400": { description: Query parameters are not supported }
        "429": { description: Interactive flood budget consumed or unavailable }
        "503": { description: Policy or provider answer could not be verified; not cached }

  /v1/supply-dock/admin/resources:
    get:
      operationId: listSupplyDockAdministrativeResources
      summary: List all administrable Supply Dock resources
      description: Direct human staff read (admin, global_admin, developer or manager). Writes require admin or global_admin. Includes baseline and unpublished source resources; personal connections remain scoped to the viewing owner.
      security: [{ bearerAuth: [] }]
      tags: [supply-dock]
      responses:
        "200":
          description: Current resource administration view
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, resources, categories]
                properties:
                  schemaVersion: { const: kombify.supply-dock-administration.v1 }
                  resources:
                    type: array
                    items: { $ref: "#/components/schemas/SupplyDockAdministrativeResource" }
                  categories:
                    type: array
                    items: { type: object, required: [category], properties: { category: { type: string } } }
        "403": { $ref: "#/components/responses/ProtectedRouteDenied" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }

  /v1/supply-dock/admin/resources/{productId}:
    patch:
      operationId: updateSupplyDockResourceAdministration
      summary: Enable or disable one Supply Dock resource
      description: Direct human admin or global_admin only. Preserves connections and assignments; enabling grants no authority. Encode the complete canonical product ID as a single path segment.
      security: [{ bearerAuth: [] }]
      tags: [supply-dock]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, expectedRevision]
              properties:
                enabled: { type: boolean }
                expectedRevision: { type: integer, minimum: 0, maximum: 9007199254740990 }
                reason: { type: string, minLength: 1, maxLength: 500, description: Optional reason without control characters. }
      responses:
        "200":
          description: Persisted current administration state
          content:
            application/json:
              schema:
                type: object
                required: [productId, administration]
                properties:
                  productId: { type: string }
                  administration: { $ref: "#/components/schemas/SupplyDockAdministrationState" }
        "403": { $ref: "#/components/responses/ProtectedRouteDenied" }
        "404": { description: Unknown resource in the current administrative catalog }
        "409": { description: Stale expectedRevision; reply includes current productId and administration }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }

  /v1/supply-dock/resources/check:
    post:
      operationId: checkSupplyDockResourceAvailability
      summary: Read current administrative availability for known resources
      description: Authenticated metadata read, also accepted for currently verified phone, workflow and signed device-event runtime credentials. Grants no access and consumes no model-answer use. Unknown or disconnected resources return known=false, enabled=false, revision=0; they grant nothing and can be omitted from a run loadout.
      tags: [supply-dock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productIds]
              properties:
                productIds: { type: array, minItems: 1, maxItems: 200, items: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: Current availability, including parent resource restrictions
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, resources]
                properties:
                  schemaVersion: { const: kombify.supply-dock-resource-check.v1 }
                  resources:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      required: [productId, known, enabled, revision]
                      properties:
                        productId: { type: string }
                        known: { type: boolean }
                        enabled: { type: boolean }
                        revision: { type: integer, minimum: 0 }
        "403": { $ref: "#/components/responses/ProtectedRouteDenied" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }

  /v1/connectors/direct/{connectorId}/mastra-connect:
    post:
      operationId: startMastraConnectorConsent
      summary: Start owner-scoped hosted Mastra Connect consent
      description: Direct human owner with Supply Dock access. The short-lived launch URL is an owner consent capability. AI Platform derives resourceId from verified owner and tenant; Gateway retains no secret.
      security: [{ bearerAuth: [] }]
      tags: [connectors]
      parameters:
        - in: path
          name: connectorId
          required: true
          schema: { enum: [mastragmail, mastraslack, mastragithub, mastranotion] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accessToken, projectId, region]
              properties:
                accessToken: { type: string, minLength: 8, maxLength: 4096, writeOnly: true }
                projectId: { type: string, minLength: 1, maxLength: 200 }
                region: { enum: [default, us, eu] }
      responses:
        "200":
          description: Scoped consent session; no automatic replay on failure
          content:
            application/json:
              schema:
                type: object
                required: [connectionId, resourceId, connectUrl, expiresAt]
                properties:
                  connectionId: { type: string }
                  resourceId: { type: string }
                  connectUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/ProtectedRouteDenied" }
        "503": { $ref: "#/components/responses/GatewayUnavailable" }
  # ==========================================================================
  # Gateway Health
  # ==========================================================================
  /gateway/health:
    get:
      summary: Gateway health check
      description: Returns gateway health directly (no upstream dependency). Always responds 200 if the edge worker is running.
      operationId: gatewayHealth
      tags: [gateway]
      security: []
      responses:
        "200":
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: kombify-gateway

  # ==========================================================================
  # Homelab Health / Readiness
  # ==========================================================================
  /health:
    get:
      summary: Homelab health check
      description: Proxied to the Homelab backend. Returns backend health status.
      operationId: homelabHealth
      tags: [orchestrator]
      security: []
      responses:
        "200":
          description: Backend is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      summary: Homelab readiness probe
      description: Checks if the Homelab backend can accept traffic.
      operationId: homelabReady
      tags: [orchestrator]
      security: []
      responses:
        "200":
          description: Backend is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Backend is not ready

  # ==========================================================================
  # Orchestrator (Homelab)
  # ==========================================================================
  /v1/orchestrator:
    get:
      summary: Orchestrator API root
      description: |
        All `/v1/orchestrator/**` requests are proxied to the Homelab backend.
        Path is stripped — `/v1/orchestrator/foo` becomes `/foo` on the backend.
      operationId: orchestratorRoot
      tags: [orchestrator]
      responses:
        "200":
          description: Successful response from Homelab
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Orchestrator API (write)
      operationId: orchestratorWrite
      tags: [orchestrator]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Successful response
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/orchestrator/ai:
    post:
      summary: Orchestrator AI endpoints
      description: AI-specific endpoints with stricter rate limits (60/min vs 300/min). Path stripped.
      operationId: orchestratorAI
      tags: [orchestrator]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: AI response from Homelab
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ==========================================================================
  # Capabilities (authenticated)
  # ==========================================================================
  /v1/capabilities:
    get:
      summary: Platform capabilities discovery
      description: Returns available platform capabilities and features. Authentication is required at the Gateway; anonymous callers are not admitted.
      operationId: getCapabilities
      tags: [orchestrator]
      responses:
        "200":
          description: Capabilities list
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==========================================================================
  # Simulation (kombiSim)
  # ==========================================================================
  /v1/simulation:
    get:
      summary: Simulation API root
      description: |
        All `/v1/simulation/**` requests are proxied to kombiSim.
        Path is stripped — `/v1/simulation/foo` becomes `/foo` on the backend.
        Long timeouts (5 min) for simulation workloads.
      operationId: simulationRoot
      tags: [simulation]
      responses:
        "200":
          description: Simulation response
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/simulation/health:
    get:
      summary: Simulation health check
      description: Public health endpoint for kombiSim. No authentication required.
      operationId: simulationHealth
      tags: [simulation]
      security: []
      responses:
        "200":
          description: kombiSim is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/simulation/auth-mode:
    get:
      summary: Simulation auth mode
      description: Returns the current authentication mode of the simulation service. Public.
      operationId: simulationAuthMode
      tags: [simulation-auth]
      security: []
      responses:
        "200":
          description: Auth mode configuration

  /v1/simulation/auth/methods:
    get:
      summary: Available auth methods
      description: Lists available authentication methods for the simulation service. Public.
      operationId: simulationAuthMethods
      tags: [simulation-auth]
      security: []
      responses:
        "200":
          description: Auth methods list

  /v1/simulation/auth/oauth/url:
    get:
      summary: OAuth authorization URL
      description: Returns the OAuth authorization URL for simulation login. Public.
      operationId: simulationOAuthUrl
      tags: [simulation-auth]
      security: []
      responses:
        "200":
          description: OAuth URL

  /v1/simulation/auth/callback:
    post:
      summary: OAuth callback
      description: Handles OAuth callback after authentication. Public.
      operationId: simulationAuthCallback
      tags: [simulation-auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
