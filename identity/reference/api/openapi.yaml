  # Agents — Canonical Runtime API
  # ==========================================================================
  /v1/agents:
    post:
      summary: Agents runtime endpoint
      description: Canonical kombify-Agents runtime endpoint. Detailed service-specific contracts live in the kombify-Agents repository.
      operationId: agentsRun
      tags: [agents]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Agents response
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/agents/harnesses:
    get:
      summary: Surface-filtered harness catalog
      description: >-
        Projects the Agents-owned HarnessSurfaceManifestV1 after fail-closed
        Gateway filtering by authenticated principal, surface, role, and
        entitlement. Internal policy and trusted prompt/tool-policy fields are
        never returned.
      operationId: getHarnessSurfaceManifest
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/HarnessSurface"
      responses:
        "200":
          description: Principal- and surface-filtered harness manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSurfaceManifestV1"
        "400":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/agents/harnesses/{harnessId}/capabilities:
    get:
      summary: Surface- and context-filtered harness capabilities
      description: >-
        Returns allowlisted capability metadata only. Trusted prompts and tool
        policy remain inside Agents, and unverifiable capability policy fails
        closed.
      operationId: getHarnessCapabilities
      tags: [agents]
      parameters:
        - name: harnessId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,127}$"
        - $ref: "#/components/parameters/HarnessSurface"
        - $ref: "#/components/parameters/HarnessContextKind"
      responses:
        "200":
          description: Authorized public capability metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessCapabilityManifestV1"
        "400":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/agents/workbench-orchestrator/harnesses:
    get:
      deprecated: true
      summary: Legacy alias for surface-filtered harness catalog
      description: Measured compatibility alias for `GET /v1/agents/harnesses`; it is not a second catalog.
      operationId: getLegacyHarnessSurfaceManifest
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/HarnessSurface"
      responses:
        "200":
          description: Principal- and surface-filtered harness manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSurfaceManifestV1"
        "400":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "502":
          $ref: "#/components/responses/GatewayUnavailable"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  # ==========================================================================
  # Agents — A2A Federation
  # ==========================================================================
  /a2a:
    get:
      summary: A2A agent card discovery
      description: Returns the agent card for Agent-to-Agent federation protocol.
      operationId: a2aDiscover
      tags: [agents-a2a]
      responses:
        "200":
          description: Agent card
    post:
      summary: A2A JSON-RPC
      description: Agent-to-Agent JSON-RPC message exchange.
      operationId: a2aRpc
      tags: [agents-a2a]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: RPC response

  # ==========================================================================
  # Public Beta Connector / Harness / RIL Policy Surfaces
  # ==========================================================================
  /v1/connectors/catalog:
    get:
      summary: Connector catalog
      description: Lists Gateway-approved connector surfaces. Responses never contain OAuth tokens, MCP credentials, or provider secrets.
      operationId: listConnectorCatalog
      tags: [connectors]
      responses:
        "200":
          description: Approved connector catalog
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connectors/providers:
    get:
      summary: Connector provider directory
      description: One entry per vendor or tool with every way it can be connected, the one-click way, and the caller's own connection and Companion state (schema kombify.connector-providers.v1; companion is { active, canActivate, reason? } with reason not_connected, always_on or not_supported where canActivate is false). Human owner only; requires the supplydock.access flag.
      operationId: listConnectorProviders
      tags: [connectors]
      responses:
        "200":
          description: Provider directory
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a human owner (agent, delegated or demo principal)

  /v1/connectors/providers/{providerId}/companion:
    put:
      summary: Switch a connected provider on or off for the Companion
      description: The person switches their own connection of a provider on or off for their Companion (kombify-ai). The connection is the directory's (no client-supplied grant, connector or binding id); off revokes the Companion's binding and keeps the connection. Idempotent. Human owner only; requires the supplydock.access flag. companion.reason in the directory says where there is no switch (not_connected, always_on, not_supported).
      operationId: setConnectorProviderCompanion
      tags: [connectors]
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: "{ providerId, companion: { active, canActivate } }"
        "400":
          description: "Body is not { active: boolean }"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a human owner (agent, delegated or demo principal)
        "404":
          description: Unknown provider (connector_provider_not_found)
        "409":
          description: connector_not_connected, or companion_activation_unavailable (the body carries companion.reason)
        "502":
          description: companion_overlay_unavailable or companion_binding_unavailable (retry; the switch is idempotent)
        "503":
          description: companion_state_unavailable

  /v1/connectors/grants:
    post:
      summary: Create connector grant metadata
      description: Stores tenant-scoped grant metadata and an opaque vault reference. Raw token fields are rejected.
      operationId: createConnectorGrant
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectorId]
              properties:
                connectorId:
                  type: string
                vaultRef:
                  type: string
                  description: Opaque Auth0 Token Vault or server-side MCP reference.
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Redacted grant metadata
        "400":
          description: Invalid body or raw credentials rejected
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/connectors/oauth/paperwork/complete:
    post:
      summary: Complete Paperwork connector OAuth consent
      description: Creates an active Paperwork connector grant only from a signature-verified Paperwork-audience user token; bearer credentials are never stored. The grant records the connection, not a ceiling for the person's own agents, which act with the whole Paperwork profile unless every Paperwork grant is revoked (D-2026-10-23-06).
      operationId: completePaperworkConnectorOAuth
      tags: [connectors]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName:
                  type: string
      responses:
        "201":
          description: Redacted, OAuth-verified grant metadata
        "400":
          description: Caller-supplied authorization state or raw credentials rejected
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The verified token is missing required owner, client, audience, or consent scope claims

  /v1/connectors/grants/{grantId}:
    delete:
      summary: Revoke connector grant metadata
      operationId: deleteConnectorGrant
      tags: [connectors]
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redacted revoked grant metadata
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Grant not found for tenant

  # ==========================================================================
  # Household media (preview, single-feature flag media.household, default off)
  # ==========================================================================
  /v1/media/overview:
    get:
      operationId: getHouseholdMediaOverview
      summary: Sources, targets and sessions of the caller's household media
      description: |
        Preview. Direct human principal only; single-feature flag `media.household` (default off, 404). Answered by the
        `media` app of the caller's own newest paired homelab host (`media.overview`), relayed with lease id
        `owner-direct`. Without a paired host the overview is empty. Contract: `companion/docs/MEDIA-API.md`.
      security: [{ bearerAuth: [] }]
      tags: [media]
      responses:
        "200":
          description: "`kombify.media.overview.v1`: `sources`, `targets` and `sessions`"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ProtectedRouteDenied" }
        "404":
          description: The flag `media.household` is off
        "502":
          description: "`homelab_app_dispatch_uncertain`: the host's answer was lost or malformed"
  /v1/media/sources/{source}/items:
    get:
      operationId: listHouseholdMediaItems
      summary: Items of one source for one kind (`media.items`)
      security: [{ bearerAuth: [] }]
      tags: [media]
      parameters:
        - { in: path, name: source, required: true, schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$" } }
        - { in: query, name: kind, required: true, schema: { enum: [films, music, photos] } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: "`{ items: [...] }`" }
        "400": { $ref: "#/components/responses/ProtectedRouteDenied" }
        "409": { description: "`media_source_unavailable`: no paired homelab host" }
  /v1/media/play:
    post:
      operationId: playHouseholdMedia
      summary: Start an item on targets (`media.play`)
      security: [{ bearerAuth: [] }]
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, item_id, target_ids]
              properties:
                source_id: { type: string }
                item_id: { type: string }
                target_ids: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
      responses:
        "202": { description: "`{ session_id }`" }
        "400": { $ref: "#/components/responses/ProtectedRouteDenied" }
        "409": { description: "`media_target_unreachable` (no paired host) or a host refusal such as `media_item_not_playable`" }
  /v1/media/sessions/{session}/command:
    post:
      operationId: commandHouseholdMediaSession
      summary: Pause, resume, skip or stop a session (`media.command`)
      security: [{ bearerAuth: [] }]
      tags: [media]
      parameters:
        - { in: path, name: session, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { enum: [pause, resume, next, previous, stop] }
      responses:
        "202": { description: "`{ state }`" }
        "409": { description: "`media_target_unreachable` or a host refusal" }
  /v1/media/sessions/{session}/targets:
    put:
      operationId: retargetHouseholdMediaSession
      summary: Move or extend a session to exactly these targets (`media.retarget`)
      security: [{ bearerAuth: [] }]
      tags: [media]
      parameters:
        - { in: path, name: session, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_ids]
              properties:
                target_ids: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
      responses:
        "200": { description: "`{ target_ids }`" }
        "400": { description: "`media_target_required` (empty list) or invalid ids" }
        "409": { description: "`media_target_unreachable` or a host refusal" }
  /v1/media/targets/{target}/volume:
    put:
      operationId: setHouseholdMediaVolume
      summary: Set a target's volume (`media.volume`)
      security: [{ bearerAuth: [] }]
      tags: [media]
      parameters:
        - { in: path, name: target, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volume]
              properties:
                volume: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200": { description: "`{ volume }`" }
        "409": { description: "`media_target_unreachable` or a host refusal" }
  /v1/media/connections:
    post:
      operationId: connectHouseholdMediaDevice
      summary: Hand a device found in the home network to the host (`media.connect`)
      security: [{ bearerAuth: [] }]
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, name]
              properties:
                role: { enum: [target, source] }
                provider: { enum: [sonos, google_cast, spotify_connect, airplay, jellyfin] }
                name: { type: string, maxLength: 500 }
                discovery_id: { type: string, maxLength: 500 }
                service_type: { type: string }
                host: { type: string, maxLength: 500 }
                port: { type: integer }
                model: { type: string, maxLength: 500 }
      responses:
        "201": { description: "`{ id }`" }
        "409": { description: "`media_target_unreachable`, `media_account_required` or another host refusal" }
  /v1/media/announce:
    post:
      operationId: announceHouseholdMedia
      summary: Not served yet
      security: [{ bearerAuth: [] }]
      tags: [media]
      responses:
        "501": { description: "`media_announce_unsupported`" }

  /v1/harnesses/kombify-ai/settings:
    get:
      summary: kombify-ai harness connector projection
      operationId: getKombifyAiHarnessSettings
      tags: [harnesses]
      responses:
