  /v1/harnesses/{mode}/connector-bindings:
    post:
      summary: Create harness connector binding
      description: Binds an active grant to a harness. `support` is denied; `ril-ops` requires server/signal/action-card/self-healing context.
      operationId: createHarnessConnectorBinding
      tags: [harnesses]
      parameters:
        - name: mode
          in: path
          required: true
          schema:
            type: string
            enum: [kombify-ai, ril-ops, support]
      responses:
        "201":
          description: Redacted connector binding
        "403":
          description: Harness or connector not allowed
        "409":
          description: Grant missing or not active

  /v1/ril/servers/summary:
    get:
      summary: Tenant-scoped RIL server presence
      description: >-
        Returns the authenticated user's Homelab server count for ril-ops
        availability gating. Requires a user or delegated user (OBO), a
        matching organization, and a RIL read entitlement. An optional
        `tenant` query value must exactly match the authenticated organization.
        The compatibility alias `/v1/homelab/servers/summary` has the same
        policy and response contract.
      operationId: getRilServerSummary
      tags: [ril]
      parameters:
        - name: tenant
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tenant-scoped server presence summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RilServerSummaryEnvelope"
        "400":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "405":
          $ref: "#/components/responses/ProtectedRouteDenied"
        "503":
          $ref: "#/components/responses/GatewayUnavailable"

  /v1/ril/{path}:
    get:
      summary: RIL policy-preflighted read route
      operationId: rilReadRoute
      tags: [ril]
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proxied Homelab response after Gateway policy
        "403":
          description: Entitlement, tenant, signal, or raw tool denied
    post:
      summary: RIL policy-preflighted mutation route
      operationId: rilMutationRoute
      tags: [ril]
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proxied Homelab response after Gateway policy
        "409":
          description: Connector grant, binding, or approval required

components:
  securitySchemes:
    meRegistrationKey:
      type: apiKey
      in: header
      name: X-Kombify-API-Key
      description: Existing Me installation key (kbi_); reach also accepts Authorization Bearer kbi_...
    meGuardProof:
      type: http
      scheme: KombifyGuard
      description: Existing base-bound Guard host proof, verified by Me
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0-issued JWT token for kombify APIs
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key from your kombify dashboard

  parameters:
    HarnessSurface:
      name: surface
      in: query
      required: true
      schema:
        type: string
        enum: [workbench, workbench-panel, workbench-studio, cloud, administration, paperwork, cmo, homelab, mobile, wearable, box]
    HarnessContextKind:
      name: contextKind
      in: query
      required: true
      schema:
        type: string
        enum: [none, project, server, paperwork]

  schemas:
    SupplyDockAdministrationState:
      type: object
      required: [enabled, revision]
      properties:
        enabled: { type: boolean }
        revision: { type: integer, minimum: 0 }
        reason: { type: string, maxLength: 500 }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    SupplyDockAdministrativeResource:
      type: object
      required: [productId, category, id, name, description, administration]
      properties:
        productId: { type: string }
        category: { type: string }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        administration: { $ref: "#/components/schemas/SupplyDockAdministrationState" }
    AIProject:
      type: object
      additionalProperties: false
      required: [id, name, revision, chatCount, fileCount, totalBytes, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        revision:
          type: string
          description: Opaque revision mirrored by the response ETag.
        chatCount:
          type: integer
          minimum: 0
        fileCount:
          type: integer
          minimum: 0
        totalBytes:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HarnessAvailabilityUserGuidance:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        nextSteps:
          type: array
          items:
            type: string

    HarnessSurfaceManifestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, revision, harnesses]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        revision:
          type: string
        harnesses:
          type: array
          items:
            $ref: "#/components/schemas/HarnessSurfaceManifestEntryV1"

    HarnessSurfaceManifestEntryV1:
      type: object
      additionalProperties: false
      required: [id, label, order, group, expertScope, surfaceAccess, availability, voice, context, dispatch]
      properties:
        id:
          type: string
        label:
          type: string
        order:
          type: integer
          minimum: 0
        group:
          type: string
        expertScope:
          type: string
          enum: [shared-experts, own-experts]
        surfaceAccess:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [surface, mode]
            properties:
              surface:
                type: string
                enum: [workbench, workbench-panel, workbench-studio, cloud, administration, paperwork, cmo, homelab, mobile, wearable, box]
              mode:
                type: string
                enum: [switchable, fixed-only, studio-only]
        availability:
          type: object
          additionalProperties: false
          required: [state, allowed, requiredFeatures, missingFeatures, retryable, supportContext]
          properties:
            state:
              type: string
              enum: [available, disabled, blocked, pending, degraded, unavailable]
            allowed:
              type: boolean
            errorCode:
              type: string
            reasonCode:
              type: string
            requiredFeatures:
              type: array
              maxItems: 64
              items:
                type: string
            missingFeatures:
              type: array
              maxItems: 64
              items:
                type: string
            retryable:
              type: boolean
            userGuidance:
              $ref: "#/components/schemas/HarnessAvailabilityUserGuidance"
            supportContext:
              type: object
              maxProperties: 32
              additionalProperties:
                oneOf:
                  - type: string
                  - type: boolean
                  - type: number
        voice:
          type: object
          additionalProperties: false
          required: [dictation, assistActivation, voiceAgentEntry]
          properties:
            dictation:
              type: boolean
            assistActivation:
              type: string
              enum: [hands-free-only, unavailable]
            voiceAgentEntry:
              type: string
              enum: [split-control, launcher-badge, unavailable]
        context:
          type: object
          additionalProperties: false
          required: [kind, manualDimensions]
          properties:
            kind:
              type: string
              enum: [none, project, server, paperwork]
            manualDimensions:
              type: array
              items:
                type: string
        dispatch:
          type: object
          additionalProperties: false
          required: [protocol, method, agentId, runHref, harnessMode]
          properties:
            protocol:
              type: string
              enum: [ag-ui]
            method:
              type: string
              enum: [POST]
            agentId:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]{0,127}$"
            runHref:
              type: string
              pattern: "^/ag-ui/[a-z0-9][a-z0-9-]{0,127}/runs$"
            harnessMode:
              type: string
              pattern: "^[a-z0-9][a-z0-9-]{0,127}$"
        capabilitiesHref:
          type: string

    RilServerSummaryEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [count, has_servers, observed_at]
          properties:
            count:
              type: integer
              minimum: 0
            has_servers:
              type: boolean
            observed_at:
              type: string
              format: date-time
        meta:
          type: object
          additionalProperties: true

    HarnessCapabilityManifestV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, revision, harnessId, surface, contextKind, capabilities]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        revision:
          type: string
        harnessId:
          type: string
        surface:
          type: string
          enum: [workbench, workbench-panel, workbench-studio, cloud, administration, paperwork, cmo, homelab, mobile, wearable, box]
        contextKind:
          type: string
          enum: [none, project, server, paperwork]
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label, compatibleContextKinds, approvalHint]
            properties:
              id:
                type: string
              label:
                type: string
              description:
                type: string
              inputSchema:
                type: object
                additionalProperties: true
              compatibleContextKinds:
                type: array
                items:
                  type: string
              approvalHint:
                type: string
                enum: [none, required, conditional]

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        service:
          type: string
        timestamp:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
        timestamp:
          type: string
          format: date-time

    AIChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: User message
          minLength: 1
          maxLength: 4000
        conversationId:
          type: string
          format: uuid
        model:
          type: string
          description: AI model to use

    AIChatResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        conversationId:
          type: string
          format: uuid
        usage:
          type: object
          properties:
            inputTokens:
              type: integer
            outputTokens:
              type: integer

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string

    ProtectedRouteDenial:
      type: object
      description: Stable fail-closed denial returned by protected Gateway routes.
      required:
        - error
        - reason
        - error_code
        - reason_code
        - service
        - required_features
        - missing_features
        - retryable
        - user_guidance
      properties:
        error:
          type: string
          description: Backward-compatible coarse error category.
        reason:
          type: string
          description: Backward-compatible policy or dependency reason.
        error_code:
          type: string
          description: Stable machine-readable error category.
        reason_code:
          type: string
          description: Stable machine-readable reason for this denial.
        capability:
          type: string
          description: Product or API capability that was requested.
        service:
          type: string
          description: Gateway route service identifier.
        required_features:
          type: array
          items:
            type: string
        missing_features:
          type: array
          items:
            type: string
        retryable:
          type: boolean
        user_guidance:
          type: object
          required: [title, body, next_steps]
          properties:
            title:
              type: string
            body:
              type: string
            next_steps:
              type: array
              items:
                type: string

  responses:
    Unauthorized:
      description: Authentication required (JWT or API Key)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedRouteDenial"
    ProtectedRouteDenied:
      description: The authenticated caller is not allowed to use the requested capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedRouteDenial"
    GatewayUnavailable:
      description: Gateway authentication, policy, route configuration, or upstream service is unavailable; the request failed closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedRouteDenial"
    RateLimited:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProtectedRouteDenial"

security:
  - bearerAuth: []
  - apiKey: []
